    <style>
        body {
            background-color: #F8FAFC;
            color: #0F172A;
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }
        .font-outfit {
            font-family: 'Outfit', sans-serif;
        }
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #F1F5F9;
        }
        ::-webkit-scrollbar-thumb {
            background: #CBD5E1;
            border-radius: 9999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94A3B8;
        }
        .enterprise-card {
            background: #FFFFFF;
            border: 1px solid #E2E8F0;
            box-shadow: 0 1px 3px 0 rgba(15, 23, 42, 0.03);
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .enterprise-card:hover {
            border-color: #CBD5E1;
            box-shadow: 0 4px 16px -2px rgba(15, 23, 42, 0.06);
        }
        .modal-backdrop {
            animation: fadeIn 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        .modal-content {
            animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; backdrop-filter: blur(0px); }
            to { opacity: 1; backdrop-filter: blur(4px); }
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(16px) scale(0.96); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        .btn-press {
            transition: all 0.15s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .btn-press:active {
            transform: scale(0.97);
        }
        *:focus-visible {
            outline: 2px solid #7B1E22;
            outline-offset: 2px;
        }
        @media print {
            body * { visibility: hidden; }
            #printableReceipt, #printableReceipt * { visibility: visible; }
            #printableReceipt { position: absolute; left: 0; top: 0; width: 100%; color: #000; background: #fff; }
        }
    </style>
</head>

        // =====================================================================
        // UNIVERSAL NOTIFICATION CENTER DROPDOWN & POPOVER
        // =====================================================================
        function NotificationCenterPopover({ notifications = [], onMarkRead, onMarkAllRead, isOpen, onClose }) {
            const [filter, setFilter] = useState('all');
            
            if (!isOpen) return null;

            const filteredNotifs = notifications.filter(n => filter === 'all' || (filter === 'unread' && !n.is_read));
            const unreadCount = notifications.filter(n => !n.is_read).length;

            const getTypeBadge = (type) => {
                switch(type) {
                    case 'link_request': return { bg: 'bg-amber-100 text-amber-900 border-amber-300', label: 'Parent Request' };
                    case 'link_accepted': return { bg: 'bg-emerald-100 text-emerald-900 border-emerald-300', label: 'Link Approved' };
                    case 'link_rejected': return { bg: 'bg-rose-100 text-rose-900 border-rose-300', label: 'Link Declined' };
                    case 'wallet_topup': return { bg: 'bg-blue-100 text-blue-900 border-blue-300', label: 'Top-Up' };
                    case 'account_created': return { bg: 'bg-purple-100 text-purple-900 border-purple-300', label: 'Account' };
                    default: return { bg: 'bg-slate-100 text-slate-800 border-slate-300', label: 'System' };
                }
            };

            return (
                <div className="absolute right-0 top-12 w-80 sm:w-96 bg-white border border-slate-200 rounded-2xl shadow-elevated z-50 overflow-hidden animate-in fade-in duration-150">
                    <div className="p-4 bg-slate-900 text-white flex justify-between items-center">
                        <div className="flex items-center gap-2">
                            <Icon.Bell className="w-4 h-4 text-amber-400" />
                            <h3 className="font-outfit font-bold text-sm">Notification Center</h3>
                            {unreadCount > 0 && <span className="bg-brand-700 text-white text-[10px] font-bold px-2 py-0.5 rounded-full">{unreadCount} New</span>}
                        </div>
                        <div className="flex items-center gap-2">
                            {unreadCount > 0 && (
                                <button onClick={onMarkAllRead} className="text-[10px] text-amber-300 hover:underline font-medium">Mark all read</button>
                            )}
                            <button onClick={onClose} className="text-slate-400 hover:text-white p-1 rounded"><Icon.X className="w-3.5 h-3.5" /></button>
                        </div>
                    </div>

                    <div className="p-2 bg-slate-50 border-b border-slate-200 flex gap-1 text-[11px] font-bold">
                        <button onClick={() => setFilter('all')} className={`flex-1 py-1 rounded-lg text-center transition-colors ${filter === 'all' ? 'bg-white text-slate-900 shadow-xs' : 'text-slate-500 hover:text-slate-800'}`}>All ({notifications.length})</button>
                        <button onClick={() => setFilter('unread')} className={`flex-1 py-1 rounded-lg text-center transition-colors ${filter === 'unread' ? 'bg-white text-slate-900 shadow-xs' : 'text-slate-500 hover:text-slate-800'}`}>Unread ({unreadCount})</button>
                    </div>

                    <div className="max-h-80 overflow-y-auto divide-y divide-slate-100">
                        {filteredNotifs.length === 0 ? (
                            <div className="p-6 text-center text-slate-400 space-y-1">
                                <Icon.Bell className="w-8 h-8 mx-auto opacity-30" />
                                <p className="text-xs">No notifications to display</p>
                            </div>
                        ) : (
                            filteredNotifs.map(n => {
                                const badge = getTypeBadge(n.type);
                                return (
                                    <div key={n.id} onClick={() => onMarkRead(n.id)} className={`p-3.5 hover:bg-slate-50 transition-colors cursor-pointer flex items-start gap-3 ${!n.is_read ? 'bg-brand-50/30' : ''}`}>
                                        <div className={`w-2 h-2 rounded-full mt-1.5 shrink-0 ${!n.is_read ? 'bg-brand-700' : 'bg-slate-300'}`}></div>
                                        <div className="flex-1 space-y-1">
                                            <div className="flex justify-between items-start gap-2">
                                                <h4 className="font-outfit font-bold text-xs text-slate-900 leading-tight">{n.title}</h4>
                                                <span className={`text-[9px] font-bold px-1.5 py-0.5 rounded border ${badge.bg}`}>{badge.label}</span>
                                            </div>
                                            <p className="text-[11px] text-slate-600 leading-normal">{n.message}</p>
                                            <div className="text-[9px] text-slate-400 font-mono pt-0.5">{n.created_at || 'Just now'}</div>
                                        </div>
                                    </div>
                                );
                            })
                        )}
                    </div>
                </div>
            );
        }

        // =====================================================================
        // STREAMLINED MULTI-ROLE ACCOUNT CREATION MODAL WITH ERROR HANDLING
        // =====================================================================
        function CreateAccountModal({ isOpen, onClose, onRegisterSuccess, registeredUsers = [] }) {
            const [roleTab, setRoleTab] = useState('STUDENT');
            const [fullName, setFullName] = useState('');
            const [email, setEmail] = useState('');
            const [password, setPassword] = useState('');
            const [confirmPassword, setConfirmPassword] = useState('');
            const [studentIdNumber, setStudentIdNumber] = useState('');
            const [rfidUid, setRfidUid] = useState('');
            const [phone, setPhone] = useState('');
            const [staffRole, setStaffRole] = useState('cashier');
            const [staffId, setStaffId] = useState('');
            const [pinCode, setPinCode] = useState('');

            const [errorMsg, setErrorMsg] = useState('');
            const [isSubmitting, setIsSubmitting] = useState(false);

            if (!isOpen) return null;

            const handleRegisterSubmit = async (e) => {
                e.preventDefault();
                setErrorMsg('');

                if (!fullName.trim()) return setErrorMsg('Please enter your full legal name.');
                
                const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                if (!emailRegex.test(email)) return setErrorMsg('Please enter a valid email address.');

                if (password.length < 6) return setErrorMsg('Password must be at least 6 characters long.');
                if (password !== confirmPassword) return setErrorMsg('Account passwords do not match.');

                const emailExists = registeredUsers.some(u => u.email?.toLowerCase() === email.toLowerCase());
                if (emailExists) return setErrorMsg('An account with this email address is already registered.');

                if (roleTab === 'STUDENT') {
                    if (!studentIdNumber.trim()) return setErrorMsg('Student ID number is required (e.g., 2026-01900).');
                    const idExists = registeredUsers.some(u => u.studentId === studentIdNumber);
                    if (idExists) return setErrorMsg(`Student ID ${studentIdNumber} is already registered.`);
                } else if (roleTab === 'PARENT') {
                    if (!phone.trim()) return setErrorMsg('Contact phone number is required.');
                } else if (roleTab === 'STAFF') {
                    if (!staffId.trim()) return setErrorMsg('Staff ID number is required.');
                    if (pinCode !== '1234') return setErrorMsg('Invalid Staff Passcode PIN (Use: 1234). Authorization denied.');
                }

                setIsSubmitting(true);

                try {
                    const finalRole = roleTab === 'STUDENT' ? 'student' : (roleTab === 'PARENT' ? 'parent' : staffRole);
                    // rfidUid is ONLY set if the user provided one — no auto-assignment.
                    // Accounts with no RFID will be flagged until an Admin assigns a badge.
                    const finalRfid = (roleTab === 'STUDENT' && rfidUid.trim()) ? rfidUid.trim() : null;
                    const userPayload = {
                        email,
                        full_name: fullName,
                        role: finalRole,
                        student_id_number: roleTab === 'STUDENT' ? studentIdNumber : null,
                        rfid_uid: finalRfid,
                        pin_code: roleTab === 'STAFF' ? pinCode : null
                    };

                    let newProfile;
                    if (supabaseClient && window.CanteenDB) {
                        try {
                            newProfile = await window.CanteenDB.registerUser(userPayload);
                        } catch(err) {
                            console.warn("Cloud registration fallback to local state", err);
                        }
                    }

                    const localUser = {
                        id: newProfile?.id || "u_" + Date.now(),
                        studentId: roleTab === 'STUDENT' ? studentIdNumber : (roleTab === 'STAFF' ? staffId : 'PAR-' + Math.floor(1000 + Math.random() * 9000)),
                        name: fullName,
                        email: email,
                        role: finalRole === 'student' ? 'Student' : (finalRole === 'parent' ? 'Parent' : (finalRole === 'cashier' ? 'Cashier' : 'Admin')),
                        rfidUid: finalRfid,   // null = no RFID badge assigned yet
                        dailyCap: 200.00,
                        balance: 0.00,
                        status: 'active'
                    };

                    onRegisterSuccess(localUser);
                    onClose();
                } catch(err) {
                    setErrorMsg(`Registration Error: ${err.message}`);
                } finally {
                    setIsSubmitting(false);
                }
            };

            return (
                <CustomModal 
                    isOpen={isOpen} 
                    onClose={onClose} 
                    title="Account Registration Center" 
                    subtitle="Create your Saint Joseph College NovaLunch account" 
                    icon={Icon.UserPlus} 
                    iconBg="bg-brand-50 text-brand-700 border-brand-200" 
                    size="lg"
                >
                    <div className="space-y-4">
                        <div className="grid grid-cols-3 gap-1.5 p-1 bg-slate-100 rounded-xl border border-slate-200">
                            <button type="button" onClick={() => { setRoleTab('STUDENT'); setErrorMsg(''); }} className={`py-2 px-3 rounded-lg text-xs font-bold transition-all flex items-center justify-center gap-1.5 ${roleTab === 'STUDENT' ? 'bg-brand-700 text-white shadow-xs' : 'text-slate-600 hover:text-slate-900'}`}>
                                <Icon.GraduationCap className="w-3.5 h-3.5" /> Student
                            </button>
                            <button type="button" onClick={() => { setRoleTab('PARENT'); setErrorMsg(''); }} className={`py-2 px-3 rounded-lg text-xs font-bold transition-all flex items-center justify-center gap-1.5 ${roleTab === 'PARENT' ? 'bg-brand-700 text-white shadow-xs' : 'text-slate-600 hover:text-slate-900'}`}>
                                <Icon.Users className="w-3.5 h-3.5" /> Parent
                            </button>
                            <button type="button" onClick={() => { setRoleTab('STAFF'); setErrorMsg(''); }} className={`py-2 px-3 rounded-lg text-xs font-bold transition-all flex items-center justify-center gap-1.5 ${roleTab === 'STAFF' ? 'bg-brand-700 text-white shadow-xs' : 'text-slate-600 hover:text-slate-900'}`}>
                                <Icon.Shield className="w-3.5 h-3.5" /> Staff (POS/Admin)
                            </button>
                        </div>

                        {errorMsg && (
                            <div className="p-3 bg-rose-50 border border-rose-200 rounded-xl text-rose-800 text-xs flex items-center gap-2.5 animate-in fade-in duration-150">
                                <Icon.AlertCircle className="w-4 h-4 shrink-0 text-rose-600" />
                                <span className="font-semibold">{errorMsg}</span>
                            </div>
                        )}

                        <form onSubmit={handleRegisterSubmit} className="space-y-3">
                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                <div>
                                    <label className="block text-xs font-semibold text-slate-700 mb-1">Full Legal Name</label>
                                    <input type="text" required placeholder="e.g. Juan Dela Cruz" value={fullName} onChange={e => setFullName(e.target.value)} className="w-full bg-slate-50 border border-slate-200 rounded-lg px-3 py-2 text-xs font-medium focus:bg-white" />
                                </div>
                                <div>
                                    <label className="block text-xs font-semibold text-slate-700 mb-1">Email Address</label>
                                    <input type="email" required placeholder="e.g. juan@sjc.edu.ph" value={email} onChange={e => setEmail(e.target.value)} className="w-full bg-slate-50 border border-slate-200 rounded-lg px-3 py-2 text-xs font-medium focus:bg-white" />
                                </div>
                            </div>

                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                <div>
                                    <label className="block text-xs font-semibold text-slate-700 mb-1">Account Password (min 6 chars)</label>
                                    <input type="password" required placeholder="••••••••" value={password} onChange={e => setPassword(e.target.value)} className="w-full bg-slate-50 border border-slate-200 rounded-lg px-3 py-2 text-xs font-medium focus:bg-white" />
                                </div>
                                <div>
                                    <label className="block text-xs font-semibold text-slate-700 mb-1">Confirm Password</label>
                                    <input type="password" required placeholder="••••••••" value={confirmPassword} onChange={e => setConfirmPassword(e.target.value)} className="w-full bg-slate-50 border border-slate-200 rounded-lg px-3 py-2 text-xs font-medium focus:bg-white" />
                                </div>
                            </div>

                            {roleTab === 'STUDENT' && (
                                <div className="space-y-3 p-3 bg-brand-50/50 rounded-xl border border-brand-100">
                                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                        <div>
                                            <label className="block text-xs font-semibold text-brand-900 mb-1">Student ID Number <span className="text-rose-600">*</span></label>
                                            <input type="text" required placeholder="e.g. 2026-01900" value={studentIdNumber} onChange={e => setStudentIdNumber(e.target.value)} className="w-full bg-white border border-brand-200 rounded-lg px-3 py-2 text-xs font-mono font-bold text-brand-950" />
                                        </div>
                                        <div>
                                            <label className="block text-xs font-semibold text-brand-900 mb-1">RFID Badge UID <span className="text-slate-400">(optional)</span></label>
                                            <div className="relative">
                                                <input type="text" placeholder="e.g. 9A-4F-21-C8" value={rfidUid} onChange={e => setRfidUid(e.target.value)} className={`w-full bg-white border rounded-lg px-3 py-2 text-xs font-mono text-slate-900 pl-8 ${rfidUid ? 'border-emerald-300 focus:ring-emerald-200' : 'border-amber-300'}`} />
                                                <div className="absolute left-2.5 top-2.5">
                                                    {rfidUid ? <Icon.CheckCircle className="w-3.5 h-3.5 text-emerald-600" /> : <Icon.AlertCircle className="w-3.5 h-3.5 text-amber-500" />}
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                    {!rfidUid && (
                                        <div className="flex items-start gap-2 p-2.5 bg-amber-50 border border-amber-200 rounded-lg">
                                            <Icon.AlertTriangle className="w-4 h-4 text-amber-600 shrink-0 mt-0.5" />
                                            <p className="text-[11px] text-amber-900 leading-relaxed">
                                                <strong>No RFID badge entered.</strong> This account will be registered but <strong>cannot be identified at the kiosk or POS terminal</strong> until an Admin assigns a physical badge UID. The cashier can still look up the student manually by Student ID.
                                            </p>
                                        </div>
                                    )}
                                </div>
                            )}

                            {roleTab === 'PARENT' && (
                                <div className="p-3 bg-amber-50/50 rounded-xl border border-amber-100">
                                    <label className="block text-xs font-semibold text-amber-900 mb-1">Mobile Phone Number (for Top-Up alerts)</label>
                                    <input type="tel" required placeholder="e.g. 09171234567" value={phone} onChange={e => setPhone(e.target.value)} className="w-full bg-white border border-amber-200 rounded-lg px-3 py-2 text-xs font-medium text-slate-900" />
                                </div>
                            )}

                            {roleTab === 'STAFF' && (
                                <div className="space-y-3 p-3 bg-slate-100 rounded-xl border border-slate-200">
                                    <div className="grid grid-cols-2 gap-3">
                                        <div>
                                            <label className="block text-xs font-semibold text-slate-700 mb-1">Staff Access Role</label>
                                            <select value={staffRole} onChange={e => setStaffRole(e.target.value)} className="w-full bg-white border border-slate-300 rounded-lg px-3 py-2 text-xs font-bold text-slate-900">
                                                <option value="cashier">Cashier POS Operator</option>
                                                <option value="admin">Canteen Administrator</option>
                                            </select>
                                        </div>
                                        <div>
                                            <label className="block text-xs font-semibold text-slate-700 mb-1">Employee Staff ID</label>
                                            <input type="text" required placeholder="e.g. STF-2026-01" value={staffId} onChange={e => setStaffId(e.target.value)} className="w-full bg-white border border-slate-300 rounded-lg px-3 py-2 text-xs font-mono font-bold" />
                                        </div>
                                    </div>
                                    <div>
                                        <label className="block text-xs font-semibold text-slate-700 mb-1">Staff Security Passcode (Enter: 1234)</label>
                                        <input type="password" required placeholder="4-digit PIN" value={pinCode} onChange={e => setPinCode(e.target.value)} className="w-full bg-white border border-slate-300 rounded-lg px-3 py-2 text-xs font-mono tracking-widest text-slate-900" />
                                    </div>
                                </div>
                            )}

                            <div className="pt-3 border-t border-slate-100 flex items-center justify-end gap-2">

        // =====================================================================
        function LinkStudentModal({ isOpen, onClose, onSendLinkRequest, registeredUsers = [] }) {
            const [studentIdInput, setStudentIdInput] = useState('');
            const [errorMsg, setErrorMsg] = useState('');
            const [isSubmitting, setIsSubmitting] = useState(false);

            if (!isOpen) return null;

            const handleSubmit = async (e) => {
                e.preventDefault();
                setErrorMsg('');

                if (!studentIdInput.trim()) {
                    return setErrorMsg('Please enter Student ID Number or Student Email.');
                }

                setIsSubmitting(true);
                try {
                    await onSendLinkRequest(studentIdInput.trim());
                    setStudentIdInput('');
                    onClose();
                } catch(err) {
                    setErrorMsg(err.message || 'Failed to send link request.');
                } finally {
                    setIsSubmitting(false);
                }
            };

            return (
                <CustomModal 
                    isOpen={isOpen} 
                    onClose={onClose} 
                    title="Link Student Account" 
                    subtitle="Send an account link request to your child for approval" 
                    icon={Icon.UserPlus} 
                    iconBg="bg-amber-50 text-amber-700 border-amber-200" 
                    size="md"
                >
                    <form onSubmit={handleSubmit} className="space-y-4">
                        {errorMsg && (
                            <div className="p-3 bg-rose-50 border border-rose-200 rounded-xl text-rose-800 text-xs flex items-center gap-2">
                                <Icon.AlertCircle className="w-4 h-4 shrink-0 text-rose-600" />
                                <span>{errorMsg}</span>
                            </div>
                        )}
                        <div>
                            <label className="block text-xs font-semibold text-slate-700 mb-1">Student ID Number or Email Address</label>
                            <input 
                                type="text" 
                                required 
                                placeholder="e.g. 2023-01900 or juan@sjc.edu.ph" 
                                value={studentIdInput} 
                                onChange={e => setStudentIdInput(e.target.value)} 
                                className="w-full bg-slate-50 border border-slate-200 rounded-lg px-3.5 py-2.5 text-xs font-medium text-slate-900 focus:bg-white" 
                            />
                            <p className="text-[11px] text-slate-500 mt-1.5">An in-app notification will be sent to the student account. Once the student confirms, you can manage daily spending limits and view purchases.</p>
                        </div>
                        <div className="pt-3 border-t border-slate-100 flex items-center justify-end gap-2">
                            <ActionButton variant="secondary" onClick={onClose} className="px-4 py-2">Cancel</ActionButton>
                            <ActionButton variant="primary" type="submit" disabled={isSubmitting} className="px-5 py-2 font-bold bg-brand-700">
                                {isSubmitting ? 'Sending Request...' : 'Send Link Request'}
                            </ActionButton>
                        </div>
                    </form>
                </CustomModal>
            );
        }

        // =====================================================================
        // 4. CASHIER POS MODULE (WITH DIETARY LOCK ALERTS & SHIFT DRAWER TALLY)
        // =====================================================================
        function CashierView({ posCart, posTotal, menuCatalog, registeredUsers, onAddToCart, onUpdateQty, onDeleteItem, onClearCart, onCompleteCheckout, activeTab = 'register', setActiveTab, onSignOut, onSelectRoleQuick, isCloudConnected, onRefreshCloud, notifications = [], onMarkNotifRead, onMarkAllNotifRead }) {
            const [selectedCategory, setSelectedCategory] = useState('All');
            const [searchQuery, setSearchQuery] = useState('');
            const [selectedStudent, setSelectedStudent] = useState(registeredUsers[0] || null);
            const [paymentMethod, setPaymentMethod] = useState('rfid');
            const [cashTendered, setCashTendered] = useState('');
            const [qrClaimInput, setQrClaimInput] = useState('');

            // Modals
            const [aiModalOpen, setAiModalOpen] = useState(false);
            const [rfidModalOpen, setRfidModalOpen] = useState(false);
            const [receiptModalOpen, setReceiptModalOpen] = useState(false);
            const [shiftModalOpen, setShiftModalOpen] = useState(false);
            const [nearExpiryModalItem, setNearExpiryModalItem] = useState(null);
            const [lastCompletedOrder, setLastCompletedOrder] = useState(null);

            // RFID Lookup state
            const [rfidScanInput, setRfidScanInput] = useState('');
            const [rfidLookupInput, setRfidLookupInput] = useState('');
            const [rfidScanResult, setRfidScanResult] = useState(null);  // matched student
            const [rfidScanError, setRfidScanError] = useState('');
            const [rfidLookupMode, setRfidLookupMode] = useState('scan');  // 'scan' | 'manual'

            const categories = ['All', 'Meals & Mains', 'Beverages', 'Snacks & Bakery', 'Fruits & Healthy'];
            const filteredMenu = menuCatalog.filter(i => (selectedCategory === 'All' || i.category === selectedCategory) && i.name.toLowerCase().includes(searchQuery.toLowerCase()) && i.available !== false);

            const currentStudentBalance = selectedStudent ? selectedStudent.balance : 0;
            const isRfidShortage = paymentMethod === 'rfid' && posTotal > currentStudentBalance;
            const cashTenderedVal = parseFloat(cashTendered) || 0;
            const cashChange = cashTenderedVal - posTotal;

            // Check if cart contains any restricted items for selected student
            const hasDietaryConflict = selectedStudent && selectedStudent.allergies && selectedStudent.allergies.length > 0 && posCart.some(cartItem => {
                const menuItem = menuCatalog.find(m => m.id === cartItem.id);
                return menuItem && menuItem.allergens && menuItem.allergens.some(alg => selectedStudent.allergies.includes(alg));
            });

            const handleSimulateAiScan = () => {
                const burger = menuCatalog.find(m => m.id === 'p1') || menuCatalog[0];
                const juice = menuCatalog.find(m => m.id === 'p5') || menuCatalog[1];
                if (burger) onAddToCart(burger);
                if (juice) onAddToCart(juice);
                setAiModalOpen(false);
            };

            // RFID scan: match by UID first, fallback to student ID, error if no RFID enrolled
            const handleRfidScan = (e) => {
                e && e.preventDefault && e.preventDefault();
                setRfidScanError('');
                setRfidScanResult(null);
                const query = rfidScanInput.trim().toUpperCase();
                if (!query) return setRfidScanError('Please scan or enter an RFID UID.');

                // Match by RFID UID
                const byUid = registeredUsers.find(u => u.rfidUid && u.rfidUid.toUpperCase() === query);
                if (byUid) {
                    setRfidScanResult(byUid);
                    return;
                }

                // No UID matched — check if this looks like a student ID or name (not a card tap)
                const byStudentId = registeredUsers.find(u => u.studentId && u.studentId.toUpperCase() === query);
                if (byStudentId) {
                    if (!byStudentId.rfidUid) {
                        return setRfidScanError(`Student "${byStudentId.name}" (${byStudentId.studentId}) has NO RFID badge enrolled. Use manual lookup or switch to Cash/QR payment.`);
                    }
                    setRfidScanResult(byStudentId);
                    return;
                }

                setRfidScanError(`No student account found matching RFID UID "${query}". The card may not be registered in the system.`);
            };

            const handleRfidManualLookup = (e) => {
                e && e.preventDefault && e.preventDefault();
                setRfidScanError('');
                setRfidScanResult(null);
                const query = rfidLookupInput.trim();
                if (!query) return setRfidScanError('Enter Student ID or full name to look up.');

                const match = registeredUsers.find(u =>
                    (u.studentId && u.studentId.toLowerCase() === query.toLowerCase()) ||
                    (u.name && u.name.toLowerCase().includes(query.toLowerCase())) ||
                    (u.email && u.email.toLowerCase() === query.toLowerCase())
                );

                if (!match) return setRfidScanError(`No student found for "${query}". Check spelling or Student ID.`);

                if (!match.rfidUid) {
                    // Student found but no RFID — allow selection but flag as unlinked
                    setRfidScanResult({ ...match, _noRfid: true });
                    return;
                }

                setRfidScanResult(match);
            };

            const handleConfirmRfidStudent = () => {
                if (!rfidScanResult) return;
                setSelectedStudent(rfidScanResult);
                setRfidScanInput('');
                setRfidLookupInput('');
                setRfidScanResult(null);
                setRfidScanError('');
                setRfidModalOpen(false);
                // If student has no RFID, auto-switch payment to cash
                if (rfidScanResult._noRfid) setPaymentMethod('cash');
            };

            const handleFulfillQrClaim = (e) => {
                e.preventDefault();
                const burger = menuCatalog.find(m => m.id === 'p1') || menuCatalog[0];
                if (burger) onAddToCart(burger);
                alert(`Pre-Order Token ${qrClaimInput || 'QR-2026-9812'} Validated! Meal tray added to checkout.`);
                setQrClaimInput('');
            };

            const handleCheckoutSubmit = () => {
                if (posCart.length === 0) return alert("Please select items to add to the checkout order.");
                if (isRfidShortage) return alert("Cannot complete checkout: Customer RFID balance is insufficient.");
                if (paymentMethod === 'cash' && cashTenderedVal < posTotal) return alert("Cannot complete checkout: Cash tendered is less than order total.");
                if (hasDietaryConflict) return alert("Dietary Lock Alert: Customer has a restricted item in cart! Please resolve before proceeding.");

            const [toastMessage, setToastMessage] = useState("");

            // Universal Notifications & Parent-Student Request State
            const [notifications, setNotifications] = useState([
                {
                    id: 'n1',
                    user_id: 'u101',
                    title: 'Parent Account Link Request',
                    message: 'Parent Maria Santos (maria.santos@gmail.com) sent a request to link to your canteen profile.',
                    type: 'link_request',
                    is_read: false,
                    created_at: '10m ago'
                },
                {
                    id: 'n2',
                    user_id: 'u101',
                    title: 'GCash Top-Up Approved! 💳',
                    message: 'Your account balance was credited ₱500.00 by Maria Santos.',
                    type: 'wallet_topup',
                    is_read: false,
                    created_at: '2h ago'
                },
                {
                    id: 'n3',
                    user_id: 'u101',
                    title: 'Welcome to NovaLunch Enterprise',
                    message: 'Your RFID Smart Student account is ready for automated canteen checkout.',
                    type: 'account_created',
                    is_read: true,
                    created_at: 'Yesterday'

                    student_id: 'u101',

            const [parentStudentLinks, setParentStudentLinks] = useState([
                { parentId: 'u201', studentId: 'u101', studentIdNumber: '2023-01900' }
            ]);

            const showToast = (msg) => setToastMessage(msg);

            const handleMarkNotificationRead = (notifId) => {
                setNotifications(notifications.map(n => n.id === notifId ? { ...n, is_read: true } : n));
                if (window.CanteenDB) window.CanteenDB.markNotificationRead(notifId);
            };

            const handleMarkAllNotificationsRead = () => {
                setNotifications(notifications.map(n => ({ ...n, is_read: true })));
                if (window.CanteenDB && currentStudent) window.CanteenDB.markAllNotificationsRead(currentStudent.id);
            };

            const handleRegisterUser = (newUser) => {
                setRegisteredUsers([newUser, ...registeredUsers]);
                if (newUser.role === 'Student') {
                    setCurrentStudent(newUser);
                    setStudentBalance(newUser.balance);
                    setDailyLimit(newUser.dailyCap);
                    setActiveRole('STUDENT');
                } else if (newUser.role === 'Parent') {
                    setCurrentParent(newUser);
                    setActiveRole('PARENT');
                } else if (newUser.role === 'Cashier') {
                    setActiveRole('CASHIER');
                } else if (newUser.role === 'Admin') {
                    setActiveRole('ADMIN');
                }

                const newNotif = {
                    id: 'n_' + Date.now(),
                    user_id: newUser.id,
                    title: 'Welcome to NovaLunch! 🎉',
                    message: `Your ${newUser.role} profile is active and synced.`,
                    type: 'account_created',
                    is_read: false,
                    created_at: 'Just now'
                };
                setNotifications([newNotif, ...notifications]);
                showToast(`Registered new ${newUser.role} account for ${newUser.name}!`);
            };

            const handleSendParentLinkRequest = async (studentIdentifier) => {
                const targetStud = registeredUsers.find(u => 
                    (u.studentId && u.studentId.toLowerCase() === studentIdentifier.toLowerCase()) || 
                    (u.email && u.email.toLowerCase() === studentIdentifier.toLowerCase()) ||
                    (u.name && u.name.toLowerCase().includes(studentIdentifier.toLowerCase()))
                );

                if (!targetStud) {
                    throw new Error(`No student found matching Student ID or Email "${studentIdentifier}". Please verify credentials.`);
                }

                const isAlreadyLinked = parentStudentLinks.some(l => l.studentId === targetStud.id || l.studentIdNumber === targetStud.studentId);
                if (isAlreadyLinked) {
                    throw new Error(`Student ${targetStud.name} (${targetStud.studentId}) is already linked to your parent account.`);
                }

                const isPending = parentStudentLinkRequests.some(r => (r.student_id === targetStud.id || r.student_id_number === targetStud.studentId) && r.status === 'pending');
                if (isPending) {
                    throw new Error(`A link request for ${targetStud.name} is already pending student confirmation.`);
                }

                const newReq = {
                    id: 'req_' + Date.now(),
                    parent_id: currentParent?.id || 'u201',
                    parentName: currentParent?.name || 'Maria Santos',
                    parentEmail: currentParent?.email || 'maria.santos@gmail.com',
                    student_id: targetStud.id,
                    student_id_number: targetStud.studentId,
                    studentName: targetStud.name,
                    status: 'pending',
                    created_at: 'Just now'
                };

                setParentStudentLinkRequests([newReq, ...parentStudentLinkRequests]);

                const notifForStudent = {
                    id: 'n_' + Date.now(),
                    user_id: targetStud.id,
                    title: 'Parent Account Link Request',
                    message: `Parent ${currentParent?.name || 'Maria Santos'} (${currentParent?.email || 'maria.santos@gmail.com'}) sent a request to link to your account.`,
                    type: 'link_request',
                    is_read: false,
                    created_at: 'Just now'
                };
                setNotifications([notifForStudent, ...notifications]);
                showToast(`Link request sent to ${targetStud.name}! Waiting for student confirmation.`);
            };

            const handleRespondLinkRequest = (requestId, accept) => {
                const targetReq = parentStudentLinkRequests.find(r => r.id === requestId);
                if (!targetReq) return;

                const newStatus = accept ? 'accepted' : 'rejected';
                setParentStudentLinkRequests(parentStudentLinkRequests.map(r => r.id === requestId ? { ...r, status: newStatus } : r));

                if (accept) {
                    setParentStudentLinks([...parentStudentLinks, { parentId: targetReq.parent_id, studentId: targetReq.student_id, studentIdNumber: targetReq.student_id_number }]);
                }

                const parentNotif = {
                    id: 'n_' + Date.now(),
                    user_id: targetReq.parent_id,
                    title: accept ? 'Link Request Accepted! 🎉' : 'Link Request Declined',
                    message: accept ? `Student ${targetReq.studentName} accepted your account link request.` : `Student ${targetReq.studentName} declined your link request.`,
                    type: accept ? 'link_accepted' : 'link_rejected',
                    is_read: false,
                    created_at: 'Just now'
                };
                setNotifications([parentNotif, ...notifications]);
                showToast(accept ? `Accepted parent link request!` : `Declined link request.`);
            };

            const syncCloudData = useCallback(async () => {
                let connected = false;
                if (supabaseClient) {
                    try {
                        const { data: prodsData } = await supabaseClient.from('products').select('*, menu_categories(name)');
                        if (prodsData && prodsData.length > 0) {
                            setMenuCatalog(prodsData.map(p => ({
                                id: p.id,
                                name: p.name,
                                category: p.menu_categories?.name || p.category?.name || "Meals & Mains",
                                price: parseFloat(p.price) || 0,
                                stock: p.stock_quantity || 0,
                                available: p.is_available,
                                calories: p.calories || 420,
                                protein: p.protein || "20g",
                                allergens: p.allergens || [],
                                img: p.image_url || "https://images.unsplash.com/photo-1546069901-ba9599a7e63c?auto=format&fit=crop&w=400&q=80"
                            })));
                            connected = true;
                        }

                        const { data: profsData } = await supabaseClient.from('profiles').select('*, wallets(*)');
                        if (profsData && profsData.length > 0) {
                            const mappedUsers = profsData.map(u => {
                                const w = Array.isArray(u.wallets) ? u.wallets[0] : u.wallets;
                                return {
                                    id: u.id,
                                    studentId: u.student_id_number || "2023-0000",
                                    name: u.full_name,
                                    role: u.role ? (u.role.charAt(0).toUpperCase() + u.role.slice(1)) : 'Student',
                                    rfidUid: u.rfid_uid || "RF-000",
                                    dailyCap: w?.daily_limit ? parseFloat(w.daily_limit) : 200.00,
                                    balance: w?.balance ? parseFloat(w.balance) : 0.00,
                                    status: u.status || 'active',
                                    allergies: u.allergies || []
                                };
                            });
                            setRegisteredUsers(mappedUsers);
                            
                            const defaultStud = mappedUsers.find(u => u.role.toLowerCase() === 'student');
                            const defaultParent = mappedUsers.find(u => u.role.toLowerCase() === 'parent');
                            if (defaultStud) {
                                setCurrentStudent(defaultStud);
                                setStudentBalance(defaultStud.balance);
                                setDailyLimit(defaultStud.dailyCap);
                            }
                            if (defaultParent) setCurrentParent(defaultParent);
                            connected = true;
                        }

                        const { data: ordersData } = await supabaseClient.from('orders').select('*, order_items(*)');
                        if (ordersData && ordersData.length > 0) {
                            setRecentOrders(ordersData);
                        }
                    } catch (e) {
                        console.warn("Supabase fetch failed, trying CanteenDB REST API", e);
                    }
                }

                if (!connected && typeof window !== 'undefined' && window.CanteenDB) {
                    try {
                        const prodsData = await window.CanteenDB.getProducts();
                        if (prodsData && prodsData.length > 0) {
                            setMenuCatalog(prodsData.map(p => ({
                                id: p.id,
                                name: p.name,
                                category: p.category?.name || p.menu_categories?.name || "Meals & Mains",
                                price: parseFloat(p.price) || 0,
                                stock: p.stock_quantity || 0,
                                available: p.is_available,
                                img: p.image_url || "https://images.unsplash.com/photo-1546069901-ba9599a7e63c?auto=format&fit=crop&w=400&q=80"
                            })));
                            connected = true;
                        }

                        const profsData = await window.CanteenDB._fetchREST('profiles?select=*,wallets(*)');
                        if (profsData && profsData.length > 0) {
                            const mappedUsers = profsData.map(u => {
                                const w = Array.isArray(u.wallets) ? u.wallets[0] : u.wallets;
                                return {
                                    id: u.id,
                                    studentId: u.student_id_number || "2023-0000",
                                    name: u.full_name,
                                    role: u.role ? (u.role.charAt(0).toUpperCase() + u.role.slice(1)) : 'Student',
                                    rfidUid: u.rfid_uid || "RF-000",
                                    dailyCap: w?.daily_limit ? parseFloat(w.daily_limit) : 200.00,
                                    balance: w?.balance ? parseFloat(w.balance) : 0.00,
                                    status: u.status || 'active'
                                };
                            });
                            setRegisteredUsers(mappedUsers);
                            const defaultStud = mappedUsers.find(u => u.role.toLowerCase() === 'student');
                            const defaultParent = mappedUsers.find(u => u.role.toLowerCase() === 'parent');
                            if (defaultStud) {
                                setCurrentStudent(defaultStud);
                                setStudentBalance(defaultStud.balance);
                                setDailyLimit(defaultStud.dailyCap);
                            }
                            if (defaultParent) setCurrentParent(defaultParent);
                            connected = true;
                        }
                    } catch(err) {
                        console.warn("REST API fallback failed", err);
                    }
                }
                setIsCloudConnected(connected);
            }, []);

            useEffect(() => {
                syncCloudData();
            }, [syncCloudData]);

            // Quick Role Switcher
            const handleSelectRoleQuick = (role) => {
                if (role === 'STUDENT') {
                    setActiveTab('menu');
                    const stud = registeredUsers.find(u => u.role.toLowerCase() === 'student') || registeredUsers[0];
                    if (stud) {
                        setCurrentStudent(stud);
                        setStudentBalance(stud.balance);
                        setDailyLimit(stud.dailyCap);
                    }
                } else if (role === 'PARENT') {
                    setActiveTab('family');
                    const prnt = registeredUsers.find(u => u.role.toLowerCase() === 'parent');
                    const child = registeredUsers.find(u => u.role.toLowerCase() === 'student') || registeredUsers[0];
                    if (prnt) setCurrentParent(prnt);
                    if (child) {
                        setCurrentStudent(child);
                        setStudentBalance(child.balance);
                        setDailyLimit(child.dailyCap);
                    }
                } else if (role === 'CASHIER') {
                    setActiveTab('register');
                } else if (role === 'ADMIN') {
                    setActiveTab('command');
                }
                setActiveRole(role);
            };

            // Pos Cart Quantity Operations
            const handleAddToCart = (item) => {
                const existing = posCart.find(i => i.id === item.id);
                if (existing) {
                    setPosCart(posCart.map(i => i.id === item.id ? { ...i, qty: i.qty + 1 } : i));
                } else {
                    setPosCart([...posCart, { id: item.id, name: item.name, price: item.price, qty: 1 }]);
                }
                showToast(`Added ${item.name} to order tally`);
            };

            const handleUpdateQty = (itemId, newQty) => {
                if (newQty <= 0) {
                    setPosCart(posCart.filter(i => i.id !== itemId));
                } else {
                    setPosCart(posCart.map(i => i.id === itemId ? { ...i, qty: newQty } : i));
                }
            };

            const handleDeleteItem = (itemId) => {
                setPosCart(posCart.filter(i => i.id !== itemId));
            };

            const handleClearCart = () => {
                setPosCart([]);
                showToast("Cleared cart tally");
            };

            // Parent Reload Submission
            const handleUploadReceipt = (uploadObj) => {
                const newReq = {
                    id: "top_" + Date.now(),
                    parent: currentParent ? currentParent.name : (uploadObj.parent || "Maria Santos"),
                    student: currentStudent ? `${currentStudent.name} (${currentStudent.studentId})` : (uploadObj.student || "Juan Dela Cruz (2023-01900)"),
                    studentId: currentStudent ? currentStudent.id : "u101",
                    amount: uploadObj.amount,
                    date: new Date().toLocaleString(),
                    refNo: uploadObj.refNo,
                    status: "Pending"
                };
                setGcashQueue([newReq, ...gcashQueue]);
                setReloadLogs([
                    { id: newReq.id, date: new Date().toLocaleDateString(), amount: uploadObj.amount, ref: uploadObj.refNo, status: "Pending" },
                    ...reloadLogs
                ]);
                showToast(`Submitted GCash reload for ₱${uploadObj.amount.toFixed(2)} to Admin Queue!`);
            };

            // Admin GCash Topup Approval/Rejection Handlers
            const handleApproveTopup = (queueItem) => {
                setGcashQueue(gcashQueue.map(q => q.id === queueItem.id ? { ...q, status: 'Approved' } : q));
                setReloadLogs(reloadLogs.map(r => r.id === queueItem.id ? { ...r, status: 'Approved' } : r));
                
                setRegisteredUsers(registeredUsers.map(u => {
                    if (u.id === queueItem.studentId || (currentStudent && u.id === currentStudent.id)) {
                        return { ...u, balance: u.balance + queueItem.amount };
                    }
                    return u;
                }));
                setStudentBalance(prev => prev + queueItem.amount);
                showToast(`Approved ₱${queueItem.amount.toFixed(2)} top-up for ${queueItem.student}!`);
            };

            const handleRejectTopup = (queueItem) => {
                setGcashQueue(gcashQueue.map(q => q.id === queueItem.id ? { ...q, status: 'Rejected' } : q));
                setReloadLogs(reloadLogs.map(r => r.id === queueItem.id ? { ...r, status: 'Rejected' } : r));
                showToast(`Rejected top-up submission ${queueItem.refNo}`);
            };

            // Edit & Archive Handlers
            const handleUpdateStudent = async (updatedUser) => {
                setRegisteredUsers(registeredUsers.map(u => u.id === updatedUser.id ? updatedUser : u));
                showToast(`Updated student profile for ${updatedUser.name}!`);

                if (supabaseClient) {
                    await supabaseClient.from('profiles').update({
                        full_name: updatedUser.name,
                        student_id_number: updatedUser.studentId,
                        rfid_uid: updatedUser.rfidUid,
                        status: updatedUser.status
                    }).eq('id', updatedUser.id);
                }
            };

            const handleArchiveStudent = async (userId) => {
                setRegisteredUsers(registeredUsers.map(u => u.id === userId ? { ...u, status: 'archived' } : u));
                showToast(`Archived student account`);

                if (supabaseClient) {
                    await supabaseClient.from('profiles').update({ status: 'archived' }).eq('id', userId);
                }
            };

            const handleUpdateProduct = async (updatedProd) => {
                setMenuCatalog(menuCatalog.map(p => p.id === updatedProd.id ? updatedProd : p));
                showToast(`Updated menu item ${updatedProd.name}!`);

                if (supabaseClient) {
                    await supabaseClient.from('products').update({
                        name: updatedProd.name,
                        price: updatedProd.price,
                        stock_quantity: updatedProd.stock
                    }).eq('id', updatedProd.id);
                }
            };

            const handleArchiveProduct = async (prodId) => {
                setMenuCatalog(menuCatalog.map(p => p.id === prodId ? { ...p, available: false } : p));
                showToast(`Archived menu product`);

                if (supabaseClient) {
                    await supabaseClient.from('products').update({ is_available: false }).eq('id', prodId);
                }
            };

            const posTotal = posCart.reduce((sum, i) => sum + (i.price * i.qty), 0);

            const getCurrentUser = () => {
                if (activeRole === 'STUDENT') return currentStudent || { name: "Juan Dela Cruz", studentId: "2023-01900" };
                if (activeRole === 'PARENT') return currentParent || { name: "Maria Santos", studentId: "Parent Guardian" };
                if (activeRole === 'CASHIER') return { name: "Elena R.", studentId: "Cashier Reg #01" };
                if (activeRole === 'ADMIN') return { name: "System Admin", studentId: "SJC Admin ID" };
                return null;
            };

            return (
                <React.Fragment>
                    <ToastNotification message={toastMessage} onClose={() => setToastMessage("")} />

                    {activeRole === 'LANDING' ? (
                        <LoginView 
                            onSelectRoleQuick={handleSelectRoleQuick} 
                            onRegisterUser={handleRegisterUser} 
                            registeredUsers={registeredUsers} 
                        />
                    ) : (
                        <React.Fragment>
                            {/* UNIFIED LEFT NAVIGATION SIDEBAR */}
                            <AppLeftSidebar
                                activeRole={activeRole}
                                activeTab={activeTab}
                                setActiveTab={setActiveTab}
                                onSignOut={() => setActiveRole('LANDING')}
                                onSelectRoleQuick={handleSelectRoleQuick}
                                isCloudConnected={isCloudConnected}
                                onRefreshCloud={syncCloudData}
                                currentUser={getCurrentUser()}
                            />

                            {activeRole === 'STUDENT' && (
                                <StudentView
                                    studentBalance={studentBalance}
                                    dailyLimit={dailyLimit}
                                    currentStudent={currentStudent}
                                    menuCatalog={menuCatalog}
                                    preorders={preorders}
                                    onAddPreOrder={(item) => {
                                        setPreorders([{ name: item.name, price: item.price, token: `QR-2026-${Math.floor(1000 + Math.random() * 9000)}` }, ...preorders]);
                                        setStudentBalance(prev => prev - item.price);
                                        showToast(`Pre-ordered ${item.name}!`);
                                    }}
                                    onClaimClick={() => alert("Claim Token QR generated")}
                                    activeTab={activeTab}
                                    setActiveTab={setActiveTab}
                                    onSignOut={() => setActiveRole('LANDING')}
                                    onBackToRoleSelect={() => setActiveRole('LANDING')}
                                    isCloudConnected={isCloudConnected}
                                    onRefreshCloud={syncCloudData}
                                    notifications={notifications}
                                    onMarkNotifRead={handleMarkNotificationRead}
                                    onMarkAllNotifRead={handleMarkAllNotificationsRead}
                                    parentStudentLinkRequests={parentStudentLinkRequests}
                                    onRespondLinkRequest={handleRespondLinkRequest}
                                />
                            )}

                            {activeRole === 'PARENT' && (
                                <ParentView
                                    studentBalance={studentBalance}
                                    dailyLimit={dailyLimit}
                                    currentParent={currentParent}
                                    currentStudent={currentStudent}
                                    recentOrders={recentOrders}
                                    reloadLogs={reloadLogs}
                                    registeredUsers={registeredUsers}
                                    onUpdateDailyLimit={(l) => { setDailyLimit(l); showToast("Updated daily limit"); }}
                                    onUploadReceipt={handleUploadReceipt}
                                    activeTab={activeTab}
                                    setActiveTab={setActiveTab}
                                    onSignOut={() => setActiveRole('LANDING')}
                                    onBackToRoleSelect={() => setActiveRole('LANDING')}
                                    isCloudConnected={isCloudConnected}
                                    onRefreshCloud={syncCloudData}
                                    notifications={notifications}
                                    onMarkNotifRead={handleMarkNotificationRead}
                                    onMarkAllNotifRead={handleMarkAllNotificationsRead}
                                    parentStudentLinkRequests={parentStudentLinkRequests}
                                    onSendLinkRequest={handleSendParentLinkRequest}
                                />
                            )}

                            {activeRole === 'CASHIER' && (
                                <CashierView
                                    posCart={posCart}
                                    posTotal={posTotal}
                                    menuCatalog={menuCatalog}
                                    registeredUsers={registeredUsers}
                                    onAddToCart={handleAddToCart}
                                    onUpdateQty={handleUpdateQty}
                                    onDeleteItem={handleDeleteItem}
                                    onClearCart={handleClearCart}
                                    onCompleteCheckout={(order) => { 
                                        if (order.paymentMethod === 'RFID') {
                                            setStudentBalance(prev => prev - order.total);
                                        }
                                        setPosCart([]); 
                                        showToast("Completed POS Order!"); 
                                    }}
                                    activeTab={activeTab}
                                    setActiveTab={setActiveTab}
                                    onSignOut={() => setActiveRole('LANDING')}
                                    onBackToRoleSelect={() => setActiveRole('LANDING')}
                                    isCloudConnected={isCloudConnected}
                                    onRefreshCloud={syncCloudData}
                                    notifications={notifications}
                                    onMarkNotifRead={handleMarkNotificationRead}
                                    onMarkAllNotifRead={handleMarkAllNotificationsRead}
                                />
                            )}

                            {activeRole === 'ADMIN' && (
                                <AdminView
                                    gcashQueue={gcashQueue}
                                    menuCatalog={menuCatalog}
                                    registeredUsers={registeredUsers}
                                    onApproveTopup={handleApproveTopup}
                                    onRejectTopup={handleRejectTopup}
                                    onAddProduct={(p) => { setMenuCatalog([p, ...menuCatalog]); showToast(`Added product ${p.name}`); }}
                                    onUpdateProduct={handleUpdateProduct}
                                    onArchiveProduct={handleArchiveProduct}
                                    onAddNewStudent={(s) => { setRegisteredUsers([s, ...registeredUsers]); showToast(`Enrolled student ${s.name}`); }}
                                    onUpdateStudent={handleUpdateStudent}
                                    onArchiveStudent={handleArchiveStudent}
                                    activeTab={activeTab}
                                    setActiveTab={setActiveTab}
                                    onSignOut={() => setActiveRole('LANDING')}
                                    onBackToRoleSelect={() => setActiveRole('LANDING')}
                                    isCloudConnected={isCloudConnected}
                                    onRefreshCloud={syncCloudData}
                                    notifications={notifications}
                                    onMarkNotifRead={handleMarkNotificationRead}
                                    onMarkAllNotifRead={handleMarkAllNotificationsRead}
                                />
                            )}
                        </React.Fragment>
                    )}
                </React.Fragment>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<UnifiedNovaLunchApp />);
    </script>
</body>
</html>
