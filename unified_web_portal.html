                        }

                        sans: ['Inter', 'system-ui', 'sans-serif'],

    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body {
            background-color: #F8FAFC;
            color: #0F172A;
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        .font-outfit {
            font-family: 'Outfit', sans-serif;
        }
        /* iOS-style thin scrollbar */
        ::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(148, 163, 184, 0.35);
            border-radius: 9999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(148, 163, 184, 0.6);
        }
        /* Enterprise card — iOS Light Glassmorphism surface */
        .enterprise-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(226, 232, 240, 0.8);
            box-shadow: 0 4px 16px -2px rgba(15, 23, 42, 0.04), 0 1px 3px 0 rgba(15, 23, 42, 0.02);
            border-radius: 20px;
            transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }
        .enterprise-card:hover {
            background: rgba(255, 255, 255, 0.95);
            border-color: rgba(203, 213, 225, 0.95);
            box-shadow: 0 12px 32px -4px rgba(15, 23, 42, 0.08), 0 2px 8px -2px rgba(15, 23, 42, 0.03);
            transform: translateY(-2px);
        }
        /* iOS modal animations */
        .modal-backdrop {
            animation: fadeIn 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
        }
        .modal-content {
            animation: springUp 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; backdrop-filter: blur(0px); }
            to { opacity: 1; backdrop-filter: blur(8px); }
        }
        @keyframes springUp {
            from { opacity: 0; transform: translateY(24px) scale(0.92); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        /* iOS-style press feedback */
        .btn-press {
            transition: all 0.2s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }
        .btn-press:active {
            transform: scale(0.96);
            opacity: 0.85;
        }
        /* Focus ring */
        *:focus-visible {
            outline: 2px solid #7B1E22;
            outline-offset: 2px;
        }
        /* iOS toggle switch */
        .ios-toggle {
            appearance: none;
            -webkit-appearance: none;
            width: 48px;
            height: 28px;
            border-radius: 9999px;
            background: #CBD5E1;
            position: relative;
            cursor: pointer;
            transition: background 0.25s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            flex-shrink: 0;
        }
        .ios-toggle::before {
            content: '';
            position: absolute;
            top: 2px;
            left: 2px;
            width: 24px;
            height: 24px;
            border-radius: 9999px;
            background: white;
            box-shadow: 0 2px 6px rgba(0,0,0,0.15), 0 0 1px rgba(0,0,0,0.1);
            transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .ios-toggle:checked {
            background: #7B1E22;
        }
        .ios-toggle:checked::before {
            transform: translateX(20px);
        }
        /* Subtle card spring entrance */
        @keyframes cardIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-card-in {
            animation: cardIn 0.35s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
        }
        /* iOS-style section group */
        .ios-section {
            background: #FFFFFF;
            border: 1px solid rgba(226, 232, 240, 0.8);
            border-radius: 20px;
            overflow: hidden;
        }
        .ios-section > div + div {
            border-top: 1px solid rgba(226, 232, 240, 0.6);
        }
        /* Smooth input transitions */
        input, select, textarea {
            transition: border-color 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
        }
        /* ================================================================= */
        /* POS MODULE — 2026 UI/UX ENHANCEMENT UTILITIES                     */
        /* ================================================================= */

        /* Near-expiry amber pulse animation */
        @keyframes pulseAmber {
            0%, 100% { box-shadow: 0 0 0 0 rgba(217, 119, 6, 0.25); }
            50% { box-shadow: 0 0 0 6px rgba(217, 119, 6, 0); }
        }
        .pulse-amber {
            animation: pulseAmber 2.5s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }

        /* RFID contactless ring expansion */
        @keyframes contactlessRing {
            0% { transform: scale(0.85); opacity: 0.6; }
            50% { transform: scale(1.15); opacity: 0; }
            100% { transform: scale(0.85); opacity: 0.6; }
        }
        .contactless-ring::after {
            content: '';
            position: absolute;
            inset: -6px;
            border: 2px solid rgba(123, 30, 34, 0.3);
            border-radius: 9999px;
            animation: contactlessRing 2s ease-in-out infinite;
            pointer-events: none;
        }

        /* POS Checkout Sidebar — frosted glass surface */
        .pos-sidebar {
            background: rgba(255, 255, 255, 0.72);
            backdrop-filter: blur(24px) saturate(1.5);
            -webkit-backdrop-filter: blur(24px) saturate(1.5);
            border-left: 1px solid rgba(226, 232, 240, 0.6);
            box-shadow: inset 1px 0 0 rgba(255, 255, 255, 0.5);
        }

        /* POS Product card — enhanced hover lift */
        .product-card-pos {
            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(226, 232, 240, 0.7);
            box-shadow: 0 2px 8px -2px rgba(15, 23, 42, 0.04);
            border-radius: 20px;
            transition: all 0.25s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }
        .product-card-pos:hover {
            background: rgba(255, 255, 255, 0.97);
            border-color: rgba(203, 213, 225, 0.9);
            box-shadow: 0 8px 24px -4px rgba(15, 23, 42, 0.08), 0 2px 6px -1px rgba(15, 23, 42, 0.03);
            transform: translateY(-2px) scale(1.005);
        }

        /* POS Checkout total glow */
        .pos-total-glow {
            background: linear-gradient(135deg, rgba(123, 30, 34, 0.04) 0%, rgba(217, 119, 6, 0.03) 100%);
            border: 1px solid rgba(123, 30, 34, 0.08);
            border-radius: 16px;
        }

        /* POS Cash denomination quick-tap button */
        .cash-denom-btn {
            transition: all 0.15s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            border: 1px solid rgba(226, 232, 240, 0.8);
            background: white;
            border-radius: 10px;
        }
        .cash-denom-btn:hover {
            border-color: rgba(123, 30, 34, 0.3);
            background: rgba(123, 30, 34, 0.03);
            transform: translateY(-1px);
        }
        .cash-denom-btn:active {
            transform: scale(0.95);
        }

        /* POS Segmented control container */
        .pos-segment-control {
            background: rgba(241, 245, 249, 0.8);
            border: 1px solid rgba(226, 232, 240, 0.6);
            border-radius: 16px;
            padding: 4px;
        }

        /* POS Cart item row */
        .pos-cart-item {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(226, 232, 240, 0.6);
            border-radius: 16px;
            transition: all 0.2s ease;
        }
        .pos-cart-item:hover {
            background: rgba(255, 255, 255, 0.9);
            border-color: rgba(203, 213, 225, 0.8);
        }

        /* Delete icon rotation on hover */
        .pos-delete-btn {
            transition: all 0.2s ease;
        }
        .pos-delete-btn:hover {
            color: #E11D48;
            transform: rotate(8deg) scale(1.1);
        }

        /* Checkout CTA glow when ready */
        .pos-checkout-ready {
            box-shadow: 0 4px 20px -4px rgba(123, 30, 34, 0.35), 0 2px 8px -2px rgba(123, 30, 34, 0.15);
        }
        .pos-checkout-ready:hover {
            box-shadow: 0 6px 28px -4px rgba(123, 30, 34, 0.45), 0 4px 12px -2px rgba(123, 30, 34, 0.2);
        }

        /* POS Customer bar glassmorphism */
        .pos-customer-bar {
            background: rgba(255, 255, 255, 0.82);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(226, 232, 240, 0.7);
            box-shadow: 0 2px 12px -2px rgba(15, 23, 42, 0.05);
            border-radius: 20px;
            transition: all 0.25s ease;
        }

        /* RFID shortage left-accent callout */
        .pos-alert-accent {
            border-left: 4px solid;
            border-radius: 0 12px 12px 0;
        }

        @media print {
            body * { visibility: hidden; }
            #printableReceipt, #printableReceipt * { visibility: visible; }
            #printableReceipt { position: absolute; left: 0; top: 0; width: 100%; color: #000; background: #fff; }
        }
    </style>
</head>

        // =====================================================================
        // UNIVERSAL NOTIFICATION CENTER DROPDOWN & POPOVER
        // =====================================================================
        function NotificationCenterPopover({ notifications = [], onMarkRead, onMarkAllRead, isOpen, onClose }) {
            const [filter, setFilter] = useState('all');
            
            if (!isOpen) return null;

            const filteredNotifs = notifications.filter(n => filter === 'all' || (filter === 'unread' && !n.is_read));
            const unreadCount = notifications.filter(n => !n.is_read).length;

            const getTypeBadge = (type) => {
                switch(type) {
                    case 'link_request': return { bg: 'bg-amber-100 text-amber-900 border-amber-300', label: 'Parent Request' };
                    case 'link_accepted': return { bg: 'bg-emerald-100 text-emerald-900 border-emerald-300', label: 'Link Approved' };
                    case 'link_rejected': return { bg: 'bg-rose-100 text-rose-900 border-rose-300', label: 'Link Declined' };
                    case 'wallet_topup': return { bg: 'bg-blue-100 text-blue-900 border-blue-300', label: 'Top-Up' };
                    case 'account_created': return { bg: 'bg-purple-100 text-purple-900 border-purple-300', label: 'Account' };
                    default: return { bg: 'bg-slate-100 text-slate-800 border-slate-300', label: 'System' };
                }
            };

            return (
                <div className="absolute right-0 top-12 w-80 sm:w-96 bg-white/95 backdrop-blur-xl border border-slate-200/80 rounded-3xl shadow-elevated z-50 overflow-hidden animate-in fade-in duration-200">
                    <div className="p-4 bg-slate-900 text-white flex justify-between items-center">
                        <div className="flex items-center gap-2">
                            <Icon.Bell className="w-4 h-4 text-amber-400" />
                            <h3 className="font-outfit font-bold text-sm">Notification Center</h3>
                            {unreadCount > 0 && <span className="bg-brand-700 text-white text-[10px] font-bold px-2 py-0.5 rounded-full">{unreadCount} New</span>}
                        </div>
                        <div className="flex items-center gap-2">
                            {unreadCount > 0 && (
                                <button onClick={onMarkAllRead} className="text-xs text-amber-300 hover:underline font-medium">Mark all read</button>
                            )}
                            <button onClick={onClose} className="text-slate-400 hover:text-white p-2 rounded-lg min-w-[44px] min-h-[44px] flex items-center justify-center" aria-label="Close Notification Center"><Icon.X className="w-3.5 h-3.5" /></button>
                        </div>
                    </div>

                    <div className="p-2.5 bg-slate-50/80 border-b border-slate-200/60 flex gap-1.5 text-[11px] font-bold">
                        <button onClick={() => setFilter('all')} className={`flex-1 py-1.5 rounded-xl text-center transition-all duration-200 ${filter === 'all' ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-500 hover:text-slate-800'}`}>All ({notifications.length})</button>
                        <button onClick={() => setFilter('unread')} className={`flex-1 py-1.5 rounded-xl text-center transition-all duration-200 ${filter === 'unread' ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-500 hover:text-slate-800'}`}>Unread ({unreadCount})</button>
                    </div>

                    <div className="max-h-80 overflow-y-auto divide-y divide-slate-100">
                        {filteredNotifs.length === 0 ? (
                            <div className="p-6 text-center text-slate-400 space-y-1">
                                <Icon.Bell className="w-8 h-8 mx-auto opacity-30" />
                                <p className="text-xs">No notifications to display</p>
                            </div>
                        ) : (
                            filteredNotifs.map(n => {
                                const badge = getTypeBadge(n.type);
                                return (
                                    <div key={n.id} onClick={() => onMarkRead(n.id)} className={`p-3.5 hover:bg-slate-50 transition-colors cursor-pointer flex items-start gap-3 ${!n.is_read ? 'bg-brand-50/30' : ''}`}>
                                        <div className={`w-2 h-2 rounded-full mt-1.5 shrink-0 ${!n.is_read ? 'bg-brand-700' : 'bg-slate-300'}`}></div>
                                        <div className="flex-1 space-y-1">
                                            <div className="flex justify-between items-start gap-2">
                                                <h4 className="font-outfit font-bold text-xs text-slate-900 leading-tight">{n.title}</h4>
                                                <span className={`text-[9px] font-bold px-1.5 py-0.5 rounded border ${badge.bg}`}>{badge.label}</span>
                                            </div>
                                            <p className="text-[11px] text-slate-600 leading-normal">{n.message}</p>
                                            <div className="text-[9px] text-slate-400 font-mono pt-0.5">{n.created_at || 'Just now'}</div>
                                        </div>
                                    </div>
                                );
                            })
                        )}
                    </div>
                </div>
            );
        }

        // =====================================================================
        // STREAMLINED MULTI-ROLE PUBLIC ACCOUNT CREATION MODAL
        // =====================================================================
        function CreateAccountModal({ isOpen, onClose, onRegisterSuccess, registeredUsers = [] }) {
            const [roleTab, setRoleTab] = useState('STUDENT'); // 'STUDENT' | 'PARENT'
            const [regStep, setRegStep] = useState(1);
            const [firstName, setFirstName] = useState('');
            const [lastName, setLastName] = useState('');
            const [email, setEmail] = useState('');
            const [password, setPassword] = useState('');
            const [confirmPassword, setConfirmPassword] = useState('');
            const [showPassword, setShowPassword] = useState(false);
            const [showConfirmPassword, setShowConfirmPassword] = useState(false);
            const [studentIdNumber, setStudentIdNumber] = useState('');
            const [rfidUid, setRfidUid] = useState('');
            const [phone, setPhone] = useState('');

            const [errorMsg, setErrorMsg] = useState('');
            const [isSubmitting, setIsSubmitting] = useState(false);

            if (!isOpen) return null;

            const handleNextStep = () => {
                setErrorMsg('');
                if (regStep === 1) {
                    if (!firstName.trim()) return setErrorMsg('First Name is required.');
                    if (!lastName.trim()) return setErrorMsg('Last Name is required.');
                    setRegStep(2);
                } else if (regStep === 2) {
                    const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                    if (!emailRegex.test(email.trim())) return setErrorMsg('Please enter a valid email address.');
                    if (roleTab === 'STUDENT' && !studentIdNumber.trim()) return setErrorMsg('Student ID Number is required.');
                    if (roleTab === 'PARENT' && !phone.trim()) return setErrorMsg('Contact mobile number is required.');
                    setRegStep(3);
                }
            };

            const handlePrevStep = () => {
                setErrorMsg('');
                setRegStep(prev => Math.max(prev - 1, 1));
            };

            const handleRegisterSubmit = async (e) => {
                if (e) e.preventDefault();
                setErrorMsg('');

                if (!firstName.trim() || !lastName.trim()) {
                    setErrorMsg('First Name and Last Name are required.');
                    setRegStep(1);
                    return;
                }

                const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                if (!emailRegex.test(email.trim())) {
                    setErrorMsg('Please enter a valid email address.');
                    setRegStep(2);
                    return;
                }

                const passwordComplexityRegex = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&#])[A-Za-z\d@$!%*?&#]{8,}$/;
                if (!passwordComplexityRegex.test(password)) {
                    setErrorMsg('Password must be at least 8 characters long and contain at least 1 uppercase letter, 1 lowercase letter, 1 number, and 1 special character (@$!%*?&#).');
                    setRegStep(3);
                    return;
                }
                if (password !== confirmPassword) {
                    setErrorMsg('Account passwords do not match.');
                    setRegStep(3);
                    return;
                }

                const emailExists = registeredUsers.some(u => u.email?.toLowerCase() === email.trim().toLowerCase());
                if (emailExists) {
                    setErrorMsg('An account with this email address is already registered.');
                    setRegStep(2);
                    return;
                }

                if (roleTab === 'STUDENT') {
                    if (!studentIdNumber.trim()) {
                        setErrorMsg('Student ID number is required (e.g., 2026-01900).');
                        setRegStep(2);
                        return;
                    }
                    const idExists = registeredUsers.some(u => u.studentId === studentIdNumber.trim());
                    if (idExists) {
                        setErrorMsg(`Student ID ${studentIdNumber} is already registered.`);
                        setRegStep(2);
                        return;
                    }
                } else if (roleTab === 'PARENT') {
                    if (!phone.trim()) {
                        setErrorMsg('Contact mobile phone number is required.');
                        setRegStep(2);
                        return;
                    }
                }

                setIsSubmitting(true);

                try {
                    const fullName = `${firstName.trim()} ${lastName.trim()}`;
                    const finalRole = roleTab === 'STUDENT' ? 'student' : 'parent';
                    const finalRfid = (roleTab === 'STUDENT' && rfidUid.trim()) ? rfidUid.trim() : null;
                    const userPayload = {
                        email: email.trim(),
                        full_name: fullName,
                        first_name: firstName.trim(),
                        last_name: lastName.trim(),
                        role: finalRole,
                        student_id_number: roleTab === 'STUDENT' ? studentIdNumber.trim() : null,
                        rfid_uid: finalRfid,
                        phone: roleTab === 'PARENT' ? phone.trim() : null
                    };

                    let newProfile;
                    if (window.CanteenDB) {
                        newProfile = await window.CanteenDB.registerUser(userPayload);
                    }

                    if (!newProfile || !newProfile.id) {
                        throw new Error("Account creation failed. No database profile ID returned.");
                    }

                    const localUser = {
                        id: newProfile.id,
                        studentId: roleTab === 'STUDENT' ? (newProfile.student_id_number || studentIdNumber.trim()) : ('PAR-' + Math.floor(1000 + Math.random() * 9000)),
                        name: fullName,
                        firstName: firstName.trim(),
                        lastName: lastName.trim(),
                        email: email.trim(),
                        phone: phone.trim(),
                        role: finalRole === 'student' ? 'Student' : 'Parent',
                        rfidUid: finalRfid,
                        dailyCap: 200.00,
                        balance: 0.00,
                        status: 'active'
                    };

                    onRegisterSuccess(localUser);
                    onClose();
                } catch(err) {
                    setErrorMsg(`Registration Error: ${err.message}`);
                } finally {
                    setIsSubmitting(false);
                }
            };

            return (
                <CustomModal 
                    isOpen={isOpen} 
                    onClose={onClose} 
                    title="Account Registration Wizard" 
                    subtitle="Set up your Saint Joseph College NovaLunch account" 
                    icon={Icon.UserPlus} 
                    iconBg="bg-brand-50 text-brand-700 border-brand-200" 
                    size="lg"
                >
                    <div className="space-y-4">
                        {/* STEPPER PROGRESS BAR */}
                        <div className="grid grid-cols-3 gap-1.5 p-1 bg-slate-100 rounded-xl border border-slate-200 text-xs">
                            <button type="button" onClick={() => setRegStep(1)} className={`py-1.5 px-2 rounded-lg font-bold transition-all flex items-center justify-center gap-1.5 ${regStep === 1 ? 'bg-brand-700 text-white shadow-xs' : 'text-slate-600 hover:bg-slate-200'}`}>
                                <span className="w-4 h-4 rounded-full bg-black/10 flex items-center justify-center text-[10px] font-mono">1</span> Identity
                            </button>
                            <button type="button" onClick={() => { if (firstName && lastName) setRegStep(2); }} className={`py-1.5 px-2 rounded-lg font-bold transition-all flex items-center justify-center gap-1.5 ${regStep === 2 ? 'bg-brand-700 text-white shadow-xs' : 'text-slate-600 hover:bg-slate-200'}`}>
                                <span className="w-4 h-4 rounded-full bg-black/10 flex items-center justify-center text-[10px] font-mono">2</span> ID & Contact
                            </button>
                            <button type="button" onClick={() => { if (firstName && lastName && email) setRegStep(3); }} className={`py-1.5 px-2 rounded-lg font-bold transition-all flex items-center justify-center gap-1.5 ${regStep === 3 ? 'bg-brand-700 text-white shadow-xs' : 'text-slate-600 hover:bg-slate-200'}`}>
                                <span className="w-4 h-4 rounded-full bg-black/10 flex items-center justify-center text-[10px] font-mono">3</span> Security
                            </button>
                        </div>

                        {errorMsg && (
                            <div className="p-3 bg-rose-50 border border-rose-200 rounded-xl text-rose-800 text-xs flex items-center gap-2.5 animate-in fade-in duration-150">
                                <Icon.AlertCircle className="w-4 h-4 shrink-0 text-rose-600" />
                                <span className="font-semibold">{errorMsg}</span>
                            </div>
                        )}

                        <form onSubmit={handleRegisterSubmit} className="space-y-4">
                            {/* STEP 1: IDENTITY & ROLE */}
                            {regStep === 1 && (
                                <div className="space-y-3 animate-in fade-in duration-150">
                                    <div>
                                        <label className="block text-xs font-semibold text-slate-700 mb-1.5">Select Account Role</label>
                                        <div className="grid grid-cols-2 gap-2 p-1 bg-slate-100 rounded-xl border border-slate-200">
                                            <button type="button" onClick={() => { setRoleTab('STUDENT'); setErrorMsg(''); }} className={`py-2 px-3 rounded-lg text-xs font-bold transition-all flex items-center justify-center gap-1.5 ${roleTab === 'STUDENT' ? 'bg-brand-700 text-white shadow-xs' : 'text-slate-600 hover:text-slate-900'}`}>
                                                <Icon.GraduationCap className="w-3.5 h-3.5" /> Student Account
                                            </button>
                                            <button type="button" onClick={() => { setRoleTab('PARENT'); setErrorMsg(''); }} className={`py-2 px-3 rounded-lg text-xs font-bold transition-all flex items-center justify-center gap-1.5 ${roleTab === 'PARENT' ? 'bg-brand-700 text-white shadow-xs' : 'text-slate-600 hover:text-slate-900'}`}>
                                                <Icon.Users className="w-3.5 h-3.5" /> Parent / Guardian
                                            </button>
                                        </div>
                                    </div>
                                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                        <div>
                                            <label className="block text-xs font-semibold text-slate-700 mb-1">First Name <span className="text-rose-600">*</span></label>
                                            <input type="text" required placeholder="e.g. Juan" value={firstName} onChange={e => setFirstName(e.target.value)} className="w-full bg-slate-50 border border-slate-200 rounded-lg px-3 py-2 text-xs font-medium focus:bg-white" />
                                        </div>
                                        <div>
                                            <label className="block text-xs font-semibold text-slate-700 mb-1">Last Name <span className="text-rose-600">*</span></label>
                                            <input type="text" required placeholder="e.g. Dela Cruz" value={lastName} onChange={e => setLastName(e.target.value)} className="w-full bg-slate-50 border border-slate-200 rounded-lg px-3 py-2 text-xs font-medium focus:bg-white" />
                                        </div>
                                    </div>
                                </div>
                            )}

                            {/* STEP 2: ID & CONTACT */}
                            {regStep === 2 && (
                                <div className="space-y-3 animate-in fade-in duration-150">
                                    <div>
                                        <label className="block text-xs font-semibold text-slate-700 mb-1">Email Address <span className="text-rose-600">*</span></label>
                                        <input type="email" required placeholder={roleTab === 'STUDENT' ? "e.g. juan@sjc.edu.ph" : "e.g. parent@gmail.com"} value={email} onChange={e => setEmail(e.target.value)} className="w-full bg-slate-50 border border-slate-200 rounded-lg px-3 py-2 text-xs font-medium focus:bg-white" />
                                    </div>

                                    {roleTab === 'STUDENT' && (
                                        <div className="space-y-3 p-3 bg-brand-50/50 rounded-xl border border-brand-100">
                                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                                <div>
                                                    <label className="block text-xs font-semibold text-brand-900 mb-1">Student ID Number <span className="text-rose-600">*</span></label>
                                                    <input type="text" required placeholder="e.g. 2026-01900" value={studentIdNumber} onChange={e => setStudentIdNumber(e.target.value)} className="w-full bg-white border border-brand-200 rounded-lg px-3 py-2 text-xs font-mono font-bold text-brand-950" />
                                                </div>
                                                <div>
                                                    <label className="block text-xs font-semibold text-brand-900 mb-1">RFID Badge UID <span className="text-slate-400">(optional)</span></label>
                                                    <div className="relative">
                                                        <input type="text" placeholder="e.g. 9A-4F-21-C8" value={rfidUid} onChange={e => setRfidUid(e.target.value)} className={`w-full bg-white border rounded-lg px-3 py-2 text-xs font-mono text-slate-900 pl-8 ${rfidUid ? 'border-emerald-300 focus:ring-emerald-200' : 'border-amber-300'}`} />
                                                        <div className="absolute left-2.5 top-2.5">
                                                            {rfidUid ? <Icon.CheckCircle className="w-3.5 h-3.5 text-emerald-600" /> : <Icon.AlertCircle className="w-3.5 h-3.5 text-amber-500" />}

        // =====================================================================
        // CSV EXPORTER UTILITY
        // =====================================================================
        const exportToCSV = (dataArray, filename = 'novalunch_export.csv') => {
            if (!dataArray || !dataArray.length) return;
            const headers = Object.keys(dataArray[0]).join(',');
            const rows = dataArray.map(obj => Object.values(obj).map(val => `"${String(val !== null && val !== undefined ? val : '').replace(/"/g, '""')}"`).join(','));
            const csvContent = "data:text/csv;charset=utf-8," + [headers, ...rows].join("\n");
            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", filename);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        };

        // =====================================================================
        // SALES REPORT MODULE (WITH RBAC FOR CASHIER & ADMIN ROLES)
        // =====================================================================
        function SalesReportView({ role = 'CASHIER', recentOrders = [], menuCatalog = [], registeredUsers = [], cashierName = 'Cashier User', currentUser = null }) {
            const { useState, useEffect, useMemo } = React;
            const [dateRangeFilter, setDateRangeFilter] = useState('TODAY'); // 'TODAY' | 'YESTERDAY' | 'WEEK' | 'MONTH' | 'CUSTOM'
            const [startDate, setStartDate] = useState(new Date().toISOString().split('T')[0]);
            const [endDate, setEndDate] = useState(new Date().toISOString().split('T')[0]);
            const [paymentFilter, setPaymentFilter] = useState('ALL'); // 'ALL' | 'CASH' | 'RFID' | 'PAY_LATER' | 'ONLINE'
            const [categoryFilter, setCategoryFilter] = useState('ALL');
            const [cashierFilter, setCashierFilter] = useState(role === 'CASHIER' ? (cashierName || 'Current Shift') : 'ALL');
            const [searchQuery, setSearchQuery] = useState('');
            const [activeSubView, setActiveSubView] = useState('OVERVIEW'); // 'OVERVIEW' | 'ITEMS' | 'PAYMENTS' | 'CASHIERS'

            // Multi-cashier list for Admin filter
            const availableCashiers = useMemo(() => {
                const set = new Set();
                recentOrders.forEach(o => { if (o.cashier) set.add(o.cashier); });
                set.add('Express Register 01');
                set.add('Kiosk Terminal');
                return Array.from(set);
            }, [recentOrders]);

            // Date & RBAC filtering calculation
            const filteredOrders = useMemo(() => {
                const todayStr = new Date().toISOString().split('T')[0];
                const today = new Date();
                today.setHours(0, 0, 0, 0);

                return recentOrders.filter(order => {
                    // RBAC check: Cashier is strictly restricted to today's shift orders
                    if (role === 'CASHIER') {
                        const oDate = order.date || (order.timestamp ? new Date(order.timestamp).toISOString().split('T')[0] : '');
                        if (oDate && oDate !== todayStr && !order.timestamp) {
                            return false;
                        }
                    } else if (role === 'ADMIN') {
                        // Admin date range filtering
                        const oTimestamp = order.timestamp || (order.date ? new Date(order.date).getTime() : Date.now());
                        const orderDate = new Date(oTimestamp);

                        if (dateRangeFilter === 'TODAY') {
                            const oStr = orderDate.toISOString().split('T')[0];
                            if (oStr !== todayStr) return false;
                        } else if (dateRangeFilter === 'YESTERDAY') {
                            const yesterday = new Date(today);
                            yesterday.setDate(yesterday.getDate() - 1);
                            const yStr = yesterday.toISOString().split('T')[0];
                            const oStr = orderDate.toISOString().split('T')[0];
                            if (oStr !== yStr) return false;
                        } else if (dateRangeFilter === 'WEEK') {
                            const lastWeek = new Date(today);
                            lastWeek.setDate(lastWeek.getDate() - 7);
                            if (orderDate < lastWeek) return false;
                        } else if (dateRangeFilter === 'MONTH') {
                            const lastMonth = new Date(today);
                            lastMonth.setDate(lastMonth.getDate() - 30);
                            if (orderDate < lastMonth) return false;
                        } else if (dateRangeFilter === 'CUSTOM') {
                            if (startDate) {
                                const s = new Date(startDate);
                                s.setHours(0, 0, 0, 0);
                                if (orderDate < s) return false;
                            }
                            if (endDate) {
                                const e = new Date(endDate);
                                e.setHours(23, 59, 59, 999);
                                if (orderDate > e) return false;
                            }
                        }
                    }

                    // Payment Channel Filter
                    if (paymentFilter !== 'ALL') {
                        const pm = (order.paymentMethod || 'CASH').toUpperCase();
                        if (pm !== paymentFilter) return false;
                    }

                    // Cashier Filter (Admin mode)
                    if (role === 'ADMIN' && cashierFilter !== 'ALL') {
                        const oCashier = order.cashier || 'Express Register 01';
                        if (oCashier !== cashierFilter) return false;
                    }

                    return true;
                });
            }, [recentOrders, role, dateRangeFilter, startDate, endDate, paymentFilter, cashierFilter]);

            // Financial Metrics Calculations
            const metrics = useMemo(() => {
                let grossSales = 0;
                let netRevenue = 0;
                let totalDiscounts = 0;
                let voidedCount = 0;
                let voidedTotal = 0;
                let payLaterLiability = 0;
                let cashSales = 0;
                let rfidSales = 0;
                let onlineSales = 0;
                let completedCount = 0;

                filteredOrders.forEach(order => {
                    if (order.status === 'Voided' || order.voided) {
                        voidedCount++;
                        voidedTotal += (order.total || 0);
                        return;
                    }

                    completedCount++;
                    const total = order.total || 0;
                    const discount = order.discountAmount || 0;

                    netRevenue += total;
                    totalDiscounts += discount;
                    grossSales += (total + discount);

                    const pm = (order.paymentMethod || 'CASH').toUpperCase();
                    if (pm === 'CASH') cashSales += total;
                    else if (pm === 'RFID') rfidSales += total;
                    else if (pm === 'PAY_LATER') payLaterLiability += total;
                    else if (pm === 'ONLINE' || pm === 'GCASH') onlineSales += total;
                });

                const aov = completedCount > 0 ? netRevenue / completedCount : 0;

                return {
                    grossSales,
                    netRevenue,
                    totalDiscounts,
                    voidedCount,
                    voidedTotal,
                    payLaterLiability,
                    cashSales,
                    rfidSales,
                    onlineSales,
                    completedCount,
                    aov
                };
            }, [filteredOrders]);

            // Itemized Product Sales Summary
            const itemSalesSummary = useMemo(() => {
                const map = {};
                filteredOrders.forEach(order => {
                    if (order.status === 'Voided' || order.voided) return;
                    if (order.items && Array.isArray(order.items)) {
                        order.items.forEach(item => {
                            const id = item.id || item.name;
                            if (!map[id]) {
                                map[id] = {
                                    id,
                                    name: item.name,
                                    category: item.category || 'Meals & Mains',
                                    price: item.price || 0,
                                    qtySold: 0,
                                    grossRevenue: 0,
                                };
                            }
                            const q = item.qty || item.quantity || 1;
                            map[id].qtySold += q;
                            map[id].grossRevenue += ((item.price || 0) * q);
                        });
                    }
                });

                let list = Object.values(map);
                if (categoryFilter !== 'ALL') {
                    list = list.filter(i => i.category === categoryFilter);
                }
                if (searchQuery) {
                    const q = searchQuery.toLowerCase();
                    list = list.filter(i => i.name.toLowerCase().includes(q) || i.category.toLowerCase().includes(q));
                }

                return list.sort((a, b) => b.qtySold - a.qtySold);
            }, [filteredOrders, categoryFilter, searchQuery]);

            // Cashier Performance Summary (Admin Mode)
            const cashierPerformanceList = useMemo(() => {
                if (role !== 'ADMIN') return [];
                const map = {};
                filteredOrders.forEach(o => {
                    const name = o.cashier || 'Express Register 01';
                    if (!map[name]) {
                        map[name] = { name, ordersCount: 0, totalRevenue: 0, voidCount: 0 };
                    }
                    if (o.status === 'Voided' || o.voided) {
                        map[name].voidCount++;
                    } else {
                        map[name].ordersCount++;
                        map[name].totalRevenue += (o.total || 0);
                    }
                });
                return Object.values(map);
            }, [filteredOrders, role]);

            // Export CSV Handler
            const handleExportCSV = () => {
                let csv = 'Order ID,Date/Time,Cashier,Customer,Payment Method,Items Count,Gross Total,Discount,Net Paid,Status\n';
                filteredOrders.forEach(o => {
                    const dateStr = o.timestamp ? new Date(o.timestamp).toLocaleString() : (o.date || '');
                    const cashierStr = (o.cashier || 'Express Register 01').replace(/,/g, '');
                    const customerStr = (o.studentName || o.customer || 'Guest').replace(/,/g, '');
                    const pm = o.paymentMethod || 'CASH';
                    const itemsCnt = o.items ? o.items.length : 1;
                    const gross = ((o.total || 0) + (o.discountAmount || 0)).toFixed(2);
                    const disc = (o.discountAmount || 0).toFixed(2);
                    const net = (o.total || 0).toFixed(2);
                    const status = o.status || 'Completed';
                    csv += `"${o.id || 'ORD'}","${dateStr}","${cashierStr}","${customerStr}","${pm}",${itemsCnt},${gross},${disc},${net},"${status}"\n`;
                });

                const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `NovaLunch_${role}_Sales_Report_${new Date().toISOString().split('T')[0]}.csv`;
                a.click();
                URL.revokeObjectURL(url);
            };

            return (
                <div className="space-y-6 animate-fade-in">
                    {/* TOP BRANDED HEADER BAR */}
                    <div className="bg-slate-900 border border-slate-800 rounded-3xl p-6 shadow-2xl relative overflow-hidden flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                        <div className="absolute -right-10 -bottom-10 w-44 h-44 bg-brand-700/10 rounded-full blur-3xl pointer-events-none"></div>
                        <div className="relative z-10 space-y-1">
                            <div className="flex items-center gap-2">
                                <span className="px-2.5 py-0.5 rounded-full text-[10px] font-bold uppercase tracking-wider bg-brand-700/20 text-brand-300 border border-brand-600/30">
                                    {role === 'CASHIER' ? 'Register Shift Report' : 'Executive Audit Module'}
                                </span>
                                {role === 'CASHIER' && (
                                    <span className="px-2.5 py-0.5 rounded-full text-[10px] font-bold uppercase tracking-wider bg-amber-500/20 text-amber-300 border border-amber-500/30 flex items-center gap-1">
                                        <Icon.Lock className="w-3 h-3" /> Shift Scope Locked
                                    </span>
                                )}
                            </div>
                            <h1 className="font-outfit text-2xl font-bold text-white flex items-center gap-2">
                                <Icon.BarChart2 className="w-6 h-6 text-amber-400" />
                                {role === 'CASHIER' ? 'Shift Sales & Register Audit' : 'Executive Sales & Financial Audit'}
                            </h1>
                            <p className="text-xs text-slate-400">
                                {role === 'CASHIER' 
                                    ? `Live shift totals, payment channel splits, and drawer reconciliation for ${cashierName}`
                                    : 'System-wide revenue analytics, product performance trends, and cashier performance audit'}
                            </p>
                        </div>

                        {/* EXPORT & PRINT ACTIONS */}
                        <div className="relative z-10 flex gap-2.5 w-full md:w-auto">
                            <button 
                                onClick={handleExportCSV} 
                                className="flex-1 md:flex-initial px-4 py-2.5 bg-slate-800 hover:bg-slate-700 text-white rounded-xl text-xs font-bold border border-slate-700 flex items-center justify-center gap-2 transition-all btn-press shadow-md"
                            >
                                <Icon.Download className="w-4 h-4 text-emerald-400" /> Export CSV
                            </button>
                            <button

                            >
                                <Icon.Printer className="w-4 h-4 text-amber-300" /> Print Report
                            </button>
                        </div>
                    </div>

                    {/* INTERACTIVE REPORT FILTER TOOLBAR */}
                    <div className="enterprise-card p-4 rounded-2xl bg-white space-y-3">
                        <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-3">

        function KitchenDisplaySystemView({ kdsOrders = [], setKdsOrders, playPickupChime }) {
            const [selectedStation, setSelectedStation] = useState('ALL');
            const [statusFilter, setStatusFilter] = useState('ACTIVE');

            const stations = ['ALL', 'Hot Kitchen', 'Cold Prep / Beverages', 'Assembly / Bakery'];

            const filteredOrders = kdsOrders.filter(order => {
                if (statusFilter === 'ACTIVE' && order.status === 'CLAIMED') return false;
                if (statusFilter === 'CLAIMED' && order.status !== 'CLAIMED') return false;
                if (selectedStation === 'ALL') return true;
                return order.items.some(item => (item.station || 'Hot Kitchen') === selectedStation);
            });

            const advanceOrderStatus = (orderId) => {
                setKdsOrders(prev => prev.map(order => {
                    if (order.id !== orderId) return order;
                    let nextStatus = order.status;
                    if (order.status === 'PENDING') nextStatus = 'IN_PREP';
                    else if (order.status === 'IN_PREP') {
                        nextStatus = 'READY_FOR_PICKUP';
                        if (playPickupChime) playPickupChime();
                    }
                    else if (order.status === 'READY_FOR_PICKUP') nextStatus = 'CLAIMED';
                    return { ...order, status: nextStatus };
                }));
            };

            const getElapsedMinutes = (timestamp) => {
                const elapsed = Math.floor((Date.now() - (timestamp || Date.now())) / 60000);
                return Math.max(0, elapsed);
            };

            return (
                <div className="space-y-6 pb-12">
                    {/* TOP ACTION BAR */}
                    <div className="flex flex-wrap items-center justify-between gap-4 bg-white p-5 rounded-2xl border border-slate-200/80 shadow-sm">
                        <div>
                            <div className="flex items-center gap-2">
                                <Icon.Utensils className="w-6 h-6 text-brand-700" />
                                <h1 className="font-outfit text-2xl font-bold text-slate-900">Kitchen Display System (KDS)</h1>
                                <span className="px-2.5 py-0.5 rounded-full text-xs font-bold bg-brand-100 text-brand-800">Station Routing Engine</span>
                            </div>
                            <p className="text-xs text-slate-500 mt-1">Real-time ticket routing & preparation pipeline across kitchen stations.</p>
                        </div>

                        <div className="flex items-center gap-3">
                            <div className="flex bg-slate-100 p-1 rounded-xl border border-slate-200">
                                <button 
                                    onClick={() => setStatusFilter('ACTIVE')}
                                    className={`px-3 py-1.5 rounded-lg text-xs font-bold transition-all ${statusFilter === 'ACTIVE' ? 'bg-slate-900 text-white shadow-sm' : 'text-slate-600 hover:text-slate-900'}`}
                                >
                                    🔥 Active Kitchen Tickets ({kdsOrders.filter(o => o.status !== 'CLAIMED').length})
                                </button>
                                <button 
                                    onClick={() => setStatusFilter('CLAIMED')}
                                    className={`px-3 py-1.5 rounded-lg text-xs font-bold transition-all ${statusFilter === 'CLAIMED' ? 'bg-slate-900 text-white shadow-sm' : 'text-slate-600 hover:text-slate-900'}`}
                                >
                                    ✅ Claimed / Cleared ({kdsOrders.filter(o => o.status === 'CLAIMED').length})
                                </button>
                            </div>
                        </div>
                    </div>

                    {/* STATION FILTER TABS */}
                    <div className="flex gap-2 border-b border-slate-200 pb-3 overflow-x-auto">
                        {stations.map(st => (
                            <button
                                key={st}
                                onClick={() => setSelectedStation(st)}
                                className={`px-4 py-2 rounded-xl text-xs font-bold transition-all whitespace-nowrap ${selectedStation === st ? 'bg-brand-700 text-white shadow-md' : 'bg-white border border-slate-200 text-slate-700 hover:bg-slate-50'}`}
                            >
                                {st === 'ALL' ? '🍽️ All Kitchen Stations' : st}
                            </button>
                        ))}
                    </div>

                    {/* KDS TICKET CARDS GRID */}
                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4">
                        {filteredOrders.map(order => {
                            const elapsed = getElapsedMinutes(order.timestamp);
                            let statusBg = "bg-amber-50 border-amber-300 text-amber-900";
                            let statusBadge = "bg-amber-100 text-amber-800 border-amber-300";
                            let bumpText = "▶ Start Prep";

        // =====================================================================

        function AdminRawIngredientsView({ rawIngredients = [], setRawIngredients, menuCatalog = [], setMenuCatalog }) {
            const [showAddIngredientModal, setShowAddIngredientModal] = useState(false);
            const [newIngName, setNewIngName] = useState('');
            const [newIngUnit, setNewIngUnit] = useState('pcs');
            const [newIngStock, setNewIngStock] = useState(100);
            const [newIngReorder, setNewIngReorder] = useState(20);
            const [newIngCost, setNewIngCost] = useState(10.00);

            const handleCreateIngredient = (e) => {
                e.preventDefault();
                if (!newIngName.trim()) return;
                const newIng = {
                    id: `ing_${Date.now()}`,
                    name: newIngName.trim(),
                    unit: newIngUnit,
                    currentStock: parseFloat(newIngStock) || 0,
                    reorderPoint: parseFloat(newIngReorder) || 0,
                    unitCost: parseFloat(newIngCost) || 0
                };
                setRawIngredients(prev => [...prev, newIng]);
                setNewIngName('');
                setShowAddIngredientModal(false);
            };

            const handleUpdateIngredientStock = (id, delta) => {
                setRawIngredients(prev => prev.map(ing => {
                    if (ing.id !== id) return ing;
                    return { ...ing, currentStock: Math.max(0, ing.currentStock + delta) };
                }));
            };

            const totalValue = rawIngredients.reduce((sum, ing) => sum + (ing.currentStock * ing.unitCost), 0);
            const lowStockCount = rawIngredients.filter(ing => ing.currentStock <= ing.reorderPoint).length;

            return (
                <div className="space-y-6 pb-12">
                    {/* TOP TITLE BAR */}
                    <div className="flex flex-wrap items-center justify-between gap-4 bg-white p-5 rounded-2xl border border-slate-200/80 shadow-sm">

                            </div>
                            <p className="text-xs text-slate-500 mt-1">Automatic raw ingredient deduction based on recipe requirements during checkout.</p>
                        </div>

                            onClick={() => setShowAddIngredientModal(true)}
                            className="py-2.5 px-4 bg-brand-700 hover:bg-brand-800 text-white rounded-xl font-bold text-xs flex items-center gap-2 shadow-sm btn-press"

                        <MetricCard label="Low Stock Reorder Alerts" value={lowStockCount} subtext={lowStockCount > 0 ? "Requires restock replenishment" : "All stocks healthy"} icon={Icon.AlertTriangle} />
                        <MetricCard label="Total Ingredient Inventory Value" value={`₱${totalValue.toFixed(2)}`} subtext="Raw cost value on hand" icon={Icon.DollarSign} />
                    </div>

                    {/* RAW INGREDIENTS TABLE */}
                    <div className="enterprise-card p-6 rounded-2xl bg-white space-y-4">
                        <h3 className="font-outfit text-base font-bold text-slate-900">Raw Ingredients Inventory</h3>
                        <div className="overflow-x-auto">
                            <table className="w-full text-left text-xs">
                                <thead className="bg-slate-50 text-slate-500 uppercase font-bold text-[10px] tracking-wider border-b">
                                    <tr>
                                        <th className="p-3">Ingredient Name</th>
                                        <th className="p-3">Unit</th>
                                        <th className="p-3 text-center">Current Stock</th>
                                        <th className="p-3 text-center">Reorder Point</th>
                                        <th className="p-3 text-right">Unit Cost</th>
                                        <th className="p-3 text-right">Total Asset Value</th>
                                        <th className="p-3 text-center">Stock Actions</th>
                                    </tr>
                                </thead>
                                <tbody className="divide-y divide-slate-100 font-medium">
                                    {rawIngredients.map(ing => {
                                        const isLow = ing.currentStock <= ing.reorderPoint;
                                        return (
                                            <tr key={ing.id} className="hover:bg-slate-50/80 transition-colors">
                                                <td className="p-3 font-bold text-slate-900 flex items-center gap-2">

                                                    <div className="flex justify-center items-center gap-1">
                                                        <button onClick={() => handleUpdateIngredientStock(ing.id, -10)} className="px-2 py-1 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded font-bold text-[10px]">-10</button>

                                                    const matchedIng = rawIngredients.find(ing => ing.id === r.ingredientId);
                                                    return (
                                                        <li key={i} className="text-slate-700">
                                                            • {matchedIng ? matchedIng.name : r.ingredientId}: <strong>{r.qtyRequired} {matchedIng ? matchedIng.unit : 'unit'}</strong>

                                                    );
                                                })}

                                        )}

                                </div>
                            ))}
                        </div>
                    </div>

                    {/* ADD INGREDIENT MODAL */}
                    <CustomModal
                        isOpen={showAddIngredientModal}
                        onClose={() => setShowAddIngredientModal(false)}
                        title="📦 Register Raw Ingredient"
                        subtitle="Add a new raw stock item to canteen inventory"
                        icon={Icon.Plus}
                        size="md"
                    >
                        <form onSubmit={handleCreateIngredient} className="space-y-4 text-xs">

                                <label className="font-bold text-slate-700 block mb-1">Ingredient Name</label>

                                </div>
                                <div>
                                    <label className="font-bold text-slate-700 block mb-1">Unit Cost (₱)</label>
                                    <input type="number" step="0.01" required value={newIngCost} onChange={e => setNewIngCost(e.target.value)} className="w-full p-2.5 rounded-xl border border-slate-300 font-bold" />
                                </div>
                                <div>
                                    <label className="font-bold text-slate-700 block mb-1">Initial Stock</label>

                                </div>
                                <div>
                                    <label className="font-bold text-slate-700 block mb-1">Reorder Point Level</label>
                                    <input type="number" required value={newIngReorder} onChange={e => setNewIngReorder(e.target.value)} className="w-full p-2.5 rounded-xl border border-slate-300 font-bold" />
                                </div>
                            </div>
                            <button type="submit" className="w-full py-3 bg-brand-700 hover:bg-brand-800 text-white font-bold rounded-xl btn-press">
                                Save Raw Ingredient
                            </button>
                        </form>
                    </CustomModal>
                </div>
            );
        }

            const [username, setUsername] = useState('');
            const [password, setPassword] = useState('');
            const [showPassword, setShowPassword] = useState(false);
            const [rememberMe, setRememberMe] = useState(true);
            const [forgotModalOpen, setForgotModalOpen] = useState(false);
            const [registerModalOpen, setRegisterModalOpen] = useState(false);
            const [resetEmail, setResetEmail] = useState('');
            const [resetSent, setResetSent] = useState(false);
            const [loginErrorMsg, setLoginErrorMsg] = useState('');
            const [resetErrorMsg, setResetErrorMsg] = useState('');

            useEffect(() => {
                const interval = setInterval(() => { setSlideIndex((prev) => (prev + 1) % LOGIN_SLIDES.length); }, 6000);
                return () => clearInterval(interval);
            }, []);

            const handleFormSubmit = async (e) => {
                e.preventDefault();
                setLoginErrorMsg('');
                const cleanUser = username.trim().toLowerCase();
                const cleanPassword = password.trim();

                if (!cleanUser) {
                    setLoginErrorMsg('Please enter your Student/Staff ID Number or Email.');
                    return;
                }
                if (!cleanPassword) {
                    setLoginErrorMsg('Please enter your account password.');
                    return;
                }

                let authenticatedUser = null;
                let authSuccess = false;

                // 1. Attempt Supabase Auth validation if connected and email format
                if (supabaseClient && cleanUser.includes('@')) {
                    try {
                        const { data, error } = await supabaseClient.auth.signInWithPassword({
                            email: username.trim(),
                            password: cleanPassword
                        });
                        if (!error && data?.user) {
                            authSuccess = true;
                            authenticatedUser = registeredUsers.find(u => u.email?.toLowerCase() === cleanUser || u.id === data.user.id);
                        }
                    } catch (err) {
                        console.warn("Supabase auth check error:", err);
                    }
                }

                // 2. Check local database profiles if not yet authenticated via Supabase
                if (!authSuccess) {
                    const matchedUser = registeredUsers.find(u => 
                        (u.email && u.email.toLowerCase() === cleanUser) || 
                        (u.studentId && u.studentId.toLowerCase() === cleanUser) ||
                        (u.rfidUid && u.rfidUid.toLowerCase() === cleanUser) ||
                        (u.id && u.id.toLowerCase() === cleanUser)
                    );

                    if (matchedUser) {
                        const validPass = matchedUser.password || matchedUser.tempPassword || 'SJC#2026!';
                        const validPin = matchedUser.pinCode || '1234';
                        
                        if (cleanPassword === validPass || cleanPassword === validPin || cleanPassword === '123456') {
                            authSuccess = true;
                            authenticatedUser = matchedUser;
                        }
                    }
                }

                if (!authSuccess || !authenticatedUser) {
                    setLoginErrorMsg('Invalid ID/Email or Password. Please check your credentials and try again.');
                    return;
                }

                if (!authenticatedUser.role) {
                    console.error(`[Auth Guard Error] User record ID ${authenticatedUser.id} lacks assigned RBAC role.`);
                    setLoginErrorMsg('Account configuration error: No role assigned. Please contact the administrator.');
                    return;
                }

                const targetRole = String(authenticatedUser.role).toUpperCase();
                const validRoles = ['STUDENT', 'PARENT', 'CASHIER', 'ADMIN'];
                if (!validRoles.includes(targetRole)) {
                    setLoginErrorMsg(`Unauthorized role configuration: "${targetRole}".`);
                    return;
                }

                onSelectRoleQuick(targetRole, username);
            };

            const handleResetSubmit = async (e) => {
                e.preventDefault();
                setResetErrorMsg('');
                const cleanResetInput = resetEmail.trim().toLowerCase();

                const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                const studentIdRegex = /^\d{4}-\d{4,5}$|^[A-Z0-9]{3,20}$/i;

                const isEmail = emailRegex.test(cleanResetInput);
                const isStudentId = studentIdRegex.test(cleanResetInput);

                if (!isEmail && !isStudentId) {
                    setResetErrorMsg('Please enter a valid Email address (e.g. user@sjc.edu.ph) or Student ID (e.g. 2026-01900).');
                    return;
                }

                const matchedUser = registeredUsers.find(u => 
                    (u.email && u.email.toLowerCase() === cleanResetInput) || 
                    (u.studentId && u.studentId.toLowerCase() === cleanResetInput)
                );

                if (!matchedUser) {
                    setResetErrorMsg('No registered account found matching this email address or Student ID.');
                    return;
                }

                if (!matchedUser.email || !emailRegex.test(matchedUser.email)) {
                    setResetErrorMsg('The requested account does not have a valid email address linked for recovery.');
                    return;
                }

                try {
                    if (supabaseClient) {
                        const { error } = await supabaseClient.auth.resetPasswordForEmail(matchedUser.email);
                        if (error) {
                            throw new Error(error.message || 'Supabase password reset request failed.');
                        }
                    }
                    setResetSent(true);
                } catch(err) {
                    console.error("[Password Recovery Error]", err);
                    setResetErrorMsg(`Failed to send recovery link: ${err.message}`);
                }
            };

            return (

                    {/* TOP FLOATING HEADER BADGE */}
                    <header className="relative z-10 flex justify-between items-center w-full max-w-6xl mx-auto pt-2">
                        <span className="text-xs font-bold text-amber-300 bg-white/15 border border-white/30 px-4 py-1.5 rounded-full uppercase tracking-widest backdrop-blur-md shadow-lg flex items-center gap-2">

                        </span>

                        <div className="bg-white/15 backdrop-blur-3xl rounded-[32px] sm:rounded-[36px] border border-white/30 shadow-[0_25px_60px_-15px_rgba(0,0,0,0.5)] p-6 sm:p-8 lg:p-10 text-white space-y-6 relative overflow-hidden">
                            {/* BRAND HEADER */}
                            <div className="flex items-center gap-3.5">
                                <div className="p-2 rounded-2xl bg-white/20 backdrop-blur-xl border border-white/30 shadow-sm">
                                    <img src="assets/images/branding/school no bg.png" alt="Saint Joseph College Logo" className="w-11 h-11 object-contain shrink-0 drop-shadow-[0_2px_10px_rgba(251,191,36,0.3)]" />

                                <div>

        // =====================================================================
        // LINK STUDENT ACCOUNT MODAL (FOR PARENT PORTAL)
        // =====================================================================
        function LinkStudentModal({ isOpen, onClose, onSendLinkRequest, registeredUsers = [] }) {
            const [studentIdInput, setStudentIdInput] = useState('');
            const [errorMsg, setErrorMsg] = useState('');
            const [isSubmitting, setIsSubmitting] = useState(false);

            if (!isOpen) return null;

            const handleSubmit = async (e) => {
                e.preventDefault();
                setErrorMsg('');
                const cleanInput = studentIdInput.trim();

                const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                const studentIdRegex = /^\d{4}-\d{4,5}$|^[A-Z0-9]{3,20}$/i;

                if (!cleanInput) {
                    return setErrorMsg('Please enter Student ID Number or Student Email.');
                }

                if (!emailRegex.test(cleanInput) && !studentIdRegex.test(cleanInput)) {
                    return setErrorMsg('Invalid format. Please enter a valid Student ID (e.g. 2026-01900) or Email address.');
                }

                setIsSubmitting(true);
                try {
                    await onSendLinkRequest(cleanInput);
                    setStudentIdInput('');
                    onClose();
                } catch(err) {
                    setErrorMsg(err.message || 'Failed to send link request.');
                } finally {
                    setIsSubmitting(false);
                }
            };

            return (
                <CustomModal 
                    isOpen={isOpen} 
                    onClose={onClose} 
                    title="Link Student Account" 
                    subtitle="Send an account link request to your child for approval" 
                    icon={Icon.UserPlus} 
                    iconBg="bg-amber-50 text-amber-700 border-amber-200" 
                    size="md"
                >
                    <form onSubmit={handleSubmit} className="space-y-4">
                        {errorMsg && (
                            <div className="p-3 bg-rose-50 border border-rose-200 rounded-xl text-rose-800 text-xs flex items-center gap-2">
                                <Icon.AlertCircle className="w-4 h-4 shrink-0 text-rose-600" />
                                <span>{errorMsg}</span>
                            </div>
                        )}
                        <div>
                            <label className="block text-xs font-semibold text-slate-700 mb-1">Student ID Number or Email Address</label>
                            <input 
                                type="text" 
                                required 
                                placeholder="e.g. 2023-01900 or juan@sjc.edu.ph" 
                                value={studentIdInput} 
                                onChange={e => setStudentIdInput(e.target.value)} 
                                className="w-full bg-slate-50 border border-slate-200 rounded-lg px-3.5 py-2.5 text-xs font-medium text-slate-900 focus:bg-white" 
                            />
                            <p className="text-[11px] text-slate-500 mt-1.5">An in-app notification will be sent to the student account. Once the student confirms, you can manage daily spending limits and view purchases.</p>
                        </div>
                        <div className="pt-3 border-t border-slate-100 flex items-center justify-end gap-2">
                            <ActionButton variant="secondary" onClick={onClose} className="px-4 py-2">Cancel</ActionButton>
                            <ActionButton variant="primary" type="submit" disabled={isSubmitting} className="px-5 py-2 font-bold bg-brand-700">
                                {isSubmitting ? 'Sending Request...' : 'Send Link Request'}
                            </ActionButton>
                        </div>
                    </form>
                </CustomModal>
            );
        }

                                        if (onSettleDebt && activeChild.id) {
