            const [editProdPrice, setEditProdPrice] = useState('');

            const [studCap, setStudCap] = useState('200');
            const [studBalance, setStudBalance] = useState('350');

            const [prodPrice, setProdPrice] = useState('');
            const [prodStock, setProdStock] = useState('50');

                setSelectedStudent(user);
                setEditName(user.name);
                setEditIdNum(user.studentId);
                setEditRfid(user.rfidUid);
                setEditCap(user.dailyCap.toString());
                setEditBalance(user.balance.toString());
                setEditStatus(user.status);
                setEditStudentModalOpen(true);
            };

            const openEditProduct = (prod) => {
                setSelectedProduct(prod);
                setEditProdName(prod.name);
                setEditProdPrice(prod.price.toString());
                setEditProdStock(prod.stock.toString());
                setEditProdCategory(prod.category);
                setEditProductModalOpen(true);
            };

            const handleSaveStudentEdit = (e) => {
                e.preventDefault();
                if (!selectedStudent) return;
                onUpdateStudent({
                    ...selectedStudent,
                    name: editName,
                    studentId: editIdNum,
                    rfidUid: editRfid,
                    dailyCap: parseFloat(editCap) || 200,
                    balance: parseFloat(editBalance) || 0,
                    status: editStatus
                });
                setEditStudentModalOpen(false);
            };

            const handleSaveProductEdit = (e) => {
                e.preventDefault();
                if (!selectedProduct) return;
                onUpdateProduct({
                    ...selectedProduct,
                    name: editProdName,
                    price: parseFloat(editProdPrice) || 0,
                    stock: parseInt(editProdStock) || 0,
                    category: editProdCategory

                setEditProductModalOpen(false);

                e.preventDefault();
                onAddNewStudent({
                    name: studName,
                    studentId: studIdNum,
                    rfidUid: studRfid || `RF-${Math.floor(1000 + Math.random() * 9000)}`,

                    balance: parseFloat(studBalance) || 0,

                e.preventDefault();

                    id: "p_" + Date.now(),
                    name: prodName,
                    category: "Meals & Mains",

                                                <tr key={item.id} className="hover:bg-slate-50">
                                                    <td className="py-3 px-3 font-bold text-slate-900">{item.name}</td>
                                                    <td className="py-3 px-3 text-slate-600">{item.category}</td>
                                                    <td className="py-3 px-3 font-outfit font-bold">₱{item.price.toFixed(2)}</td>
                                                    <td className="py-3 px-3 font-bold">{item.stock} units</td>
                                                    <td className="py-3 px-3"><StatusBadge type={item.available !== false ? 'success' : 'archived'} text={item.available !== false ? 'Available' : 'Archived'} /></td>
                                                    <td className="py-3 px-3 text-right space-x-2">
                                                        <button onClick={() => openEditProduct(item)} className="text-brand-700 hover:underline font-semibold flex items-center gap-1 inline-flex"><Icon.Edit className="w-3.5 h-3.5" /> Edit</button>
                                                        <button onClick={() => setArchiveItem({ id: item.id, name: item.name, type: 'product' })} className="text-slate-500 hover:text-rose-600 font-semibold flex items-center gap-1 inline-flex ml-2"><Icon.Archive className="w-3.5 h-3.5" /> Archive</button>
                                                    </td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                            </section>
                        )}
                    </main>

                    {/* MODAL: EDIT STUDENT */}
                    <CustomModal isOpen={editStudentModalOpen} onClose={() => setEditStudentModalOpen(false)} title="Edit Student Account" subtitle="Update account details & RFID badge UID" icon={Icon.Edit} size="md">
                        <form onSubmit={handleSaveStudentEdit} className="space-y-3">
                            <div><label className="block font-semibold mb-1">Full Name</label><input type="text" value={editName} onChange={(e) => setEditName(e.target.value)} className="w-full bg-slate-50 border rounded p-2 text-xs" /></div>
                            <div className="grid grid-cols-2 gap-2">
                                <div><label className="block font-semibold mb-1">Student ID</label><input type="text" value={editIdNum} onChange={(e) => setEditIdNum(e.target.value)} className="w-full bg-slate-50 border rounded p-2 text-xs" /></div>
                                <div><label className="block font-semibold mb-1">RFID UID</label><input type="text" value={editRfid} onChange={(e) => setEditRfid(e.target.value)} className="w-full bg-slate-50 border rounded p-2 text-xs font-mono text-brand-700 font-bold" /></div>
                            </div>
                            <div className="grid grid-cols-2 gap-2">
                                <div><label className="block font-semibold mb-1">Wallet Balance (₱)</label><input type="number" value={editBalance} onChange={(e) => setEditBalance(e.target.value)} className="w-full bg-slate-50 border rounded p-2 text-xs" /></div>
                                <div><label className="block font-semibold mb-1">Daily Cap (₱)</label><input type="number" value={editCap} onChange={(e) => setEditCap(e.target.value)} className="w-full bg-slate-50 border rounded p-2 text-xs" /></div>
                            </div>
                            <div>
                                <label className="block font-semibold mb-1">Account Status</label>
                                <select value={editStatus} onChange={(e) => setEditStatus(e.target.value)} className="w-full bg-slate-50 border rounded p-2 text-xs">
                                    <option value="active">Active (Access Granted)</option>
                                    <option value="archived">Archived (Soft Deleted)</option>
                                    <option value="suspended">Suspended (Blocked RFID)</option>
                                </select>
                            </div>
                            <div className="flex gap-2 pt-3 border-t">
                                <ActionButton variant="secondary" onClick={() => setEditStudentModalOpen(false)} className="w-1/3 py-2">Cancel</ActionButton>
                                <ActionButton variant="primary" type="submit" className="w-2/3 py-2 font-bold">Save Profile Changes</ActionButton>
                            </div>
                        </form>
                    </CustomModal>

                    {/* MODAL: EDIT MENU PRODUCT */}
                    <CustomModal isOpen={editProductModalOpen} onClose={() => setEditProductModalOpen(false)} title="Edit Menu Item" subtitle="Update menu catalog item & stock count" icon={Icon.Edit} size="md">
                        <form onSubmit={handleSaveProductEdit} className="space-y-3">
                            <div><label className="block font-semibold mb-1">Item Name</label><input type="text" value={editProdName} onChange={(e) => setEditProdName(e.target.value)} className="w-full bg-slate-50 border rounded p-2 text-xs" /></div>
                            <div className="grid grid-cols-2 gap-2">
                                <div><label className="block font-semibold mb-1">Price (₱)</label><input type="number" value={editProdPrice} onChange={(e) => setEditProdPrice(e.target.value)} className="w-full bg-slate-50 border rounded p-2 text-xs" /></div>
                                <div><label className="block font-semibold mb-1">Stock Quantity</label><input type="number" value={editProdStock} onChange={(e) => setEditProdStock(e.target.value)} className="w-full bg-slate-50 border rounded p-2 text-xs" /></div>
                            </div>
                            <div className="flex gap-2 pt-3 border-t">
                                <ActionButton variant="secondary" onClick={() => setEditProductModalOpen(false)} className="w-1/3 py-2">Cancel</ActionButton>
                                <ActionButton variant="primary" type="submit" className="w-2/3 py-2 font-bold">Update Catalog Item</ActionButton>
                            </div>
                        </form>
                    </CustomModal>

                    {/* MODAL: ADD NEW STUDENT */}
                    <CustomModal isOpen={addStudentModalOpen} onClose={() => setAddStudentModalOpen(false)} title="Enroll New Student" icon={Icon.UserPlus} size="md">
                        <form onSubmit={handleCreateStudent} className="space-y-3">
                            <div><label className="block font-semibold mb-1">Student Name</label><input type="text" required placeholder="Gabriel Santos" value={studName} onChange={(e) => setStudName(e.target.value)} className="w-full bg-slate-50 border rounded p-2 text-xs" /></div>
                            <div className="grid grid-cols-2 gap-2">
                                <div><label className="block font-semibold mb-1">Student ID</label><input type="text" required placeholder="2023-04910" value={studIdNum} onChange={(e) => setStudIdNum(e.target.value)} className="w-full bg-slate-50 border rounded p-2 text-xs" /></div>
                                <div><label className="block font-semibold mb-1">RFID UID</label><input type="text" placeholder="RF-4412" value={studRfid} onChange={(e) => setStudRfid(e.target.value)} className="w-full bg-slate-50 border rounded p-2 text-xs font-mono text-brand-700 font-bold" /></div>
                            </div>
                            <div className="flex gap-2 pt-3 border-t">
                                <ActionButton variant="secondary" onClick={() => setAddStudentModalOpen(false)} className="w-1/3 py-2">Cancel</ActionButton>
                                <ActionButton variant="gold" type="submit" className="w-2/3 py-2 font-bold">Save & Enroll Student Account</ActionButton>
                            </div>
                        </form>
                    </CustomModal>

                    {/* MODAL: ADD PRODUCT */}
                    <CustomModal isOpen={addProductModalOpen} onClose={() => setAddProductModalOpen(false)} title="Add New Menu Product" icon={Icon.Plus} size="md">
                        <form onSubmit={handleCreateProduct} className="space-y-3">
                            <div><label className="block font-semibold mb-1">Item Name</label><input type="text" required placeholder="Choco Lava Cake" value={prodName} onChange={(e) => setProdName(e.target.value)} className="w-full bg-slate-50 border rounded p-2 text-xs" /></div>
                            <div className="grid grid-cols-2 gap-2">
                                <div><label className="block font-semibold mb-1">Price (₱)</label><input type="number" required placeholder="45.00" value={prodPrice} onChange={(e) => setProdPrice(e.target.value)} className="w-full bg-slate-50 border rounded p-2 text-xs" /></div>
                                <div><label className="block font-semibold mb-1">Stock</label><input type="number" placeholder="50" value={prodStock} onChange={(e) => setProdStock(e.target.value)} className="w-full bg-slate-50 border rounded p-2 text-xs" /></div>
                            </div>
                            <div className="flex gap-2 pt-3 border-t">
                                <ActionButton variant="secondary" onClick={() => setAddProductModalOpen(false)} className="w-1/3 py-2">Cancel</ActionButton>
                                <ActionButton variant="gold" type="submit" className="w-2/3 py-2 font-bold">Save Product to Menu</ActionButton>
                            </div>
                        </form>
                    </CustomModal>

                    {/* MODAL: ARCHIVE CONFIRMATION */}
                    <CustomModal isOpen={!!archiveItem} onClose={() => setArchiveItem(null)} title="Confirm Archive Action" subtitle="Soft deletion & status update warning" icon={Icon.Archive} size="md">
                        {archiveItem && (
                            <div className="space-y-4">
                                <div className="p-4 bg-amber-50 rounded-xl border border-amber-200 text-amber-900 text-xs space-y-1">
                                    <div className="font-bold text-sm">Are you sure you want to archive this record?</div>
                                    <p>Target Item: <strong className="font-outfit text-slate-900">{archiveItem.name}</strong> ({archiveItem.type.toUpperCase()})</p>
                                    <p className="text-[11px] text-amber-700">Archived items will be hidden from POS registers but retained in database archives for audit compliance.</p>
                                </div>
                                <div className="flex gap-2 pt-2">
                                    <ActionButton variant="secondary" onClick={() => setArchiveItem(null)} className="w-1/3 py-2">Cancel</ActionButton>
                                    <ActionButton variant="primary" onClick={() => {
                                        if (archiveItem.type === 'student') onArchiveStudent(archiveItem.id);
                                        else onArchiveProduct(archiveItem.id);
                                        setArchiveItem(null);
                                    }} className="w-2/3 py-2 font-bold bg-rose-700 hover:bg-rose-800 text-white">Confirm & Archive Record</ActionButton>
                                </div>
                            </div>
                        )}
                    </CustomModal>

                    {/* MODAL: GCASH RELOAD AUDIT REVIEW */}
                    <CustomModal isOpen={gcashReviewOpen} onClose={() => setGcashReviewOpen(false)} title="GCash Top-Up Verification Queue" subtitle="Parent online transfer audit log" icon={Icon.CreditCard} size="lg">
                        <div className="space-y-4">
                            <div className="overflow-x-auto">
                                <table className="w-full text-left text-xs">
                                    <thead>
                                        <tr className="border-b text-slate-500 uppercase font-bold bg-slate-50">
                                            <th className="py-2.5 px-3">Parent Name</th>
                                            <th className="py-2.5 px-3">Student Name</th>
                                            <th className="py-2.5 px-3">GCash Ref #</th>
                                            <th className="py-2.5 px-3">Amount</th>
                                            <th className="py-2.5 px-3">Status</th>
                                            <th className="py-2.5 px-3 text-right">Actions</th>
                                        </tr>
                                    </thead>
                                    <tbody className="divide-y divide-slate-100">
                                        {gcashQueue.map(item => (
                                            <tr key={item.id} className="hover:bg-slate-50">
                                                <td className="py-3 px-3 font-bold">{item.parent}</td>
                                                <td className="py-3 px-3 text-slate-700">{item.student}</td>
                                                <td className="py-3 px-3 font-mono text-brand-700 font-bold">{item.refNo}</td>
                                                <td className="py-3 px-3 font-outfit font-bold text-emerald-700">₱{item.amount.toFixed(2)}</td>
                                                <td className="py-3 px-3"><StatusBadge type="pending" text={item.status} /></td>
                                                <td className="py-3 px-3 text-right space-x-2">
                                                    <ActionButton variant="gold" onClick={() => { onApproveGcash(item.id); setGcashReviewOpen(false); }} className="px-2.5 py-1 text-[11px] font-bold">Approve</ActionButton>
                                                </td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                            <div className="flex gap-2 pt-3 border-t">
                                <ActionButton variant="secondary" onClick={() => setGcashReviewOpen(false)} className="w-full py-2 font-bold">Close Verification Queue</ActionButton>
                            </div>
                        </div>
                    </CustomModal>
                </div>
            );
        }

        // =====================================================================
        // MASTER CONTAINER WITH SUPABASE FETCH & RICH MOCK FALLBACKS
        // =====================================================================
        function UnifiedNovaLunchApp() {
            const [activeRole, setActiveRole] = useState('LANDING');
            const [studentBalance, setStudentBalance] = useState(350.00);
            const [dailyLimit, setDailyLimit] = useState(200.00);
            const [isCloudConnected, setIsCloudConnected] = useState(false);

            const [menuCatalog, setMenuCatalog] = useState(INITIAL_MOCK_MENU);
            const [registeredUsers, setRegisteredUsers] = useState(INITIAL_USERS);
            const [gcashQueue, setGcashQueue] = useState(INITIAL_GCASH_QUEUE);
            const [posCart, setPosCart] = useState([
                { id: "p1", name: "Classic Cheeseburger", price: 75.00, qty: 1 },
                { id: "p4", name: "Mineral Water (500ml)", price: 20.00, qty: 1 }
            ]);
            const [toastMessage, setToastMessage] = useState("");

            const showToast = (msg) => setToastMessage(msg);

            const syncCloudData = useCallback(async () => {
                if (!supabaseClient) return;
                try {
                    const { data: prodsData } = await supabaseClient.from('products').select('*');
                    if (prodsData && prodsData.length > 0) {
                        setMenuCatalog(prodsData.map(p => ({
                            id: p.id,
                            name: p.name,
                            category: "Meals & Mains",
                            price: parseFloat(p.price) || 0,
                            stock: p.stock_quantity || 0,
                            available: p.is_available,
                            img: p.image_url || "https://images.unsplash.com/photo-1546069901-ba9599a7e63c?auto=format&fit=crop&w=400&q=80"
                        })));
                    }

                    const { data: profsData } = await supabaseClient.from('profiles').select('*, wallets(*)');
                    if (profsData && profsData.length > 0) {
                        setRegisteredUsers(profsData.map(u => ({
                            id: u.id,
                            studentId: u.student_id_number || "2023-0000",
                            name: u.full_name,
                            role: u.role,
                            rfidUid: u.rfid_uid || "RF-000",
                            dailyCap: u.wallets?.[0]?.daily_limit ? parseFloat(u.wallets[0].daily_limit) : 200.00,
                            balance: u.wallets?.[0]?.balance ? parseFloat(u.wallets[0].balance) : 0.00,
                            status: u.status || 'active'
                        })));
                    }
                    setIsCloudConnected(true);
                } catch (e) {
                    setIsCloudConnected(false);
                }
            }, []);

            useEffect(() => {
                syncCloudData();
            }, [syncCloudData]);

            // Pos Cart Quantity Operations
            const handleAddToCart = (item) => {
                const existing = posCart.find(i => i.id === item.id);
                if (existing) {
                    setPosCart(posCart.map(i => i.id === item.id ? { ...i, qty: i.qty + 1 } : i));
                } else {
                    setPosCart([...posCart, { id: item.id, name: item.name, price: item.price, qty: 1 }]);
                }
                showToast(`Added ${item.name} to order tally`);
            };

            const handleUpdateQty = (itemId, newQty) => {
                if (newQty <= 0) {
                    setPosCart(posCart.filter(i => i.id !== itemId));
                } else {
                    setPosCart(posCart.map(i => i.id === itemId ? { ...i, qty: newQty } : i));
                }
            };

            const handleDeleteItem = (itemId) => {
                setPosCart(posCart.filter(i => i.id !== itemId));
            };

            const handleClearCart = () => {
                setPosCart([]);
                showToast("Cleared cart tally");
            };

            // Edit & Archive Handlers
            const handleUpdateStudent = async (updatedUser) => {
                setRegisteredUsers(registeredUsers.map(u => u.id === updatedUser.id ? updatedUser : u));
                showToast(`Updated student profile for ${updatedUser.name}!`);

                if (supabaseClient) {
                    await supabaseClient.from('profiles').update({
                        full_name: updatedUser.name,
                        student_id_number: updatedUser.studentId,
                        rfid_uid: updatedUser.rfidUid,
                        status: updatedUser.status
                    }).eq('id', updatedUser.id);
                }
            };

            const handleArchiveStudent = async (userId) => {
                setRegisteredUsers(registeredUsers.map(u => u.id === userId ? { ...u, status: 'archived' } : u));
                showToast(`Archived student account`);

                if (supabaseClient) {
                    await supabaseClient.from('profiles').update({ status: 'archived' }).eq('id', userId);
                }
            };

            const handleUpdateProduct = async (updatedProd) => {
                setMenuCatalog(menuCatalog.map(p => p.id === updatedProd.id ? updatedProd : p));
                showToast(`Updated menu item ${updatedProd.name}!`);

                if (supabaseClient) {
                    await supabaseClient.from('products').update({
                        name: updatedProd.name,
                        price: updatedProd.price,
                        stock_quantity: updatedProd.stock
                    }).eq('id', updatedProd.id);
                }
            };

            const handleArchiveProduct = async (prodId) => {
                setMenuCatalog(menuCatalog.map(p => p.id === prodId ? { ...p, available: false } : p));
                showToast(`Archived menu product`);

                if (supabaseClient) {
                    await supabaseClient.from('products').update({ is_available: false }).eq('id', prodId);
                }
            };

            const posTotal = posCart.reduce((sum, i) => sum + (i.price * i.qty), 0);

            return (
                <React.Fragment>
                    <ToastNotification message={toastMessage} onClose={() => setToastMessage("")} />

                    {activeRole === 'LANDING' && <LoginView onSelectRoleQuick={(role) => setActiveRole(role)} />}

                    {activeRole === 'STUDENT' && (
                        <StudentView
                            studentBalance={studentBalance}
                            dailyLimit={dailyLimit}
                            menuCatalog={menuCatalog}
                            onAddPreOrder={(item) => showToast(`Pre-ordered ${item.name}!`)}
                            onClaimClick={() => alert("Claim Token QR generated")}
                            onSignOut={() => setActiveRole('LANDING')}
                            onBackToRoleSelect={() => setActiveRole('LANDING')}
                            isCloudConnected={isCloudConnected}
                            onRefreshCloud={syncCloudData}
                        />
                    )}

                    {activeRole === 'PARENT' && (
                        <ParentView
                            studentBalance={studentBalance}
                            dailyLimit={dailyLimit}
                            onUpdateDailyLimit={(l) => { setDailyLimit(l); showToast("Updated daily limit"); }}
                            onUploadReceipt={(amt) => showToast(`Uploaded ₱${amt} GCash receipt!`)}
                            onSignOut={() => setActiveRole('LANDING')}
                            onBackToRoleSelect={() => setActiveRole('LANDING')}
                            isCloudConnected={isCloudConnected}
                            onRefreshCloud={syncCloudData}
                        />
                    )}

                    {activeRole === 'CASHIER' && (
                        <CashierView
                            posCart={posCart}
                            posTotal={posTotal}
                            menuCatalog={menuCatalog}
                            registeredUsers={registeredUsers}
                            onAddToCart={handleAddToCart}
                            onUpdateQty={handleUpdateQty}
                            onDeleteItem={handleDeleteItem}
                            onClearCart={handleClearCart}
                            onCompleteCheckout={() => { setPosCart([]); showToast("Completed POS Order!"); }}
                            onSignOut={() => setActiveRole('LANDING')}
                            onBackToRoleSelect={() => setActiveRole('LANDING')}
                            isCloudConnected={isCloudConnected}
                            onRefreshCloud={syncCloudData}
                        />
                    )}

                    {activeRole === 'ADMIN' && (
                        <AdminView
                            gcashQueue={gcashQueue}
                            menuCatalog={menuCatalog}
                            registeredUsers={registeredUsers}
                            onApproveTopup={(i) => showToast(`Approved top-up for ${i.student}`)}
                            onRejectTopup={(i) => showToast("Rejected top-up")}
                            onAddProduct={(p) => setMenuCatalog([p, ...menuCatalog])}
                            onUpdateProduct={handleUpdateProduct}
                            onArchiveProduct={handleArchiveProduct}
                            onAddNewStudent={(s) => setRegisteredUsers([s, ...registeredUsers])}
                            onUpdateStudent={handleUpdateStudent}
                            onArchiveStudent={handleArchiveStudent}
                            onSignOut={() => setActiveRole('LANDING')}
                            onBackToRoleSelect={() => setActiveRole('LANDING')}
                            isCloudConnected={isCloudConnected}
                            onRefreshCloud={syncCloudData}
                        />
                    )}
                </React.Fragment>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<UnifiedNovaLunchApp />);
    </script>
</body>
</html>
