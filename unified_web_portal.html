                        const dbGcash = await window.CanteenDB.getGcashQueue();
                        if (dbGcash && dbGcash.length > 0) {
                            setGcashQueue(dbGcash.map(g => ({
                                id: g.id,
                                parent: g.parent_name || g.parent || 'Maria Santos',
                                student: g.student_name || g.student || 'Juan Dela Cruz (2023-01900)',
                                studentId: g.student_id || 'u101',
                                amount: parseFloat(g.amount) || 0,
                                date: g.date || new Date().toLocaleString(),
                                refNo: g.ref_no || g.refNo,
                                status: g.status || 'Pending',
                                receiptImg: g.receipt_img || g.receiptImg || 'https://images.unsplash.com/photo-1554224155-8d04cb21cd6c?w=600&auto=format&fit=crop'
                            })));
                        }
                    } catch(e) {}

                    // Flush offline POS orders queue if present
                    try {
                        const rawOffline = localStorage.getItem('novalunch_offline_orders');
                        if (rawOffline) {
                            const offlineList = JSON.parse(rawOffline);
                            if (Array.isArray(offlineList) && offlineList.length > 0) {
                                const remainingQueue = [];
                                for (const order of offlineList) {
                                    try {
                                        const matchedStud = registeredUsers.find(u => u.studentId === order.studentId || u.name === order.student);
                                        await window.CanteenDB.createOrder({
                                            order_number: order.orderNo,
                                            user_id: matchedStud ? matchedStud.id : null,
                                            cashier_id: null,
                                            total_amount: order.total,
                                            discount_amount: 0,
                                            final_amount: order.total,
                                            payment_method: (order.paymentMethod || 'cash').toLowerCase(),
                                            order_source: 'pos_cashier',
                                            items: (order.items || []).map(i => ({
                                                product_id: i.id,
                                                product_name: i.name,
                                                unit_price: i.price,
                                                quantity: i.qty
                                            }))
                                        });
                                    } catch(err) {
                                        remainingQueue.push(order);
                                    }
                                }
                                if (remainingQueue.length === 0) {
                                    localStorage.removeItem('novalunch_offline_orders');
                                    showToast(`Synced ${offlineList.length} offline POS order(s) to Cloud DB!`);
                                } else {
                                    localStorage.setItem('novalunch_offline_orders', JSON.stringify(remainingQueue));
                                }
                            }
                        }
                    } catch(e) {}
                }

                setIsCloudConnected(connected);
            }, [registeredUsers]);

            useEffect(() => {
                syncCloudData();
            }, [syncCloudData]);

            // Quick Role Switcher
            const handleSelectRoleQuick = (role, userIdentifier = null) => {
                if (role === 'STUDENT') {
                    setActiveTab('menu');
                    let stud = null;
                    if (userIdentifier) {
                        const targetStr = userIdentifier.toLowerCase();
                        stud = registeredUsers.find(u => 
                            u.role.toLowerCase() === 'student' && (
                                (u.email && u.email.toLowerCase() === targetStr) || 
                                (u.studentId && u.studentId.toLowerCase() === targetStr) ||
                                (u.id === userIdentifier)
                            )
                        );
                    }
                    if (!stud) {
                        stud = registeredUsers.find(u => u.role.toLowerCase() === 'student') || registeredUsers[0];
                    }
                    if (stud) {
                        setCurrentStudent(stud);
                        setStudentBalance(typeof stud.balance === 'number' ? stud.balance : 350);
                        setDailyLimit(typeof stud.dailyCap === 'number' ? stud.dailyCap : 200);
                    }
                } else if (role === 'PARENT') {
                    setActiveTab('family');
                    const prnt = registeredUsers.find(u => u.role.toLowerCase() === 'parent');
                    const child = registeredUsers.find(u => u.role.toLowerCase() === 'student') || registeredUsers[0];
                    if (prnt) setCurrentParent(prnt);
                    if (child) {
                        setCurrentStudent(child);
                        setStudentBalance(child.balance);
                        setDailyLimit(child.dailyCap);
                    }
                } else if (role === 'CASHIER') {
                    setActiveTab('register');
                } else if (role === 'ADMIN') {
                    setActiveTab('command');
                }
                setActiveRole(role);
            };

            // Pos Cart Quantity Operations
            const handleAddToCart = (item) => {
                const existing = posCart.find(i => i.id === item.id);
                if (existing) {
                    setPosCart(posCart.map(i => i.id === item.id ? { ...i, qty: i.qty + 1 } : i));
                } else {
                    setPosCart([...posCart, { id: item.id, name: item.name, price: item.price, qty: 1 }]);
                }
                showToast(`Added ${item.name} to order tally`);
            };

            const handleUpdateQty = (itemId, newQty) => {
                if (newQty <= 0) {
                    setPosCart(posCart.filter(i => i.id !== itemId));
                } else {
                    setPosCart(posCart.map(i => i.id === itemId ? { ...i, qty: newQty } : i));
                }
            };

            const handleDeleteItem = (itemId) => {
                setPosCart(posCart.filter(i => i.id !== itemId));
            };

            const handleClearCart = () => {
                setPosCart([]);
                showToast("Cleared cart tally");
            };

            // GCash Custom Modal States
            const [duplicateRefModalData, setDuplicateRefModalData] = useState(null);
            const [claimTokenModalData, setClaimTokenModalData] = useState(null);

            // POS Claim Token Fulfillment Handler (Prevents Double Balance Deduction)
            const handleClaimPreorderPos = (tokenString) => {
                const cleanToken = (tokenString || '').trim().toUpperCase();
                if (!cleanToken) {
                    showToast("⚠️ Enter or scan a valid Claim Token!", "danger");
                    return false;
                }

                const targetPo = preorders.find(p => (p.token && p.token.toUpperCase() === cleanToken) && p.status !== 'Claimed');
                if (!targetPo) {
                    showToast(`⚠️ No pending pre-order found for Claim Token "${cleanToken}"!`, "danger");
                    return false;
                }

                // Mark pre-order as claimed in state & cloud DB
                setPreorders(preorders.map(p => p.token && p.token.toUpperCase() === cleanToken ? { ...p, status: 'Claimed' } : p));
                if (window.CanteenDB && targetPo.id) {
                    window.CanteenDB.updatePreorderStatus(targetPo.id, 'Claimed').catch(e => console.warn(e));
                }

                // Add to Shift Recent Orders as PRE_PAID POS transaction (NO balance deduction)
                const prePaidOrder = {
                    orderNo: `CLAIM-${Math.floor(1000 + Math.random() * 9000)}`,
                    date: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
                    created_at: new Date().toISOString(),
                    student: currentStudent ? currentStudent.name : "Juan Dela Cruz",
                    studentId: currentStudent ? currentStudent.studentId : "2023-01900",
                    items: [{ name: targetPo.name, price: targetPo.price, qty: 1 }],
                    total: targetPo.price,
                    paymentMethod: 'PRE_PAID (QR Claim Pass)',
                    cashier: 'Express POS Register #01'
                };
                setRecentOrders([prePaidOrder, ...recentOrders]);
                showToast(`🎉 Claim Token ${cleanToken} verified! Handed over ${targetPo.name} (PRE-PAID, ₱0.00 balance deduction at POS).`);
                return true;
            };

            // Student RFID Security PIN Update Handler
            const handleUpdateStudentPin = async (userId, newPin) => {
                setRegisteredUsers(registeredUsers.map(u => u.id === userId ? { ...u, pinCode: newPin } : u));
                if (currentStudent && currentStudent.id === userId) {
                    setCurrentStudent({ ...currentStudent, pinCode: newPin });
                }
                if (window.CanteenDB) {
                    await window.CanteenDB.updateStudentPin(userId, newPin).catch(e => console.warn(e));
                }
                showToast("🔒 RFID Authorization PIN updated successfully!");
            };

            // GCash Reload Submission & Verification Handlers
            const handleUploadReceipt = (uploadObj) => {
                const cleanRef = (uploadObj.refNo || '').trim();
                if (!cleanRef) {
                    showToast("⚠️ Error: GCash Reference Number is required!", "danger");
                    return false;
                }

                // Duplicate Reference Number Check with Custom Modal
                const isDuplicate = gcashQueue.some(q => q.refNo && q.refNo.trim().toLowerCase() === cleanRef.toLowerCase());
                if (isDuplicate) {
                    setDuplicateRefModalData({ refNo: cleanRef, date: new Date().toLocaleString() });
                    return false;
                }

                const targetStudentId = uploadObj.studentId || (currentStudent ? currentStudent.id : "u101");
                const targetStudentObj = registeredUsers.find(u => u.id === targetStudentId || u.studentId === uploadObj.studentIdNumber) || currentStudent || { name: uploadObj.studentName || "Juan Dela Cruz", studentId: "2023-01900" };

                const newReq = {
                    id: "top_" + Date.now(),
                    parent: activeRole === 'PARENT' ? (currentParent ? currentParent.name : "Maria Santos") : (currentStudent ? currentStudent.name : (uploadObj.studentName || "Juan Dela Cruz")),
                    student: `${targetStudentObj.name} (${targetStudentObj.studentId || "2023-01900"})`,
                    studentId: targetStudentObj.id || "u101",
                    amount: uploadObj.amount,
                    date: new Date().toLocaleString(),
                    refNo: cleanRef,
                    status: "Pending",
                    receiptImg: uploadObj.receiptImg || "https://images.unsplash.com/photo-1554224155-8d04cb21cd6c?w=600&auto=format&fit=crop",
                    submitterRole: activeRole,
                    submitterName: activeRole === 'PARENT' ? (currentParent?.name || "Maria Santos") : (currentStudent?.name || "Juan Dela Cruz")
                };

                setGcashQueue([newReq, ...gcashQueue]);
                setReloadLogs([
                    { id: newReq.id, date: new Date().toLocaleDateString(), amount: uploadObj.amount, ref: cleanRef, status: "Pending" },
                    ...reloadLogs
                ]);

                // Cloud Persistence via CanteenDB
                if (window.CanteenDB) {
                    window.CanteenDB.submitGcashReload({
                        id: newReq.id,
                        parent_name: newReq.parent,
                        student_name: targetStudentObj.name,
                        student_id: targetStudentObj.id,
                        amount: uploadObj.amount,
                        date: newReq.date,
                        ref_no: cleanRef,
                        status: "Pending",
                        receipt_img: newReq.receiptImg,
                        submitter_role: activeRole
                    }).catch(err => console.warn("Cloud top-up sync warning:", err));
                }

                showToast(`Submitted GCash reload for ₱${uploadObj.amount.toFixed(2)} to Admin Queue!`);
                return true;
            };

            const handleApproveTopup = (queueItem, adminNote = "Verified by Canteen Admin") => {
                setGcashQueue(gcashQueue.map(q => q.id === queueItem.id ? { ...q, status: 'Approved', adminNote, reviewedAt: new Date().toLocaleString() } : q));
                setReloadLogs(reloadLogs.map(r => r.id === queueItem.id ? { ...r, status: 'Approved' } : r));
                
                if (window.CanteenDB && queueItem.id) {
                    window.CanteenDB.updateGcashReloadStatus(queueItem.id, 'Approved', adminNote).catch(e => console.warn(e));
                }

                // Balance Update in Registered Users
                setRegisteredUsers(registeredUsers.map(u => {
                    if (u.id === queueItem.studentId || u.studentId === queueItem.studentIdNumber || (u.name && queueItem.student.includes(u.name))) {
                        return { ...u, balance: (u.balance || 0) + queueItem.amount };
                    }
                    return u;
                }));

                if (currentStudent && (currentStudent.id === queueItem.studentId || queueItem.student.includes(currentStudent.name))) {
                    setStudentBalance(prev => prev + queueItem.amount);
                }

                // Cloud Supabase sync
                if (supabaseClient && queueItem.studentId) {
                    supabaseClient.from('profiles').select('balance').eq('id', queueItem.studentId).single()
                        .then(({ data }) => {
                            if (data) {
                                supabaseClient.from('profiles').update({ balance: (data.balance || 0) + queueItem.amount }).eq('id', queueItem.studentId);
                            }
                        }).catch(e => console.warn("Supabase balance update error", e));
                }

                // Dispatch In-App Notification
                const newNotif = {
                    id: 'notif_' + Date.now(),
                    title: 'GCash Top-Up Approved! 💳',
                    message: `Your GCash reload of ₱${queueItem.amount.toFixed(2)} (Ref: ${queueItem.refNo}) has been approved and credited to RFID balance.`,
                    timestamp: 'Just now',
                    read: false,
                    type: 'financial'
                };
                setNotifications(prev => [newNotif, ...prev]);

                showToast(`Approved ₱${queueItem.amount.toFixed(2)} top-up for ${queueItem.student}!`);
            };

            const handleRejectTopup = (queueItem, rejectionReason = "Information mismatch") => {
                setGcashQueue(gcashQueue.map(q => q.id === queueItem.id ? { ...q, status: 'Rejected', rejectionReason, reviewedAt: new Date().toLocaleString() } : q));
                setReloadLogs(reloadLogs.map(r => r.id === queueItem.id ? { ...r, status: 'Rejected' } : r));

                if (window.CanteenDB && queueItem.id) {
                    window.CanteenDB.updateGcashReloadStatus(queueItem.id, 'Rejected', rejectionReason).catch(e => console.warn(e));
                }

                // Dispatch In-App Notification
                const newNotif = {
                    id: 'notif_' + Date.now(),
                    title: 'GCash Top-Up Rejected ❌',
                    message: `GCash reload of ₱${queueItem.amount.toFixed(2)} (Ref: ${queueItem.refNo}) was rejected. Reason: ${rejectionReason}`,
                    timestamp: 'Just now',
                    read: false,
                    type: 'warning'
                };
                setNotifications(prev => [newNotif, ...prev]);

                showToast(`Rejected top-up submission ${queueItem.refNo}`, "warning");
            };

            // Edit & Archive Handlers
            const handleUpdateStudent = async (updatedUser) => {
                setRegisteredUsers(prev => prev.map(u => u.id === updatedUser.id ? { ...u, ...updatedUser } : u));
                if (currentStudent && currentStudent.id === updatedUser.id) {
                    setCurrentStudent(prev => ({ ...prev, ...updatedUser }));
                    if (updatedUser.balance !== undefined) setStudentBalance(updatedUser.balance);
                    if (updatedUser.dailyCap !== undefined) setDailyLimit(updatedUser.dailyCap);
                }
                showToast(`Updated profile for ${updatedUser.name}!`);

                if (window.CanteenDB) {
                    await window.CanteenDB.updateUser(updatedUser.id, {
                        full_name: updatedUser.name,
                        student_id_number: updatedUser.studentId,
                        rfid_uid: updatedUser.rfidUid,
                        status: updatedUser.status,
                        balance: updatedUser.balance,
                        daily_limit: updatedUser.dailyCap,
                        credit_liability: updatedUser.creditLiability
                    }).catch(e => console.warn("User update cloud sync warning:", e));
                }
            };

            const handleArchiveStudent = async (userId) => {
                setRegisteredUsers(prev => prev.map(u => u.id === userId ? { ...u, status: 'archived' } : u));
                showToast(`Archived account`);

                if (window.CanteenDB) {
                    await window.CanteenDB.archiveUser(userId).catch(e => console.warn(e));
                }
            };

            const handleSettleDebt = async (studentId, amountPaid, paymentMethod = 'cash') => {
                const targetUser = registeredUsers.find(u => u.id === studentId || u.studentId === studentId);
                if (!targetUser) {
                    alert("Student not found for tab settlement.");
                    return false;
                }
                
                const currentLiability = targetUser.creditLiability || 0;
                const cleanPaid = Math.min(currentLiability, parseFloat(amountPaid) || 0);
                if (cleanPaid <= 0) {
                    alert("Please enter a valid positive repayment amount.");
                    return false;
                }

                let newBal = targetUser.balance || 0;
                if (paymentMethod === 'rfid') {
                    if (newBal < cleanPaid) {
                        alert(`Insufficient RFID balance! Available: ₱${newBal.toFixed(2)}, Repayment: ₱${cleanPaid.toFixed(2)}`);
                        return false;
                    }
                    newBal = newBal - cleanPaid;
                }

                const newLiability = Math.max(0, currentLiability - cleanPaid);

                setRegisteredUsers(prevUsers => prevUsers.map(u => {
                    if (u.id === targetUser.id) {
                        return { ...u, creditLiability: newLiability, balance: newBal };
                    }
                    return u;
                }));

                if (currentStudent && currentStudent.id === targetUser.id) {
                    setStudentBalance(newBal);
                    setCurrentStudent(prev => ({ ...prev, creditLiability: newLiability, balance: newBal }));
                }

                // Cloud sync
                if (window.CanteenDB) {
                    window.CanteenDB.settleStudentDebt(targetUser.id, cleanPaid, paymentMethod).catch(e => console.warn(e));
                }

                // Add in-app notification
                const newNotif = {
                    id: 'notif_' + Date.now(),
                    title: 'Pay Later Tab Settled! 🤝',
                    message: `Cleared ₱${cleanPaid.toFixed(2)} Pay Later credit debt via ${paymentMethod.toUpperCase()}. Remaining Tab Balance: ₱${newLiability.toFixed(2)}.`,
                    timestamp: 'Just now',
                    read: false,
                    type: 'financial'
                };
                setNotifications(prev => [newNotif, ...prev]);
                showToast(`Settled ₱${cleanPaid.toFixed(2)} tab debt for ${targetUser.name}!`);
                return { success: true, remainingLiability: newLiability };
            };

            const handleUpdateProduct = async (updatedProd) => {
                setMenuCatalog(menuCatalog.map(p => p.id === updatedProd.id ? updatedProd : p));
                showToast(`Updated menu item ${updatedProd.name}!`);

                if (window.CanteenDB && updatedProd.id) {
                    await window.CanteenDB.updateProduct(updatedProd.id, {
                        name: updatedProd.name,
                        category: updatedProd.category,
                        price: updatedProd.price,
                        stock_quantity: updatedProd.stock,
                        is_available: updatedProd.available !== false,
                        image_url: updatedProd.img,
                        allergens: updatedProd.allergens || []
                    }).catch(err => console.warn("Cloud product update warning", err));
                } else if (supabaseClient && updatedProd.id) {
                    await supabaseClient.from('products').update({
                        name: updatedProd.name,
                        category: updatedProd.category,
                        price: updatedProd.price,
                        stock_quantity: updatedProd.stock,
                        is_available: updatedProd.available !== false,
                        image_url: updatedProd.img
                    }).eq('id', updatedProd.id).catch(err => console.warn("Supabase direct update warning", err));
                }
            };

            const handleArchiveProduct = async (prodId) => {
                setMenuCatalog(menuCatalog.map(p => p.id === prodId ? { ...p, available: false } : p));
                showToast(`Archived menu product`);

                if (supabaseClient) {
                    await supabaseClient.from('products').update({ is_available: false }).eq('id', prodId);
                }
            };

            const posTotal = posCart.reduce((sum, i) => sum + (i.price * i.qty), 0);

            const getCurrentUser = () => {
                if (activeRole === 'STUDENT') return currentStudent || { name: "Juan Dela Cruz", studentId: "2023-01900" };
                if (activeRole === 'PARENT') return currentParent || { name: "Maria Santos", studentId: "Parent Guardian" };
                if (activeRole === 'CASHIER') return { name: "Elena R.", studentId: "Cashier Reg #01" };
                if (activeRole === 'ADMIN') return { name: "System Admin", studentId: "SJC Admin ID" };
                return null;
            };

            return (
                <React.Fragment>
                    <ToastNotification message={toastMessage} onClose={() => setToastMessage("")} />

                    {activeRole === 'LOGIN' ? (
                        <LoginView 
                            onSelectRoleQuick={(role) => handleSelectRoleQuick(role)} 
                            onRegisterUser={handleRegisterUser} 
                            registeredUsers={registeredUsers} 
                        />
                    ) : (
                        <React.Fragment>
                            {/* UNIFIED LEFT NAVIGATION SIDEBAR */}
                            <AppLeftSidebar
                                activeRole={activeRole}
                                activeTab={activeTab}
                                setActiveTab={setActiveTab}
                                onSignOut={() => setActiveRole('LOGIN')}
                                onSelectRoleQuick={handleSelectRoleQuick}
                                isCloudConnected={isCloudConnected}
                                onRefreshCloud={syncCloudData}
                                currentUser={getCurrentUser()}
                            />

                            {activeRole === 'STUDENT' && (
                                <StudentView
                                    studentBalance={studentBalance}
                                    dailyLimit={dailyLimit}
                                    currentStudent={currentStudent}
                                    menuCatalog={menuCatalog}
                                    preorders={preorders}
                                    recentOrders={recentOrders}
                                    reloadLogs={reloadLogs}
                                    onUploadReceipt={handleUploadReceipt}
                                    onUpdatePin={handleUpdateStudentPin}
                                    onAddPreOrder={async (item) => {
                                        // 1. Stock availability validation guardrail
                                        const matchedProd = menuCatalog.find(p => p.id === item.id || p.name === item.name);
                                        if (matchedProd && matchedProd.stock <= 0) {
                                            showToast(`⚠️ Sorry, ${item.name} is currently Sold Out and cannot be pre-ordered!`, "danger");
                                            return;
                                        }

                                        const tokenStr = `QR-2026-${Math.floor(1000 + Math.random() * 9000)}`;
                                        const preorderRecord = {
                                            student_id: currentStudent ? currentStudent.id : 'u101',
                                            item_name: item.name,
                                            price: item.price,
                                            token: tokenStr,
                                            status: 'Pending',
                                            created_at: new Date().toISOString()
                                        };
                                        const newPoObj = { id: 'po_' + Date.now(), name: item.name, price: item.price, token: tokenStr, status: 'Pending', studentId: currentStudent?.id };
                                        setPreorders([newPoObj, ...preorders]);
                                        
                                        // 2. Balance deduction
                                        const updatedBal = Math.max(0, (studentBalance || 0) - item.price);
                                        setStudentBalance(updatedBal);
                                        setRegisteredUsers(prev => prev.map(u => (u.id === currentStudent?.id || u.studentId === currentStudent?.studentId) ? { ...u, balance: updatedBal } : u));
                                        
                                        // 3. Reserve product stock & FIFO batch stock immediately
                                        if (matchedProd) {
                                            const newStock = Math.max(0, matchedProd.stock - 1);
                                            setMenuCatalog(prev => prev.map(p => p.id === matchedProd.id ? { ...p, stock: newStock } : p));
                                            if (window.CanteenDB && matchedProd.id) {
                                                window.CanteenDB.deductStockFifo(matchedProd.id, 1).catch(e => console.warn("FIFO pre-order stock sync warning", e));
                                            }
                                            setInventoryBatches(prevBatches => {
                                                let qtyRemainingToDeduct = 1;
                                                return prevBatches.map(b => {
                                                    const isMatch = b.product_id === matchedProd.id || b.product_name === matchedProd.name;
                                                    if (isMatch && qtyRemainingToDeduct > 0 && b.quantity_remaining > 0) {
                                                        const d = Math.min(b.quantity_remaining, qtyRemainingToDeduct);
                                                        qtyRemainingToDeduct -= d;
                                                        const newRem = b.quantity_remaining - d;
                                                        return { ...b, quantity_remaining: newRem, status: newRem === 0 ? 'DEPLETED' : b.status };
                                                    }
                                                    return b;
                                                });
                                            });
                                        }

                                        if (window.CanteenDB) {
                                            await window.CanteenDB.createPreorder(preorderRecord).catch(e => console.warn(e));
                                            if (currentStudent?.id) {
                                                await window.CanteenDB.updateStudentBalance(currentStudent.id, updatedBal).catch(e => console.warn("Balance DB update error", e));
                                            }
                                        }
                                        showToast(`Pre-ordered ${item.name}! Claim pass issued: ${tokenStr}`);
                                    }}
                                    onClaimClick={(item) => setClaimTokenModalData({
                                        item: item || { name: "Pre-Order Meal Tray", price: 120.00 },
                                        token: item?.token || `QR-2026-${Math.floor(1000 + Math.random() * 9000)}`,
                                        studentName: currentStudent ? currentStudent.name : "Juan Dela Cruz",
                                        studentId: currentStudent ? currentStudent.studentId : "2023-01900",
                                        date: new Date().toLocaleDateString()
                                    })}
                                    activeTab={activeTab}
                                    setActiveTab={setActiveTab}
                                    onSignOut={() => setActiveRole('LOGIN')}
                                    onBackToRoleSelect={() => setActiveRole('LOGIN')}
                                    isCloudConnected={isCloudConnected}
                                    onRefreshCloud={syncCloudData}
                                    notifications={notifications}
                                    onMarkNotifRead={handleMarkNotificationRead}
                                    onMarkAllNotifRead={handleMarkAllNotificationsRead}
                                    parentStudentLinkRequests={parentStudentLinkRequests}
                                    onRespondLinkRequest={handleRespondLinkRequest}
                                />
                            )}

                            {activeRole === 'PARENT' && (
                                <ParentView
                                    studentBalance={studentBalance}
                                    dailyLimit={dailyLimit}
                                    currentParent={currentParent}
                                    currentStudent={currentStudent}
                                    recentOrders={recentOrders}
                                    reloadLogs={reloadLogs}
                                    onUpdateDailyLimit={(l) => {
                                        const cleanLimit = Math.max(0, parseFloat(l) || 0);
                                        setDailyLimit(cleanLimit);
                                        if (currentStudent) {
                                            const targetId = currentStudent.id;
                                            setRegisteredUsers(prev => prev.map(u => u.id === targetId ? { ...u, dailyCap: cleanLimit, daily_limit: cleanLimit } : u));
                                            setCurrentStudent(prev => prev ? { ...prev, dailyCap: cleanLimit, daily_limit: cleanLimit } : prev);
                                            if (window.CanteenDB && targetId) {
                                                window.CanteenDB.updateUserDailyLimit(targetId, cleanLimit).catch(e => console.warn(e));
                                            }
                                        }
                                        showToast(`Updated daily spending cap to ₱${cleanLimit.toFixed(2)}!`);
                                    }}
                                    onUploadReceipt={handleUploadReceipt}
                                    activeTab={activeTab}
                                    setActiveTab={setActiveTab}
                                    onSignOut={() => setActiveRole('LOGIN')}
                                    onBackToRoleSelect={() => setActiveRole('LOGIN')}
                                    isCloudConnected={isCloudConnected}
                                    onRefreshCloud={syncCloudData}
                                    notifications={notifications}
                                    onMarkNotifRead={handleMarkNotificationRead}
                                    onMarkAllNotifRead={handleMarkAllNotificationsRead}
                                    parentStudentLinkRequests={parentStudentLinkRequests}
                                    onSendLinkRequest={handleSendParentLinkRequest}
                                    onSettleDebt={handleSettleDebt}
                                />
                            )}

                            {activeRole === 'CASHIER' && (
                                <CashierView
                                    posCart={posCart}
                                    posTotal={posTotal}
                                    menuCatalog={menuCatalog}
                                    registeredUsers={registeredUsers}
                                    recentOrders={recentOrders}
                                    preorders={preorders}
                                    onClaimPreorderPos={handleClaimPreorderPos}
                                    onAddToCart={handleAddToCart}
                                    onUpdateQty={handleUpdateQty}
                                    onDeleteItem={handleDeleteItem}
                                    onClearCart={handleClearCart}
                                    onSettleDebt={handleSettleDebt}
                                    onVoidOrder={async (orderToVoid) => {
                                        // 1. Revert item stock in menuCatalog
                                        setMenuCatalog(prevCatalog => prevCatalog.map(item => {
                                            const cartMatch = (orderToVoid.items || []).find(i => i.id === item.id || i.name === item.name);
                                            if (cartMatch) {
                                                return { ...item, stock: item.stock + cartMatch.qty };
                                            }
                                            return item;
                                        }));

                                        // 2. Refund student's RFID wallet balance or reverse Pay Later liability in state & DB
                                        if (orderToVoid.paymentMethod === 'RFID') {
                                            const matchedStud = registeredUsers.find(u => u.rfidUid === orderToVoid.rfidUid || u.name === orderToVoid.student || u.studentId === orderToVoid.studentId);
                                            if (matchedStud) {
                                                const refundedBal = matchedStud.balance + orderToVoid.total;
                                                setRegisteredUsers(prevUsers => prevUsers.map(user => user.id === matchedStud.id ? { ...user, balance: refundedBal } : user));
                                                if (currentStudent && currentStudent.id === matchedStud.id) {
                                                    setStudentBalance(refundedBal);
                                                }
                                                if (window.CanteenDB && matchedStud.id) {
                                                    await window.CanteenDB.updateStudentBalance(matchedStud.id, refundedBal).catch(e => console.warn("Cloud DB wallet refund error", e));
                                                }
                                            }
                                        } else if (orderToVoid.paymentMethod === 'PAY_LATER') {
                                            const matchedStud = registeredUsers.find(u => u.rfidUid === orderToVoid.rfidUid || u.name === orderToVoid.student || u.studentId === orderToVoid.studentId);
                                            if (matchedStud) {
                                                const reducedLiability = Math.max(0, (matchedStud.creditLiability || 0.0) - orderToVoid.total);
                                                setRegisteredUsers(prevUsers => prevUsers.map(user => user.id === matchedStud.id ? { ...user, creditLiability: reducedLiability } : user));
                                                if (currentStudent && currentStudent.id === matchedStud.id) {
                                                    setCurrentStudent(prev => ({ ...prev, creditLiability: reducedLiability }));
                                                }
                                                if (window.CanteenDB && matchedStud.id) {
                                                    await window.CanteenDB.updateStudentCreditLiability(matchedStud.id, reducedLiability).catch(e => console.warn("Cloud DB liability reversal error", e));
                                                }
                                            }
                                        }

                                        // 3. Mark order as VOIDED in recentOrders & Cloud DB
                                        setRecentOrders(prev => prev.map(o => o.orderNo === orderToVoid.orderNo ? { ...o, status: 'VOIDED' } : o));
                                        if (window.CanteenDB && (orderToVoid.id || orderToVoid.orderNo)) {
                                            window.CanteenDB.updateOrderStatus(orderToVoid.id || orderToVoid.orderNo, 'VOIDED').catch(e => console.warn("Cloud DB void status error", e));
                                        }
                                        showToast(`Voided order ${orderToVoid.orderNo} (₱${orderToVoid.total.toFixed(2)}). Stock restored & credit liability reversed.`);
                                    }}
                                    onCompleteCheckout={async (order) => { 
                                        // 1. Deduct product stock quantity in menuCatalog
                                        setMenuCatalog(prevCatalog => prevCatalog.map(item => {
                                            const cartMatch = order.items.find(i => i.id === item.id || i.name === item.name);
                                            if (cartMatch) {
                                                const newStock = Math.max(0, item.stock - cartMatch.qty);
                                                if (window.CanteenDB && item.id) {
                                                    window.CanteenDB.deductStockFifo(item.id, cartMatch.qty).catch(err => console.warn("FIFO sync warning", err));
                                                }
                                                // Decrement local inventory batch stock via FIFO
                                                setInventoryBatches(prevBatches => {
                                                    let qtyRemainingToDeduct = cartMatch.qty;
                                                    return prevBatches.map(b => {
                                                        const isMatch = b.product_id === item.id || b.product_name === item.name;
                                                        if (isMatch && qtyRemainingToDeduct > 0 && b.quantity_remaining > 0) {
                                                            const d = Math.min(b.quantity_remaining, qtyRemainingToDeduct);
                                                            qtyRemainingToDeduct -= d;
                                                            const newRem = b.quantity_remaining - d;
                                                            return { ...b, quantity_remaining: newRem, status: newRem === 0 ? 'DEPLETED' : b.status };
                                                        }
                                                        return b;
                                                    });
                                                });
                                                return { ...item, stock: newStock };
                                            }
                                            return item;
                                        }));

                                        // 2. Deduct scanned student's wallet balance if RFID payment OR accrue liability if PAY_LATER
                                        if (order.paymentMethod === 'RFID') {
                                            const matchedStud = registeredUsers.find(u => u.rfidUid === order.rfidUid || u.name === order.student || u.studentId === order.studentId);
                                            if (matchedStud) {
                                                const newBal = Math.max(0, matchedStud.balance - order.total);
                                                setRegisteredUsers(prevUsers => prevUsers.map(user => {
                                                    if (user.id === matchedStud.id) {
                                                        if (currentStudent && currentStudent.id === user.id) {
                                                            setStudentBalance(newBal);
                                                        }
                                                        return { ...user, balance: newBal };
                                                    }
                                                    return user;
                                                }));

                                                if (window.CanteenDB && matchedStud.id) {
                                                    await window.CanteenDB.updateStudentBalance(matchedStud.id, newBal).catch(err => console.warn("Cloud DB wallet update error", err));
                                                }
                                            }
                                        } else if (order.paymentMethod === 'PAY_LATER') {
                                            const matchedStud = registeredUsers.find(u => u.rfidUid === order.rfidUid || u.name === order.student || u.studentId === order.studentId);
                                            if (matchedStud) {
                                                const newLiability = (matchedStud.creditLiability || 0.0) + order.total;
                                                setRegisteredUsers(prevUsers => prevUsers.map(user => {
                                                    if (user.id === matchedStud.id) {
                                                        if (currentStudent && currentStudent.id === user.id) {
                                                            setCurrentStudent(prev => ({ ...prev, creditLiability: newLiability }));
                                                        }
                                                        return { ...user, creditLiability: newLiability };
                                                    }
                                                    return user;
                                                }));

                                                if (window.CanteenDB && matchedStud.id) {
                                                    await window.CanteenDB.updateStudentCreditLiability(matchedStud.id, newLiability).catch(err => console.warn("Cloud DB liability update error", err));
                                                }
                                            }
                                        }

                                        // 3. Append order to shift order history
                                        setRecentOrders(prev => [order, ...prev]);

                                        // 4. Save order to Supabase Cloud DB if available (with offline localStorage queue fallback)
                                        if (window.CanteenDB) {
                                            try {
                                                const matchedStud = registeredUsers.find(u => u.studentId === order.studentId || u.name === order.student);
                                                await window.CanteenDB.createOrder({
                                                    order_number: order.orderNo,
                                                    user_id: matchedStud ? matchedStud.id : null,
                                                    cashier_id: null,
                                                    total_amount: order.subtotal || order.total,
                                                    discount_amount: order.discountAmount || 0,
                                                    final_amount: order.total,
                                                    payment_method: order.paymentMethod.toLowerCase(),
                                                    pay_later_note: order.payLaterNote || null,
                                                    order_source: 'pos_cashier',
                                                    items: order.items.map(i => ({
                                                        product_id: i.id,
                                                        product_name: i.name,
                                                        unit_price: i.price,
                                                        quantity: i.qty
                                                    }))
                                                });
                                            } catch(err) {
                                                console.warn("Cloud DB order creation warning", err);
                                                try {
                                                    const offlineQueue = JSON.parse(localStorage.getItem('novalunch_offline_orders') || '[]');
                                                    offlineQueue.push(order);
                                                    localStorage.setItem('novalunch_offline_orders', JSON.stringify(offlineQueue));
                                                    showToast(`⚠️ Saved order ${order.orderNo} to Offline Local Queue. Will auto-sync when online.`, "warning");
                                                } catch(e) {}
                                            }
                                        }

                                        setPosCart([]); 
                                        showToast(`Completed POS Order ${order.orderNo} (₱${order.total.toFixed(2)})!`); 
                                    }}
                                    activeTab={activeTab}
                                    setActiveTab={setActiveTab}
                                    onSignOut={() => setActiveRole('LOGIN')}
                                    onBackToRoleSelect={() => setActiveRole('LOGIN')}
                                    isCloudConnected={isCloudConnected}
                                    onRefreshCloud={syncCloudData}
                                    notifications={notifications}
                                    onMarkNotifRead={handleMarkNotificationRead}
                                    onMarkAllNotifRead={handleMarkAllNotificationsRead}
                                />
                            )}

                            {activeRole === 'ADMIN' && (
                                <AdminView
                                    gcashQueue={gcashQueue}
                                    menuCatalog={menuCatalog}
                                    registeredUsers={registeredUsers}
                                    inventoryBatches={inventoryBatches}
                                    setInventoryBatches={setInventoryBatches}
                                    onApproveTopup={handleApproveTopup}
                                    onRejectTopup={handleRejectTopup}
                                    onAddProduct={async (p) => {
                                        setMenuCatalog([p, ...menuCatalog]);
                                        showToast(`Added product ${p.name}`);
                                        if (window.CanteenDB) {
                                            await window.CanteenDB.createProduct({
                                                name: p.name,
                                                category: p.category,
                                                price: p.price,
                                                stock: p.stock,
                                                img: p.img,
                                                available: true
                                            }).catch(err => console.warn("Cloud product creation warning", err));
                                        }
                                    }}
                                    onUpdateProduct={handleUpdateProduct}
                                    onArchiveProduct={handleArchiveProduct}
                                    onAddNewStudent={(s) => { setRegisteredUsers([s, ...registeredUsers]); showToast(`Provisioned ${s.role || 'Account'} for ${s.name}!`); }}
                                    onUpdateStudent={handleUpdateStudent}
                                    onArchiveStudent={handleArchiveStudent}
                                    activeTab={activeTab}
                                    setActiveTab={setActiveTab}
                                    onSignOut={() => setActiveRole('LOGIN')}
                                    onBackToRoleSelect={() => setActiveRole('LOGIN')}
                                    isCloudConnected={isCloudConnected}
                                    onRefreshCloud={syncCloudData}
                                    notifications={notifications}
                                    onMarkNotifRead={handleMarkNotificationRead}
                                    onMarkAllNotifRead={handleMarkAllNotificationsRead}
                                />
                            )}
                        </React.Fragment>
                    )}
                    {/* MODAL: DUPLICATE GCASH REFERENCE WARNING */}
                    <CustomModal
                        isOpen={!!duplicateRefModalData}
                        onClose={() => setDuplicateRefModalData(null)}
                        title="Duplicate GCash Reference Number"
                        subtitle="Security Alert & Anti-Fraud Guardrail"
                        icon={Icon.AlertCircle}
                        iconBg="bg-rose-100 text-rose-700 border-rose-300"
                        size="md"
                    >
                        {duplicateRefModalData && (
                            <div className="space-y-4 text-xs">
                                <div className="p-3.5 bg-rose-50 border border-rose-200 rounded-2xl text-rose-900 space-y-2">
                                    <div className="flex items-center gap-2 font-bold text-sm text-rose-950">
                                        <Icon.Lock className="w-4 h-4 text-rose-600 shrink-0" />
                                        Reference Number Blocked
                                    </div>
                                    <p>The GCash reference number <code>{duplicateRefModalData.refNo}</code> has already been submitted for top-up verification.</p>
                                </div>

                                <div className="p-3 bg-slate-50 border border-slate-200 rounded-xl space-y-1.5 font-mono text-[11px]">
                                    <div className="flex justify-between text-slate-600">
                                        <span>Reference No:</span>
                                        <strong className="text-rose-700 font-bold">{duplicateRefModalData.refNo}</strong>
                                    </div>
                                    <div className="flex justify-between text-slate-600">
                                        <span>Attempted At:</span>
                                        <strong className="text-slate-800">{duplicateRefModalData.date}</strong>
                                    </div>
                                    <div className="flex justify-between text-slate-600">
                                        <span>System Policy:</span>
                                        <strong className="text-amber-800">1 Ref No = 1 Verification</strong>
                                    </div>
                                </div>

                                <p className="text-[11px] text-slate-500">
                                    Please double-check your GCash SMS/receipt confirmation. If you believe this is a system error, present your digital receipt to the canteen administrator.
                                </p>

                                <div className="pt-2 border-t border-slate-100">
                                    <ActionButton 
                                        variant="gold" 
                                        onClick={() => setDuplicateRefModalData(null)} 
                                        className="w-full py-2.5 font-bold"
                                    >
                                        I Understand
                                    </ActionButton>
                                </div>
                            </div>
                        )}
                    </CustomModal>

                    {/* MODAL: CLAIM TOKEN / QR GENERATOR FOR PRE-ORDERS & RELEASES */}
                    <CustomModal
                        isOpen={!!claimTokenModalData}
                        onClose={() => setClaimTokenModalData(null)}
                        title="Student Claim Token & QR Code"
                        subtitle="Present this QR or claim token at the POS cashier desk"
                        icon={Icon.QrCode}
                        iconBg="bg-emerald-50 text-emerald-700 border-emerald-200"
                        size="md"
                    >
                        {claimTokenModalData && (
                            <div className="space-y-4 text-xs text-center">
                                <div className="p-4 bg-slate-900 rounded-2xl text-white space-y-3 flex flex-col items-center justify-center">
                                    {/* SIMULATED QR CODE GRAPHIC */}
                                    <div className="w-36 h-36 bg-white p-3 rounded-xl shadow-lg flex items-center justify-center border-4 border-emerald-400">
                                        <div className="grid grid-cols-5 gap-1.5 w-full h-full">
                                            {[...Array(25)].map((_, i) => (
                                                <div 
                                                    key={i} 
                                                    className={`rounded-xs ${i % 2 === 0 || i % 7 === 0 ? 'bg-slate-900' : i % 3 === 0 ? 'bg-emerald-600' : 'bg-white'}`}
                                                />
                                            ))}
                                        </div>
                                    </div>
                                    <div className="font-mono text-lg font-bold tracking-widest text-emerald-400">
                                        {claimTokenModalData.token}
                                    </div>
                                </div>

                                <div className="p-3 bg-slate-50 border border-slate-200 rounded-xl space-y-1 text-left text-[11px]">
                                    <div className="flex justify-between">
                                        <span className="text-slate-500">Student:</span>
                                        <strong className="text-slate-900">{claimTokenModalData.studentName} ({claimTokenModalData.studentId})</strong>
                                    </div>
                                    <div className="flex justify-between">
                                        <span className="text-slate-500">Issued Date:</span>
                                        <strong className="text-slate-800">{claimTokenModalData.date}</strong>
                                    </div>
                                    <div className="flex justify-between text-emerald-800 font-semibold pt-1 border-t border-slate-200">
                                        <span>Status:</span>
                                        <span>Ready for Pickup</span>
                                    </div>
                                </div>

                                <div className="pt-2 border-t border-slate-100">
                                    <ActionButton 
                                        variant="primary" 
                                        onClick={() => setClaimTokenModalData(null)} 
                                        className="w-full py-2.5 font-bold"
                                    >
                                        Done / Close
                                    </ActionButton>
                                </div>
                            </div>
                        )}
                    </CustomModal>
                </React.Fragment>
            );
        }

        class ErrorBoundary extends React.Component {
            constructor(props) {
                super(props);
                this.state = { hasError: false, error: null, errorInfo: null };
            }
            static getDerivedStateFromError(error) {
                return { hasError: true, error };
            }
            componentDidCatch(error, errorInfo) {
                console.error("Uncaught runtime error caught by ErrorBoundary:", error, errorInfo);
                this.setState({ errorInfo });
            }
            render() {
                if (this.state.hasError) {
                    return (
                        <div className="min-h-screen bg-slate-900 text-white flex flex-col items-center justify-center p-6 text-center space-y-4 font-sans">
                            <div className="w-16 h-16 rounded-3xl bg-rose-500/20 text-rose-400 border border-rose-500/30 flex items-center justify-center text-3xl font-bold">
                                ⚠️
                            </div>
                            <h2 className="text-2xl font-bold font-outfit text-rose-400">Application Runtime Error Encountered</h2>
                            <p className="text-xs text-slate-300 max-w-lg bg-slate-950 p-4 rounded-xl font-mono text-left overflow-x-auto border border-slate-800">
                                {this.state.error ? this.state.error.toString() : "An unexpected error occurred in the component hierarchy."}
                            </p>
                            <button 
                                onClick={() => window.location.reload()} 
                                className="px-6 py-2.5 bg-brand-700 hover:bg-brand-800 text-white font-bold rounded-xl text-xs transition-all shadow-lg btn-press"
                            >
                                Reload Application
                            </button>
                        </div>
                    );
                }
                return this.props.children;
            }
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(
            <ErrorBoundary>
                <UnifiedNovaLunchApp />
            </ErrorBoundary>
        );
    </script>
</body>
</html>
