        // =====================================================================
        // 4. CASHIER POS MODULE (WITH DIETARY LOCK ALERTS & SHIFT DRAWER TALLY)
        // =====================================================================
        function CashierView({ posCart, posTotal, menuCatalog, registeredUsers, recentOrders = [], preorders = [], onClaimPreorderPos, onAddToCart, onUpdateQty, onDeleteItem, onClearCart, onCompleteCheckout, onVoidOrder, onSettleDebt, activeTab = 'register', setActiveTab, onSignOut, onSelectRoleQuick, isCloudConnected, onRefreshCloud, notifications = [], onMarkNotifRead, onMarkAllNotifRead, onOpenCommandPalette, onOpenShiftZRead, kdsOrders = [], setKdsOrders, currentUser = null }) {
            const [selectedCategory, setSelectedCategory] = useState('All');
            const [searchQuery, setSearchQuery] = useState('');
            const [selectedStudent, setSelectedStudent] = useState(registeredUsers[0] || null);
            const [paymentMethod, setPaymentMethod] = useState('rfid');
            const [cashTendered, setCashTendered] = useState('');
            const [qrClaimInput, setQrClaimInput] = useState('');

            // Discount Engine State (Student 5%, Senior/PWD 20%, Custom ₱)
            const [discountType, setDiscountType] = useState('NONE'); // 'NONE' | 'STUDENT' | 'SENIOR_PWD' | 'CUSTOM'
            const [customDiscountInput, setCustomDiscountInput] = useState('');

            // Modals
            const [aiModalOpen, setAiModalOpen] = useState(false);
            const [rfidModalOpen, setRfidModalOpen] = useState(false);
            const [receiptModalOpen, setReceiptModalOpen] = useState(false);
            const [shiftModalOpen, setShiftModalOpen] = useState(false);
            const [voidModalOpen, setVoidModalOpen] = useState(false);
            const [selectedOrderToVoid, setSelectedOrderToVoid] = useState(null);
            const [voidManagerPinInput, setVoidManagerPinInput] = useState('');
            const [voidManagerPinError, setVoidManagerPinError] = useState('');

            // Tab Settlement Modal State
            const [settleModalOpen, setSettleModalOpen] = useState(false);
            const [settleAmountInput, setSettleAmountInput] = useState('');
            const [settlePaymentMethod, setSettlePaymentMethod] = useState('cash'); // 'cash' | 'rfid'
            const [settleError, setSettleError] = useState('');

            const [nearExpiryModalItem, setNearExpiryModalItem] = useState(null);
            const [lastCompletedOrder, setLastCompletedOrder] = useState(null);
            const [isProcessingCheckout, setIsProcessingCheckout] = useState(false);

            // Pay Later & Manager PIN Override State (FR-07)
            const [managerPinModalOpen, setManagerPinModalOpen] = useState(false);
            const [managerPinInput, setManagerPinInput] = useState('');
            const [payLaterNote, setPayLaterNote] = useState('');
            const [managerPinError, setManagerPinError] = useState('');

            // RFID Lookup state (125kHz EM4100 Format)
            const [rfidScanInput, setRfidScanInput] = useState('');
            const [rfidLookupInput, setRfidLookupInput] = useState('');
            const [rfidScanResult, setRfidScanResult] = useState(null);  // matched student
            const [rfidScanError, setRfidScanError] = useState('');
            const [rfidLookupMode, setRfidLookupMode] = useState('scan');  // 'scan' | 'manual'

            // Global Hardware 125kHz USB RFID Reader Keystroke Wedge Handler
            useEffect(() => {
                let rfidBuffer = '';
                let lastKeyTime = Date.now();

                const handleGlobalRfidKey = (e) => {
                    const tagName = e.target ? e.target.tagName.toUpperCase() : '';
                    if (tagName === 'INPUT' || tagName === 'TEXTAREA' || (e.target && e.target.isContentEditable)) {
                        return;
                    }

                    const now = Date.now();
                    if (now - lastKeyTime > 400) {
                        rfidBuffer = '';
                    }
                    lastKeyTime = now;

                    if (e.key === 'Enter') {
                        if (rfidBuffer.length >= 4) {
                            console.log('[GLOBAL 125kHz RFID HARDWARE TAP]:', rfidBuffer);
                            const rawScanned = rfidBuffer.trim();
                            rfidBuffer = '';
                            
                            // Lookup matched student
                            const normQuery = rawScanned.replace(/^0+/, '').toUpperCase();
                            const matched = registeredUsers.find(u => {
                                if (!u.rfidUid) return false;
                                const uRaw = u.rfidUid.toString().trim().toUpperCase();
                                const uNorm = uRaw.replace(/^0+/, '');
                                return uRaw === rawScanned.toUpperCase() || uNorm === normQuery;
                            });

                            if (matched) {
                                setSelectedStudent(matched);
                                setRfidScanResult(matched);
                                setRfidModalOpen(false);
                                speakWebText(`RFID card verified for ${matched.name}.`);
                            } else {
                                setRfidScanError(`Unregistered 125kHz Card UID: "${rawScanned}"`);
                                setRfidModalOpen(true);
                                speakWebText(`Warning! Unregistered RFID card.`);
                            }
                        }
                        rfidBuffer = '';
                    } else if (e.key && e.key.length === 1 && /[0-9a-zA-Z]/.test(e.key)) {
                        rfidBuffer += e.key;
                    }
                };

                window.addEventListener('keydown', handleGlobalRfidKey);
                return () => window.removeEventListener('keydown', handleGlobalRfidKey);
            }, [registeredUsers]);

            const categories = ['All', 'Meals & Mains', 'Beverages', 'Snacks & Bakery', 'Fruits & Healthy'];
            const filteredMenu = menuCatalog.filter(i => (selectedCategory === 'All' || i.category === selectedCategory) && i.name.toLowerCase().includes(searchQuery.toLowerCase()) && i.available !== false);

            // Dynamic Discount Calculation Engine
            const cartSubtotal = posCart.reduce((sum, i) => sum + (i.price * i.qty), 0);
            let discountAmount = 0;
            let discountLabel = 'None (0%)';

            if (discountType === 'STUDENT' || discountType === 'STUDENT_10') {
                discountAmount = cartSubtotal * 0.10; // 10% Student Discount
                discountLabel = 'Student (10%)';
            } else if (discountType === 'SENIOR_PWD' || discountType === 'SENIOR_20') {
                discountAmount = cartSubtotal * 0.20; // 20% Senior/PWD Discount
                discountLabel = 'Senior/PWD (20%)';
            } else if (discountType === 'CUSTOM') {
                const customVal = parseFloat(customDiscountInput) || 0;
                discountAmount = Math.min(cartSubtotal, customVal);
                discountLabel = `Custom (₱${discountAmount.toFixed(2)})`;
            }

            const netTotal = Math.max(0, cartSubtotal - discountAmount);
            const currentStudentBalance = selectedStudent ? selectedStudent.balance : 0;
            const isRfidShortage = paymentMethod === 'rfid' && netTotal > currentStudentBalance;
            const cashTenderedVal = parseFloat(cashTendered) || 0;
            const cashChange = cashTenderedVal - netTotal;

            // Calculate cart calories and check for restricted allergens/calories for selected student
            const cartCalories = posCart.reduce((sum, cartItem) => {
                const menuItem = menuCatalog.find(m => m.id === cartItem.id);
                return sum + ((menuItem?.calories || cartItem.calories || 0) * cartItem.qty);
            }, 0);

            const isCalorieOverflow = selectedStudent && ((selectedStudent.dailyCaloriesSpent || 0) + cartCalories > (selectedStudent.maxDailyCalories || 1800));

            const restrictedAllergensFound = selectedStudent && selectedStudent.allergies && selectedStudent.allergies.length > 0 ? posCart.filter(cartItem => {
                const menuItem = menuCatalog.find(m => m.id === cartItem.id);
                return menuItem && menuItem.allergens && menuItem.allergens.some(alg => selectedStudent.allergies.includes(alg));
            }) : [];

            const hasDietaryConflict = restrictedAllergensFound.length > 0 || isCalorieOverflow;
            const isHardBlockMode = selectedStudent?.allergenMode === 'HARD_BLOCK';

            const handleSimulateAiScan = () => {
                const burger = menuCatalog.find(m => m.id === 'p1') || menuCatalog[0];
                const juice = menuCatalog.find(m => m.id === 'p5') || menuCatalog[1];
                if (burger) onAddToCart(burger);
                if (juice) onAddToCart(juice);
                setAiModalOpen(false);
            };

            // RFID scan: match by UID first (with zero-padding normalization), fallback to student ID, error if no RFID enrolled
            const handleRfidScan = (e, overrideInput = null) => {
                e && e.preventDefault && e.preventDefault();
                setRfidScanError('');
                setRfidScanResult(null);
                const rawQuery = (overrideInput || rfidScanInput).trim();
                if (!rawQuery) return setRfidScanError('Please scan or enter an RFID UID.');

                const normQuery = rawQuery.replace(/^0+/, '').toUpperCase();

                // Match by RFID UID (supporting 10-digit 125kHz leading zero variations)
                const byUid = registeredUsers.find(u => {
                    if (!u.rfidUid) return false;
                    const uRaw = u.rfidUid.toString().trim().toUpperCase();
                    const uNorm = uRaw.replace(/^0+/, '');
                    return uRaw === rawQuery.toUpperCase() || uNorm === normQuery;
                });

                if (byUid) {
                    setRfidScanResult(byUid);
                    return byUid;
                }

                // Fallback check by Student ID
                const byStudentId = registeredUsers.find(u => u.studentId && u.studentId.toUpperCase() === rawQuery.toUpperCase());
                if (byStudentId) {
                    if (!byStudentId.rfidUid) {
                        setRfidScanError(`Student "${byStudentId.name}" (${byStudentId.studentId}) has NO RFID badge enrolled. Use manual lookup or switch to Cash/QR payment.`);
                        return null;
                    }
                    setRfidScanResult(byStudentId);
                    return byStudentId;
                }

                setRfidScanError(`No student account found matching RFID UID "${rawQuery}". The card may not be registered in the system.`);
                return null;
            };

            const handleRfidManualLookup = (e) => {
                e && e.preventDefault && e.preventDefault();
                setRfidScanError('');
                setRfidScanResult(null);
                const query = rfidLookupInput.trim();
                if (!query) return setRfidScanError('Enter Student ID or full name to look up.');

                const match = registeredUsers.find(u =>
                    (u.studentId && u.studentId.toLowerCase() === query.toLowerCase()) ||
                    (u.name && u.name.toLowerCase().includes(query.toLowerCase())) ||
                    (u.email && u.email.toLowerCase() === query.toLowerCase())
                );

                if (!match) return setRfidScanError(`No student found for "${query}". Check spelling or Student ID.`);

                if (!match.rfidUid) {
                    // Student found but no RFID — allow selection but flag as unlinked
                    setRfidScanResult({ ...match, _noRfid: true });
                    return;
                }

                setRfidScanResult(match);
            };

            const handleConfirmRfidStudent = () => {
                if (!rfidScanResult) return;
                setSelectedStudent(rfidScanResult);
                setRfidScanInput('');
                setRfidLookupInput('');
                setRfidScanResult(null);
                setRfidScanError('');
                setRfidModalOpen(false);
                // If student has no RFID, auto-switch payment to cash
                if (rfidScanResult._noRfid) setPaymentMethod('cash');
            };

            const handleFulfillQrClaim = (e) => {
                e && e.preventDefault && e.preventDefault();
                const tokenStr = (qrClaimInput || '').trim();
                if (!tokenStr) return alert("Please enter or scan a valid QR Claim Token.");

                if (onClaimPreorderPos) {
                    onClaimPreorderPos(tokenStr);
                } else {
                    const burger = menuCatalog.find(m => m.id === 'p1') || menuCatalog[0];
                    if (burger) onAddToCart(burger);
                    alert(`Pre-Order Token ${tokenStr} Validated! Meal tray added to checkout.`);
                }
                setQrClaimInput('');
            };

            const handleCheckoutSubmit = async (bypassManagerPin = false) => {
                if (isProcessingCheckout) return;
                if (posCart.length === 0) return alert("Please select items to add to the checkout order.");
                if (isRfidShortage) return alert("Cannot complete checkout: Customer RFID balance is insufficient.");
                if (paymentMethod === 'cash' && cashTenderedVal < netTotal) return alert("Cannot complete checkout: Cash tendered is less than order total.");

                // Hard block vs Soft Warning handling
                if (hasDietaryConflict) {
                    if (isHardBlockMode) {
                        return alert(`STRICT DIETARY BLOCK: Customer ${selectedStudent.name} has a hard lock on restricted allergens (${restrictedAllergensFound.map(i => i.name).join(', ') || 'Calorie Limit'}). Checkout prohibited!`);
                    } else if (!bypassManagerPin) {
                        setManagerPinModalOpen(true);
                        return;
                    }
                }

                // Dynamic Pay Later Credit Liability Cap Check (Allowance & Profile Credit Limit)
                if (paymentMethod === 'pay_later') {
                    if (selectedStudent && (selectedStudent.payLaterAllowance === false || selectedStudent.pay_later_allowance === false)) {
                        return alert("Pay Later emergency credit mode is disabled for this student account! Please select RFID or Cash payment.");
                    }
                    const currentLiability = selectedStudent ? (selectedStudent.creditLiability || selectedStudent.credit_liability || 0.0) : 0.0;
                    const creditCap = selectedStudent ? (parseFloat(selectedStudent.credit_limit || selectedStudent.creditLimit) || 500.00) : 500.00;
                    const newLiability = currentLiability + netTotal;
                    if (newLiability > creditCap && !bypassManagerPin) {
                        setManagerPinModalOpen(true);
                        return;
                    }
                }

                // Dynamic Daily Spending Limit Guardrail Check for RFID Payments
                if (paymentMethod === 'rfid' && selectedStudent) {
                    const currentDailySpent = selectedStudent.dailySpent || 0.0;
                    const dailyCap = parseFloat(selectedStudent.daily_limit || selectedStudent.dailyCap) || 200.0;
                    if ((currentDailySpent + netTotal) > dailyCap && !bypassManagerPin) {
                        setManagerPinModalOpen(true);
                        return;
                    }
                }

                // Log governance override if manager PIN bypass was used
                if (bypassManagerPin && selectedStudent && window.CanteenDB) {
                    const overrideType = hasDietaryConflict ? 'DIETARY_OVERRIDE' : (paymentMethod === 'pay_later' ? 'PAY_LATER_CEILING_OVERRIDE' : 'DAILY_SPENDING_CAP_OVERRIDE');
                    window.CanteenDB.logGovernanceOverride(selectedStudent.id, null, overrideType, "Manager PIN override authorized at POS register", true).catch(e => console.warn("Governance override log error:", e));
                }

                try {
                    setIsProcessingCheckout(true);

                    const orderData = {
                        orderNo: `ORD-2026-${Math.floor(1000 + Math.random() * 9000)}`,
                        student: selectedStudent ? selectedStudent.name : "Walk-in Student",
                        studentId: selectedStudent ? selectedStudent.studentId : "N/A",
                        rfidUid: selectedStudent ? selectedStudent.rfidUid : "N/A",
                        items: [...posCart],
                        subtotal: cartSubtotal,
                        discountAmount: discountAmount,
                        discountLabel: discountLabel,
                        total: netTotal,
                        paymentMethod: paymentMethod.toUpperCase(),
                        payLaterNote: paymentMethod === 'pay_later' ? (payLaterNote || 'Canteen Emergency Credit') : null,
                        cashTendered: paymentMethod === 'cash' ? cashTenderedVal : null,
                        cashChange: paymentMethod === 'cash' ? cashChange : null,
                        timestamp: new Date().toLocaleString(),
                        status: 'COMPLETED'
                    };

                    if (paymentMethod === 'rfid' && selectedStudent) {
                        selectedStudent.dailySpent = (selectedStudent.dailySpent || 0.0) + netTotal;
                    }

                    setLastCompletedOrder(orderData);
                    await onCompleteCheckout(orderData);
                    setReceiptModalOpen(true);
                    setCashTendered('');
                    setPayLaterNote('');
                    setDiscountType('NONE');
                    setCustomDiscountInput('');
                } catch (err) {
                    console.error("Checkout processing error:", err);
                    alert("An error occurred during checkout processing. Please try again.");
                } finally {
                    setIsProcessingCheckout(false);
                }
            };

            const currentTab = ['register', 'ai_camera', 'qr_claim', 'shift_history', 'shift', 'sales_report', 'kds', 'pickup_board'].includes(activeTab) ? activeTab : 'register';

            return (
                <div className="pl-64 min-h-screen bg-[#F8FAFC] text-slate-800 flex flex-col">
                    {/* SALES MODULE HEADER & NAVIGATION TABS */}
                    <div className="p-6 pb-0 space-y-4">
                        <header className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 pb-5 border-b border-slate-200/60">
                            <div className="flex items-center gap-3.5">

                        size="md"
                    >
                        <form onSubmit={async (e) => {
                            e.preventDefault();
                            setBatchFormError('');

                            if (!batchProdId) {
                                setBatchFormError('Please select a menu item from the catalog.');
                                return;
                            }
                            const matchedProd = menuCatalog.find(p => p.id === batchProdId);
                            if (!matchedProd) {
                                setBatchFormError('Selected menu product was not found in catalog.');
                                return;
                            }

                            const qtyNum = parseInt(batchQty);
                            if (isNaN(qtyNum) || qtyNum <= 0) {
                                setBatchFormError('Received quantity must be greater than 0.');
                                return;
                            }

                            const unitCostNum = parseFloat(batchUnitCost);
                            if (isNaN(unitCostNum) || unitCostNum < 0) {
                                setBatchFormError('Unit cost cannot be negative.');
                                return;
                            }

                            if (!batchExpDate) {
                                setBatchFormError('Please select a valid expiration date.');
                                return;
                            }

                            // Expiration date status calculation
                            const todayStr = new Date().toISOString().split('T')[0];
                            const expTime = new Date(batchExpDate).getTime();
                            const nowTime = new Date().getTime();
                            const daysDiff = (expTime - nowTime) / (1000 * 3600 * 24);

                            let calculatedStatus = 'ACTIVE';
                            if (batchExpDate < todayStr) calculatedStatus = 'EXPIRED';
                            else if (daysDiff <= 3) calculatedStatus = 'NEAR_EXPIRY';

                            const newBatch = {
                                id: `b-${Date.now()}`,
                                product_id: matchedProd.id,
                                product_name: matchedProd.name,
                                batch_number: batchNumber.trim() || `BATCH-2026-${Math.floor(1000 + Math.random() * 9000)}`,
                                quantity_received: qtyNum,
                                quantity_remaining: qtyNum,
                                unit_cost: unitCostNum,
                                expiration_date: batchExpDate,
                                status: calculatedStatus
                            };

                            setInventoryBatches([newBatch, ...inventoryBatches]);
                            
                            // Increase stock in menuCatalog
                            onUpdateProduct({ ...matchedProd, stock: matchedProd.stock + newBatch.quantity_received });

                            // Persist to Supabase if available
                            if (window.CanteenDB) {
                                window.CanteenDB.addInventoryBatch({
                                    product_id: newBatch.product_id,
                                    batch_number: newBatch.batch_number,
                                    quantity_received: newBatch.quantity_received,
                                    quantity_remaining: newBatch.quantity_remaining,
                                    unit_cost: newBatch.unit_cost,
                                    expiration_date: newBatch.expiration_date,
                                    status: calculatedStatus
                                }).catch(err => console.warn(err));
                            }

                            setAddBatchModalOpen(false);
                            setBatchProdId(''); setBatchNumber(''); setBatchQty('50'); setBatchFormError('');
                            showToast(`Intaken Batch ${newBatch.batch_number} (+${newBatch.quantity_received} units)`);

                        subtitle="Deduct spoiled or expired batch stock from FIFO inventory"

                        size="md"
                    >
                        <form onSubmit={async (e) => {
                            e.preventDefault();
                            setSpoilageFormError('');

                            if (!spoilageBatchId) {
                                setSpoilageFormError('Please select a target inventory batch.');
                                return;
                            }

                            const batch = inventoryBatches.find(b => b.id === spoilageBatchId);
                            if (!batch) {
                                setSpoilageFormError('Selected target batch was not found.');
                                return;
                            }

                            const deduqQty = parseInt(spoilageQty);
                            if (isNaN(deduqQty) || deduqQty <= 0) {
                                setSpoilageFormError('Spoilage quantity must be greater than 0.');
                                return;
                            }

                            if (deduqQty > batch.quantity_remaining) {
                                setSpoilageFormError(`Spoilage quantity (${deduqQty}) cannot exceed remaining batch stock (${batch.quantity_remaining} units).`);
                                return;
                            }

                            const updatedBatches = inventoryBatches.map(b => {
                                if (b.id === batch.id) {
                                    const newRem = Math.max(0, b.quantity_remaining - deduqQty);
                                    return { ...b, quantity_remaining: newRem, status: newRem === 0 ? 'DEPLETED' : b.status };
                                }
                                return b;
                            });
                            setInventoryBatches(updatedBatches);

                            // Deduct product stock in menuCatalog
                            const prod = menuCatalog.find(p => p.name === batch.product_name || p.id === batch.product_id);
                            if (prod) {
                                onUpdateProduct({ ...prod, stock: Math.max(0, prod.stock - deduqQty) });
                            }

                            // Persist to Supabase if available
                            if (window.CanteenDB) {
                                window.CanteenDB.logSpoilage(batch.id, deduqQty, spoilageReason, 'Admin User').catch(err => console.warn(err));
                            }
                            showToast(`Logged ${deduqQty} units spoilage for ${batch.batch_number}`);

                            setSpoilageBatchId(''); setSpoilageQty('1'); setSpoilageFormError('');

            const handleApproveTopup = async (queueItem, adminNote = "Verified by Canteen Admin") => {
                if (!queueItem || !queueItem.id) {
                    showToast("⚠️ Invalid top-up request item.", "danger");
                    return;
                }

                const targetUser = registeredUsers.find(u => u.id === queueItem.studentId || u.studentId === queueItem.studentIdNumber || (u.name && queueItem.student.includes(u.name)));

                if (!targetUserId) {
                    showToast("⚠️ Cannot approve: Unable to resolve target student account ID.", "danger");
                    return;
                }

                const currentBal = targetUser?.balance || 0;
                const newBal = currentBal + queueItem.amount;

                try {
                    if (window.CanteenDB) {
                        await window.CanteenDB.updateGcashReloadStatus(queueItem.id, 'Approved', adminNote);
                        await window.CanteenDB.updateStudentBalance(targetUserId, newBal);
                    }

                    setGcashQueue(prev => prev.map(q => q.id === queueItem.id ? { ...q, status: 'Approved', adminNote, reviewedAt: new Date().toLocaleString() } : q));
                    setReloadLogs(prev => prev.map(r => r.id === queueItem.id ? { ...r, status: 'Approved' } : r));

                    setRegisteredUsers(prev => prev.map(u => {
                        if (u.id === targetUserId || u.studentId === queueItem.studentIdNumber) {
                            return { ...u, balance: newBal };
                        }
                        return u;
                    }));

                    if (currentStudent && (currentStudent.id === targetUserId || queueItem.student.includes(currentStudent.name))) {

                        id: 'notif_' + Date.now(),
                        title: 'GCash Top-Up Approved! 💳',
                        message: `Your GCash reload of ₱${queueItem.amount.toFixed(2)} (Ref: ${queueItem.refNo}) has been approved and credited to RFID balance.`,

                        read: false,
                        type: 'financial'

                    setNotifications(prev => [newNotif, ...prev]);

                    showToast(`Approved ₱${queueItem.amount.toFixed(2)} top-up for ${queueItem.student}!`);

                    showToast(`⚠️ Top-up approval failed: ${err.message}`, "danger");

            };

            const handleRejectTopup = (queueItem, rejectionReason = "Information mismatch") => {

            const handleArchiveStudent = async (userId) => {

                showToast(`Archived account`);

                if (window.CanteenDB) {
                    await window.CanteenDB.archiveUser(userId).catch(e => console.warn(e));
                }
            };

            const handleSettleDebt = async (studentId, amountPaid, paymentMethod = 'cash') => {
                const targetUser = registeredUsers.find(u => u.id === studentId || u.studentId === studentId);
                if (!targetUser) {
                    alert("Student not found for tab settlement.");
                    return false;
                }
                
                const currentLiability = targetUser.creditLiability || 0;
                const cleanPaid = Math.min(currentLiability, parseFloat(amountPaid) || 0);
                if (cleanPaid <= 0) {
                    alert("Please enter a valid positive repayment amount.");
                    return false;
                }

                let newBal = targetUser.balance || 0;
                if (paymentMethod === 'rfid') {
                    if (newBal < cleanPaid) {
                        alert(`Insufficient RFID balance! Available: ₱${newBal.toFixed(2)}, Repayment: ₱${cleanPaid.toFixed(2)}`);
                        return false;
                    }
                    newBal = newBal - cleanPaid;
                }

                const newLiability = Math.max(0, currentLiability - cleanPaid);

                setRegisteredUsers(prevUsers => prevUsers.map(u => {
                    if (u.id === targetUser.id) {
                        return { ...u, creditLiability: newLiability, balance: newBal };
                    }
                    return u;
                }));

                if (currentStudent && currentStudent.id === targetUser.id) {
                    setStudentBalance(newBal);
                    setCurrentStudent(prev => ({ ...prev, creditLiability: newLiability, balance: newBal }));
                }

                // Cloud sync
                if (window.CanteenDB) {
                    window.CanteenDB.settleStudentDebt(targetUser.id, cleanPaid, paymentMethod).catch(e => console.warn(e));
                }

                // Add in-app notification
                const newNotif = {
                    id: 'notif_' + Date.now(),
                    title: 'Pay Later Tab Settled! 🤝',
                    message: `Cleared ₱${cleanPaid.toFixed(2)} Pay Later credit debt via ${paymentMethod.toUpperCase()}. Remaining Tab Balance: ₱${newLiability.toFixed(2)}.`,
                    timestamp: 'Just now',
                    read: false,
                    type: 'financial'
                };
                setNotifications(prev => [newNotif, ...prev]);
                showToast(`Settled ₱${cleanPaid.toFixed(2)} tab debt for ${targetUser.name}!`);
                return { success: true, remainingLiability: newLiability };
            };

            const handleUpdateProduct = async (updatedProd) => {

                }

                showToast(`Restored product to active catalog!`);
                if (window.CanteenDB && window.CanteenDB.unarchiveProduct) {
                    await window.CanteenDB.unarchiveProduct(prodId).catch(e => console.warn(e));

                        await window.CanteenDB.updateOrderStatus(orderId, 'completed');

                        if (error) throw error;
                    }
                    setRecentOrders(prev => prev.map(o => (o.id === orderId || o.orderNo === orderId) ? { ...o, status: 'completed', order_status: 'completed' } : o));
                    showToast(`Restored order status to completed!`);

                    console.error("[Restore Order Error]", err);
                    showToast(`⚠️ Failed to restore order: ${err.message}`, "danger");
                }
            };

            const handleRestoreBatch = async (batchId) => {
                setInventoryBatches(prev => prev.map(b => (b.id === batchId || b.batch_number === batchId) ? { ...b, status: 'ACTIVE', notes: 'Restored from Master Archive' } : b));
                showToast(`Restored inventory batch to active status!`);
            };

            const handleRestoreTopup = async (topupId) => {
                try {
                    if (window.CanteenDB && window.CanteenDB.updateGcashReloadStatus) {
                        await window.CanteenDB.updateGcashReloadStatus(topupId, 'Pending', 'Restored from archive');
                    } else if (supabaseClient) {
                        const { error } = await supabaseClient.from('topup_requests').update({ status: 'Pending', admin_note: 'Restored to Pending Queue', reviewed_at: new Date().toISOString() }).eq('id', topupId);
                        if (error) throw error;
                    }
                    setGcashQueue(prev => prev.map(t => t.id === topupId ? { ...t, status: 'Pending', admin_note: 'Restored to Pending Queue' } : t));
                    showToast(`Restored GCash top-up request to Pending queue!`);
                } catch(err) {
                    console.error("[Restore Topup Error]", err);
                    showToast(`⚠️ Failed to restore top-up request: ${err.message}`, "danger");
                }
            };

            const handlePurgeItem = async (type, id) => {
                if (type === 'student' || type === 'user') {
                    setRegisteredUsers(prev => prev.filter(u => u.id !== id));
                    showToast(`Permanently deleted user account.`);
                } else if (type === 'product') {
                    setMenuCatalog(prev => prev.filter(p => p.id !== id));
                    showToast(`Permanently deleted menu product.`);
                } else if (type === 'order') {
                    setRecentOrders(prev => prev.filter(o => o.id !== id && o.orderNo !== id));
                    showToast(`Permanently purged order record.`);
                } else if (type === 'batch') {
                    setInventoryBatches(prev => prev.filter(b => b.id !== id && b.batch_number !== id));
                    showToast(`Permanently purged inventory batch.`);
                } else if (type === 'topup') {
                    setGcashQueue(prev => prev.filter(t => t.id !== id));
                    showToast(`Permanently purged top-up request.`);
                }
            };

            const posTotal = posCart.reduce((sum, i) => sum + (i.price * i.qty), 0);

            const getCurrentUser = () => {
                if (activeRole === 'STUDENT') return currentStudent || registeredUsers.find(u => u.email === 'student@gmail.com') || { name: "Juan Student", email: "student@gmail.com", studentId: "2026-00001" };
                if (activeRole === 'PARENT') return currentParent || registeredUsers.find(u => u.email === 'parent@gmail.com') || { name: "Maria Parent", email: "parent@gmail.com", studentId: "PAR-00001" };
                if (activeRole === 'CASHIER') return registeredUsers.find(u => u.email === 'cashier@gmail.com') || { name: "Elena Cashier", email: "cashier@gmail.com", studentId: "STF-CSH-001" };
                if (activeRole === 'ADMIN') return registeredUsers.find(u => u.email === 'admin@gmail.com') || { name: "System Admin (Official)", email: "admin@gmail.com", studentId: "STF-ADM-001" };

                                setActiveTab={setActiveTab}
                                onSignOut={() => setActiveRole('LOGIN')}
                                onSelectRoleQuick={handleSelectRoleQuick}
                                isCloudConnected={isCloudConnected}
                                onRefreshCloud={syncCloudData}
                                currentUser={getCurrentUser()}
                            />

                            {activeRole === 'STUDENT' && (
                                <StudentView
                                    studentBalance={studentBalance}
                                    dailyLimit={dailyLimit}
                                    currentStudent={currentStudent}
                                    menuCatalog={menuCatalog}
                                    preorders={preorders}
                                    recentOrders={recentOrders}
                                    reloadLogs={reloadLogs}
                                    onUploadReceipt={handleUploadReceipt}
                                    onUpdatePin={handleUpdateStudentPin}
                                    onAddPreOrder={async (item) => {
                                        // 1. Stock availability validation guardrail
                                        const matchedProd = menuCatalog.find(p => p.id === item.id || p.name === item.name);
                                        if (matchedProd && matchedProd.stock <= 0) {
                                            showToast(`⚠️ Sorry, ${item.name} is currently Sold Out and cannot be pre-ordered!`, "danger");
                                            return;
                                        }

                                        // 2. Financial Balance Validation Guardrail
                                        const currentBal = studentBalance || 0;
                                        if (currentBal < item.price) {
                                            showToast(`⚠️ Insufficient wallet balance! Current balance: ₱${currentBal.toFixed(2)}, Item price: ₱${item.price.toFixed(2)}. Please top up via GCash.`, "danger");
                                            return;
                                        }

                                        // 3. Daily Spending Limit Guardrail
                                        const todayStr = new Date().toDateString();
                                        const todayPreordersSpent = preorders.filter(p => (p.studentId === currentStudent?.id || p.student_id === currentStudent?.id) && p.status !== 'Cancelled' && new Date(p.created_at || Date.now()).toDateString() === todayStr).reduce((sum, p) => sum + (parseFloat(p.price) || 0), 0);
                                        const currentCap = dailyLimit || currentStudent?.dailyCap || currentStudent?.daily_limit || 200.00;
                                        if ((todayPreordersSpent + item.price) > currentCap) {
                                            showToast(`⚠️ Pre-order exceeds your daily spending limit of ₱${currentCap.toFixed(2)}! (Already reserved today: ₱${todayPreordersSpent.toFixed(2)})`, "danger");
                                            return;
                                        }

                                        const tokenStr = `QR-2026-${Math.floor(1000 + Math.random() * 9000)}`;
                                        const preorderRecord = {
                                            student_id: currentStudent ? currentStudent.id : 'u101',
                                            item_name: item.name,
                                            price: item.price,
                                            token: tokenStr,
                                            status: 'Pending',
                                            created_at: new Date().toISOString()
                                        };
                                        const updatedBal = Math.max(0, currentBal - item.price);

                                        try {
                                            // 4. Await Backend Database Operations FIRST
                                            if (window.CanteenDB) {
                                                await window.CanteenDB.createPreorder(preorderRecord);
                                                if (currentStudent?.id) {
                                                    await window.CanteenDB.updateStudentBalance(currentStudent.id, updatedBal);
                                                }
                                                if (matchedProd && matchedProd.id) {
                                                    await window.CanteenDB.deductStockFifo(matchedProd.id, 1);
                                                }
                                            }

                                            // 5. Mutate Local UI State AFTER confirmed backend persistence
                                            const newPoObj = { id: 'po_' + Date.now(), name: item.name, price: item.price, token: tokenStr, status: 'Pending', studentId: currentStudent?.id };
                                            setPreorders(prev => [newPoObj, ...prev]);
                                            setStudentBalance(updatedBal);
                                            setRegisteredUsers(prev => prev.map(u => (u.id === currentStudent?.id || u.studentId === currentStudent?.studentId) ? { ...u, balance: updatedBal } : u));
                                            
                                            if (matchedProd) {
                                                const newStock = Math.max(0, matchedProd.stock - 1);
                                                setMenuCatalog(prev => prev.map(p => p.id === matchedProd.id ? { ...p, stock: newStock } : p));
                                                setInventoryBatches(prevBatches => {
                                                    let qtyRemainingToDeduct = 1;
                                                    return prevBatches.map(b => {
                                                        const isMatch = b.product_id === matchedProd.id || b.product_name === matchedProd.name;
                                                        if (isMatch && qtyRemainingToDeduct > 0 && b.quantity_remaining > 0) {
                                                            const d = Math.min(b.quantity_remaining, qtyRemainingToDeduct);
                                                            qtyRemainingToDeduct -= d;
                                                            const newRem = b.quantity_remaining - d;
                                                            return { ...b, quantity_remaining: newRem, status: newRem === 0 ? 'DEPLETED' : b.status };
                                                        }
                                                        return b;
                                                    });
                                                });
                                            }

                                            showToast(`Pre-ordered ${item.name}! Claim pass issued: ${tokenStr}`);
                                        } catch (err) {
                                            console.error("[Pre-order Persistence Error]", err);
                                            showToast(`⚠️ Pre-order failed: ${err.message || 'Database error processing transaction.'}`, "danger");
                                        }
                                    }}
                                    onClaimClick={(item) => setClaimTokenModalData({

                                        studentId: currentStudent ? currentStudent.studentId : "2023-01900",
                                        date: new Date().toLocaleDateString()
                                    })}
                                    activeTab={activeTab}
                                    setActiveTab={setActiveTab}
                                    onSignOut={() => setActiveRole('LOGIN')}
                                    onBackToRoleSelect={() => setActiveRole('LOGIN')}
                                    isCloudConnected={isCloudConnected}

                                        const cleanLimit = Math.max(0, parseFloat(l) || 0);

                                            setRegisteredUsers(prev => prev.map(u => u.id === targetId ? { ...u, dailyCap: cleanLimit, daily_limit: cleanLimit } : u));
                                            setCurrentStudent(prev => prev ? { ...prev, dailyCap: cleanLimit, daily_limit: cleanLimit } : prev);
                                            if (window.CanteenDB && targetId) {
                                                window.CanteenDB.updateUserDailyLimit(targetId, cleanLimit).catch(e => console.warn(e));
                                            }
                                        }
                                        showToast(`Updated daily spending cap to ₱${cleanLimit.toFixed(2)}!`);
                                    }}
                                    onUploadReceipt={handleUploadReceipt}
                                    activeTab={activeTab}
                                    setActiveTab={setActiveTab}
                                    onSignOut={() => setActiveRole('LOGIN')}
                                    onBackToRoleSelect={() => setActiveRole('LOGIN')}
                                    isCloudConnected={isCloudConnected}
                                    onRefreshCloud={syncCloudData}
                                    notifications={notifications}
                                    onMarkNotifRead={handleMarkNotificationRead}
                                    onMarkAllNotifRead={handleMarkAllNotificationsRead}
                                    parentStudentLinkRequests={parentStudentLinkRequests}
                                    onSendLinkRequest={handleSendParentLinkRequest}
                                    onSettleDebt={handleSettleDebt}
                                />
                            )}

                            {activeRole === 'CASHIER' && (
                                <CashierView
                                    posCart={posCart}
                                    posTotal={posTotal}
                                    menuCatalog={menuCatalog}
                                    registeredUsers={registeredUsers}
                                    recentOrders={recentOrders}
                                    preorders={preorders}
                                    onClaimPreorderPos={handleClaimPreorderPos}
                                    onAddToCart={handleAddToCart}
                                    onUpdateQty={handleUpdateQty}
                                    onDeleteItem={handleDeleteItem}
                                    onClearCart={handleClearCart}
                                    onSettleDebt={handleSettleDebt}
                                    onVoidOrder={async (orderToVoid) => {
                                        // 1. Revert item stock in menuCatalog
                                        setMenuCatalog(prevCatalog => prevCatalog.map(item => {
                                            const cartMatch = (orderToVoid.items || []).find(i => i.id === item.id || i.name === item.name);
                                            if (cartMatch) {
                                                return { ...item, stock: item.stock + cartMatch.qty };
                                            }
                                            return item;
                                        }));

                                        // 2. Refund student's RFID wallet balance or reverse Pay Later liability in state & DB
                                        if (orderToVoid.paymentMethod === 'RFID') {
                                            const matchedStud = registeredUsers.find(u => u.rfidUid === orderToVoid.rfidUid || u.name === orderToVoid.student || u.studentId === orderToVoid.studentId);
                                            if (matchedStud) {
                                                const refundedBal = matchedStud.balance + orderToVoid.total;
                                                setRegisteredUsers(prevUsers => prevUsers.map(user => user.id === matchedStud.id ? { ...user, balance: refundedBal } : user));
                                                if (currentStudent && currentStudent.id === matchedStud.id) {
                                                    setStudentBalance(refundedBal);
                                                }
                                                if (window.CanteenDB && matchedStud.id) {
                                                    await window.CanteenDB.updateStudentBalance(matchedStud.id, refundedBal).catch(e => console.warn("Cloud DB wallet refund error", e));
                                                }
                                            }
                                        } else if (orderToVoid.paymentMethod === 'PAY_LATER') {
                                            const matchedStud = registeredUsers.find(u => u.rfidUid === orderToVoid.rfidUid || u.name === orderToVoid.student || u.studentId === orderToVoid.studentId);
                                            if (matchedStud) {
                                                const reducedLiability = Math.max(0, (matchedStud.creditLiability || 0.0) - orderToVoid.total);
                                                setRegisteredUsers(prevUsers => prevUsers.map(user => user.id === matchedStud.id ? { ...user, creditLiability: reducedLiability } : user));
                                                if (currentStudent && currentStudent.id === matchedStud.id) {
                                                    setCurrentStudent(prev => ({ ...prev, creditLiability: reducedLiability }));
                                                }
                                                if (window.CanteenDB && matchedStud.id) {
                                                    await window.CanteenDB.updateStudentCreditLiability(matchedStud.id, reducedLiability).catch(e => console.warn("Cloud DB liability reversal error", e));
                                                }
                                            }
                                        }

                                        // 3. Mark order as VOIDED in recentOrders & Cloud DB
                                        setRecentOrders(prev => prev.map(o => o.orderNo === orderToVoid.orderNo ? { ...o, status: 'VOIDED' } : o));
                                        if (window.CanteenDB && (orderToVoid.id || orderToVoid.orderNo)) {
                                            window.CanteenDB.updateOrderStatus(orderToVoid.id || orderToVoid.orderNo, 'VOIDED').catch(e => console.warn("Cloud DB void status error", e));
                                        }
                                        showToast(`Voided order ${orderToVoid.orderNo} (₱${orderToVoid.total.toFixed(2)}). Stock restored & credit liability reversed.`);
                                    }}
                                    onCompleteCheckout={async (order) => { 
                                        // 1. Deduct product stock quantity in menuCatalog
                                        setMenuCatalog(prevCatalog => prevCatalog.map(item => {
                                            const cartMatch = order.items.find(i => i.id === item.id || i.name === item.name);
                                            if (cartMatch) {
                                                const newStock = Math.max(0, item.stock - cartMatch.qty);
                                                if (window.CanteenDB && item.id) {
                                                    window.CanteenDB.deductStockFifo(item.id, cartMatch.qty).catch(err => console.warn("FIFO sync warning", err));
                                                }
                                                // Decrement local inventory batch stock via FIFO
                                                setInventoryBatches(prevBatches => {
                                                    let qtyRemainingToDeduct = cartMatch.qty;
                                                    return prevBatches.map(b => {
                                                        const isMatch = b.product_id === item.id || b.product_name === item.name;
                                                        if (isMatch && qtyRemainingToDeduct > 0 && b.quantity_remaining > 0) {
                                                            const d = Math.min(b.quantity_remaining, qtyRemainingToDeduct);
                                                            qtyRemainingToDeduct -= d;
                                                            const newRem = b.quantity_remaining - d;
                                                            return { ...b, quantity_remaining: newRem, status: newRem === 0 ? 'DEPLETED' : b.status };
                                                        }
                                                        return b;
                                                    });
                                                });
                                                return { ...item, stock: newStock };
                                            }
                                            return item;
                                        }));

                                        // 2. Deduct scanned student's wallet balance if RFID payment OR accrue liability if PAY_LATER
                                        if (order.paymentMethod === 'RFID') {
                                            const matchedStud = registeredUsers.find(u => u.rfidUid === order.rfidUid || u.name === order.student || u.studentId === order.studentId);
                                            if (matchedStud) {
                                                const newBal = Math.max(0, matchedStud.balance - order.total);
                                                setRegisteredUsers(prevUsers => prevUsers.map(user => {
                                                    if (user.id === matchedStud.id) {
                                                        if (currentStudent && currentStudent.id === user.id) {
                                                            setStudentBalance(newBal);
                                                        }
                                                        return { ...user, balance: newBal };
                                                    }
                                                    return user;
                                                }));

                                                if (window.CanteenDB && matchedStud.id) {
                                                    await window.CanteenDB.updateStudentBalance(matchedStud.id, newBal).catch(err => console.warn("Cloud DB wallet update error", err));
                                                }
                                            }
                                        } else if (order.paymentMethod === 'PAY_LATER') {
                                            const matchedStud = registeredUsers.find(u => u.rfidUid === order.rfidUid || u.name === order.student || u.studentId === order.studentId);
                                            if (matchedStud) {
                                                const newLiability = (matchedStud.creditLiability || 0.0) + order.total;
                                                setRegisteredUsers(prevUsers => prevUsers.map(user => {
                                                    if (user.id === matchedStud.id) {
                                                        if (currentStudent && currentStudent.id === user.id) {
                                                            setCurrentStudent(prev => ({ ...prev, creditLiability: newLiability }));
                                                        }
                                                        return { ...user, creditLiability: newLiability };
                                                    }
                                                    return user;
                                                }));

                                                if (window.CanteenDB && matchedStud.id) {
                                                    await window.CanteenDB.updateStudentCreditLiability(matchedStud.id, newLiability).catch(err => console.warn("Cloud DB liability update error", err));
                                                }
                                            }
                                        }

                                        // 3. Append order to shift order history
                                        setRecentOrders(prev => [order, ...prev]);

                                        // 4. Save order to Supabase Cloud DB if available (with offline localStorage queue fallback)
                                        if (window.CanteenDB) {
                                            try {
                                                const matchedStud = registeredUsers.find(u => u.studentId === order.studentId || u.name === order.student);
                                                await window.CanteenDB.createOrder({
                                                    order_number: order.orderNo,
                                                    user_id: matchedStud ? matchedStud.id : null,
                                                    cashier_id: null,
                                                    total_amount: order.subtotal || order.total,
                                                    discount_amount: order.discountAmount || 0,
                                                    final_amount: order.total,
                                                    payment_method: order.paymentMethod.toLowerCase(),
                                                    pay_later_note: order.payLaterNote || null,
                                                    order_source: 'pos_cashier',
                                                    items: order.items.map(i => ({
                                                        product_id: i.id,
                                                        product_name: i.name,
                                                        unit_price: i.price,
                                                        quantity: i.qty
                                                    }))
                                                });
                                            } catch(err) {
                                                console.warn("Cloud DB order creation warning", err);
                                                try {
                                                    const offlineQueue = JSON.parse(localStorage.getItem('novalunch_offline_orders') || '[]');
                                                    offlineQueue.push(order);
                                                    localStorage.setItem('novalunch_offline_orders', JSON.stringify(offlineQueue));
                                                    showToast(`⚠️ Saved order ${order.orderNo} to Offline Local Queue. Will auto-sync when online.`, "warning");
                                                } catch(e) {}
                                            }
                                        }

                                        setPosCart([]); 
                                        showToast(`Completed POS Order ${order.orderNo} (₱${order.total.toFixed(2)})!`); 
                                    }}
                                    activeTab={activeTab}
                                    setActiveTab={setActiveTab}
                                    onSignOut={() => setActiveRole('LOGIN')}
                                    onBackToRoleSelect={() => setActiveRole('LOGIN')}
                                    isCloudConnected={isCloudConnected}
                                    onRefreshCloud={syncCloudData}
                                    notifications={notifications}
                                    onMarkNotifRead={handleMarkNotificationRead}
                                    onMarkAllNotifRead={handleMarkAllNotificationsRead}
                                    kdsOrders={kdsOrders}
                                    setKdsOrders={setKdsOrders}
                                    currentUser={getCurrentUser()}
                                />
                            )}

                            {activeRole === 'ADMIN' && (
                                <AdminView
                                    gcashQueue={gcashQueue}
                                    menuCatalog={menuCatalog}
                                    registeredUsers={registeredUsers}
                                    recentOrders={recentOrders}
                                    inventoryBatches={inventoryBatches}
                                    setInventoryBatches={setInventoryBatches}
                                    onApproveTopup={handleApproveTopup}
                                    onRejectTopup={handleRejectTopup}
                                    onAddProduct={async (p) => {
                                        setMenuCatalog([p, ...menuCatalog]);
                                        showToast(`Added product ${p.name}`);
                                        if (window.CanteenDB) {
                                            await window.CanteenDB.createProduct({
                                                name: p.name,
                                                category: p.category,
                                                price: p.price,
                                                stock: p.stock,
                                                img: p.img,
                                                available: true
                                            }).catch(err => console.warn("Cloud product creation warning", err));
                                        }
                                    }}
                                    onUpdateProduct={handleUpdateProduct}
                                    onArchiveProduct={handleArchiveProduct}
                                    onUnarchiveProduct={handleUnarchiveProduct}
                                    onAddNewStudent={(s) => { setRegisteredUsers([s, ...registeredUsers]); showToast(`Provisioned ${s.role || 'Account'} for ${s.name}!`); }}
                                    onUpdateStudent={handleUpdateStudent}
                                    onArchiveStudent={handleArchiveStudent}
                                    onUnarchiveStudent={handleUnarchiveStudent}
                                    onRestoreOrder={handleRestoreOrder}
                                    onRestoreBatch={handleRestoreBatch}
                                    onRestoreTopup={handleRestoreTopup}
                                    onPurgeItem={handlePurgeItem}
                                    activeTab={activeTab}
                                    setActiveTab={setActiveTab}
                                    onSignOut={() => setActiveRole('LOGIN')}
                                    onBackToRoleSelect={() => setActiveRole('LOGIN')}
                                    isCloudConnected={isCloudConnected}
                                    onRefreshCloud={syncCloudData}
                                    notifications={notifications}
                                    onMarkNotifRead={handleMarkNotificationRead}
                                    onMarkAllNotifRead={handleMarkAllNotificationsRead}
                                    rawIngredients={rawIngredients}
                                    setRawIngredients={setRawIngredients}
                                    setMenuCatalog={setMenuCatalog}
                                    kdsOrders={kdsOrders}
                                    setKdsOrders={setKdsOrders}
                                 />
                            )}
                        </React.Fragment>
                    )}
                    {/* MODAL: DUPLICATE GCASH REFERENCE WARNING */}
                    <CustomModal
                        isOpen={!!duplicateRefModalData}
                        onClose={() => setDuplicateRefModalData(null)}
                        title="Duplicate GCash Reference Number"
                        subtitle="Security Alert & Anti-Fraud Guardrail"
                        icon={Icon.AlertCircle}
                        iconBg="bg-rose-100 text-rose-700 border-rose-300"
                        size="md"
                    >
                        {duplicateRefModalData && (
                            <div className="space-y-4 text-xs">
                                <div className="p-3.5 bg-rose-50 border border-rose-200 rounded-2xl text-rose-900 space-y-2">
                                    <div className="flex items-center gap-2 font-bold text-sm text-rose-950">
                                        <Icon.Lock className="w-4 h-4 text-rose-600 shrink-0" />
                                        Reference Number Blocked
                                    </div>
                                    <p>The GCash reference number <code>{duplicateRefModalData.refNo}</code> has already been submitted for top-up verification.</p>
                                </div>

                                <div className="p-3 bg-slate-50 border border-slate-200 rounded-xl space-y-1.5 font-mono text-[11px]">
                                    <div className="flex justify-between text-slate-600">
                                        <span>Reference No:</span>
                                        <strong className="text-rose-700 font-bold">{duplicateRefModalData.refNo}</strong>
                                    </div>
                                    <div className="flex justify-between text-slate-600">
                                        <span>Attempted At:</span>
                                        <strong className="text-slate-800">{duplicateRefModalData.date}</strong>
                                    </div>
                                    <div className="flex justify-between text-slate-600">
                                        <span>System Policy:</span>
                                        <strong className="text-amber-800">1 Ref No = 1 Verification</strong>
                                    </div>
                                </div>

                                <p className="text-[11px] text-slate-500">
                                    Please double-check your GCash SMS/receipt confirmation. If you believe this is a system error, present your digital receipt to the canteen administrator.
                                </p>

                                <div className="pt-2 border-t border-slate-100">
                                    <ActionButton 
                                        variant="gold" 
                                        onClick={() => setDuplicateRefModalData(null)} 
                                        className="w-full py-2.5 font-bold"
                                    >
                                        I Understand
                                    </ActionButton>
                                </div>
                            </div>
                        )}
                    </CustomModal>

                    {/* MODAL: CLAIM TOKEN / QR GENERATOR FOR PRE-ORDERS & RELEASES */}
                    <CustomModal
                        isOpen={!!claimTokenModalData}
                        onClose={() => setClaimTokenModalData(null)}
                        title="Student Claim Token & QR Code"
                        subtitle="Present this QR or claim token at the POS cashier desk"
                        icon={Icon.QrCode}
                        iconBg="bg-emerald-50 text-emerald-700 border-emerald-200"
                        size="md"
                    >
                        {claimTokenModalData && (
                            <div className="space-y-4 text-xs text-center">
                                <div className="p-4 bg-slate-900 rounded-2xl text-white space-y-3 flex flex-col items-center justify-center">
                                    {/* SIMULATED QR CODE GRAPHIC */}
                                    <div className="w-36 h-36 bg-white p-3 rounded-xl shadow-lg flex items-center justify-center border-4 border-emerald-400">
                                        <div className="grid grid-cols-5 gap-1.5 w-full h-full">
                                            {[...Array(25)].map((_, i) => (
                                                <div 
                                                    key={i} 
                                                    className={`rounded-xs ${i % 2 === 0 || i % 7 === 0 ? 'bg-slate-900' : i % 3 === 0 ? 'bg-emerald-600' : 'bg-white'}`}
                                                />
                                            ))}
                                        </div>
                                    </div>
                                    <div className="font-mono text-lg font-bold tracking-widest text-emerald-400">
                                        {claimTokenModalData.token}
                                    </div>
                                </div>

                                <div className="p-3 bg-slate-50 border border-slate-200 rounded-xl space-y-1 text-left text-[11px]">
                                    <div className="flex justify-between">
                                        <span className="text-slate-500">Student:</span>
                                        <strong className="text-slate-900">{claimTokenModalData.studentName} ({claimTokenModalData.studentId})</strong>
                                    </div>
                                    <div className="flex justify-between">
                                        <span className="text-slate-500">Issued Date:</span>
                                        <strong className="text-slate-800">{claimTokenModalData.date}</strong>
                                    </div>
                                    <div className="flex justify-between text-emerald-800 font-semibold pt-1 border-t border-slate-200">
                                        <span>Status:</span>
                                        <span>Ready for Pickup</span>
                                    </div>
                                </div>

                                <div className="pt-2 border-t border-slate-100">
                                    <ActionButton 
                                        variant="primary" 
                                        onClick={() => setClaimTokenModalData(null)} 
                                        className="w-full py-2.5 font-bold"
                                    >
                                        Done / Close
                                    </ActionButton>
                                </div>
                            </div>
                        )}
                    </CustomModal>
                </React.Fragment>
            );
        }

        class ErrorBoundary extends React.Component {
            constructor(props) {
                super(props);
                this.state = { hasError: false, error: null, errorInfo: null };
            }
            static getDerivedStateFromError(error) {
                return { hasError: true, error };
            }
            componentDidCatch(error, errorInfo) {
                console.error("Uncaught runtime error caught by ErrorBoundary:", error, errorInfo);
                this.setState({ errorInfo });
            }
            render() {
                if (this.state.hasError) {
                    return (
                        <div className="min-h-screen bg-slate-900 text-white flex flex-col items-center justify-center p-6 text-center space-y-4 font-sans">
                            <div className="w-16 h-16 rounded-3xl bg-rose-500/20 text-rose-400 border border-rose-500/30 flex items-center justify-center text-3xl font-bold">
                                ⚠️
                            </div>
                            <h2 className="text-2xl font-bold font-outfit text-rose-400">Application Runtime Error Encountered</h2>
                            <p className="text-xs text-slate-300 max-w-lg bg-slate-950 p-4 rounded-xl font-mono text-left overflow-x-auto border border-slate-800">
                                {this.state.error ? this.state.error.toString() : "An unexpected error occurred in the component hierarchy."}
                            </p>
                            <button 
                                onClick={() => window.location.reload()} 
                                className="px-6 py-2.5 bg-brand-700 hover:bg-brand-800 text-white font-bold rounded-xl text-xs transition-all shadow-lg btn-press"
                            >
                                Reload Application
                            </button>
                        </div>
                    );
                }
                return this.props.children;
            }
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(
            <ErrorBoundary>
                <UnifiedNovaLunchApp />
            </ErrorBoundary>
        );
    </script>
</body>
</html>
