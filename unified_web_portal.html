            darkMode: 'class',
            theme: {

                    colors: {
                        brand: {
                            950: '#1D0507',

                            100: '#FDF2F3',
                            50: '#FFF7F7',

                            700: '#92400E',
                            600: '#B45309',
                            500: '#D97706',
                            100: '#FEF3C7',
                            50: '#FFFBEB',

                        slate: {
                            850: '#0F172A',
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                        outfit: ['Outfit', 'sans-serif'],
                    },
                    boxShadow: {
                        'subtle': '0 1px 2px 0 rgba(15, 23, 42, 0.03), 0 1px 3px 1px rgba(15, 23, 42, 0.02)',

    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body {
            background-color: #F8FAFC;
            color: #0F172A;
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        .font-outfit {
            font-family: 'Outfit', sans-serif;
        }
        /* iOS-style thin scrollbar */
        ::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(148, 163, 184, 0.35);
            border-radius: 9999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(148, 163, 184, 0.6);
        }
        /* Enterprise card — iOS Light Glassmorphism surface */
        .enterprise-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(226, 232, 240, 0.8);
            box-shadow: 0 4px 16px -2px rgba(15, 23, 42, 0.04), 0 1px 3px 0 rgba(15, 23, 42, 0.02);
            border-radius: 20px;
            transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }
        .enterprise-card:hover {
            background: rgba(255, 255, 255, 0.95);
            border-color: rgba(203, 213, 225, 0.95);
            box-shadow: 0 12px 32px -4px rgba(15, 23, 42, 0.08), 0 2px 8px -2px rgba(15, 23, 42, 0.03);
            transform: translateY(-2px);
        }
        /* iOS modal animations */
        .modal-backdrop {
            animation: fadeIn 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
        }
        .modal-content {
            animation: springUp 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; backdrop-filter: blur(0px); }
            to { opacity: 1; backdrop-filter: blur(8px); }
        }
        @keyframes springUp {
            from { opacity: 0; transform: translateY(24px) scale(0.92); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        /* iOS-style press feedback */
        .btn-press {
            transition: all 0.2s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }
        .btn-press:active {
            transform: scale(0.96);
            opacity: 0.85;
        }
        /* Focus ring */
        *:focus-visible {
            outline: 2px solid #7B1E22;
            outline-offset: 2px;
        }
        /* iOS toggle switch */
        .ios-toggle {
            appearance: none;
            -webkit-appearance: none;
            width: 48px;
            height: 28px;
            border-radius: 9999px;
            background: #CBD5E1;
            position: relative;
            cursor: pointer;
            transition: background 0.25s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            flex-shrink: 0;
        }
        .ios-toggle::before {
            content: '';
            position: absolute;
            top: 2px;
            left: 2px;
            width: 24px;
            height: 24px;
            border-radius: 9999px;
            background: white;
            box-shadow: 0 2px 6px rgba(0,0,0,0.15), 0 0 1px rgba(0,0,0,0.1);
            transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .ios-toggle:checked {
            background: #7B1E22;
        }
        .ios-toggle:checked::before {
            transform: translateX(20px);
        }
        /* Subtle card spring entrance */
        @keyframes cardIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-card-in {
            animation: cardIn 0.35s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
        }
        /* iOS-style section group */
        .ios-section {
            background: #FFFFFF;
            border: 1px solid rgba(226, 232, 240, 0.8);
            border-radius: 20px;
            overflow: hidden;
        }
        .ios-section > div + div {
            border-top: 1px solid rgba(226, 232, 240, 0.6);
        }
        /* Smooth input transitions */
        input, select, textarea {
            transition: border-color 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
        }
        /* ================================================================= */
        /* POS MODULE — 2026 UI/UX ENHANCEMENT UTILITIES                     */
        /* ================================================================= */

        /* Near-expiry amber pulse animation */
        @keyframes pulseAmber {
            0%, 100% { box-shadow: 0 0 0 0 rgba(217, 119, 6, 0.25); }
            50% { box-shadow: 0 0 0 6px rgba(217, 119, 6, 0); }
        }
        .pulse-amber {
            animation: pulseAmber 2.5s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }

        /* RFID contactless ring expansion */
        @keyframes contactlessRing {
            0% { transform: scale(0.85); opacity: 0.6; }
            50% { transform: scale(1.15); opacity: 0; }
            100% { transform: scale(0.85); opacity: 0.6; }
        }
        .contactless-ring::after {
            content: '';
            position: absolute;
            inset: -6px;
            border: 2px solid rgba(123, 30, 34, 0.3);
            border-radius: 9999px;
            animation: contactlessRing 2s ease-in-out infinite;
            pointer-events: none;
        }

        /* POS Checkout Sidebar — frosted glass surface */
        .pos-sidebar {
            background: rgba(255, 255, 255, 0.72);
            backdrop-filter: blur(24px) saturate(1.5);
            -webkit-backdrop-filter: blur(24px) saturate(1.5);
            border-left: 1px solid rgba(226, 232, 240, 0.6);
            box-shadow: inset 1px 0 0 rgba(255, 255, 255, 0.5);
        }

        /* POS Product card — enhanced hover lift */
        .product-card-pos {
            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(226, 232, 240, 0.7);
            box-shadow: 0 2px 8px -2px rgba(15, 23, 42, 0.04);
            border-radius: 20px;
            transition: all 0.25s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }
        .product-card-pos:hover {
            background: rgba(255, 255, 255, 0.97);
            border-color: rgba(203, 213, 225, 0.9);
            box-shadow: 0 8px 24px -4px rgba(15, 23, 42, 0.08), 0 2px 6px -1px rgba(15, 23, 42, 0.03);
            transform: translateY(-2px) scale(1.005);
        }

        /* POS Checkout total glow */
        .pos-total-glow {
            background: linear-gradient(135deg, rgba(123, 30, 34, 0.04) 0%, rgba(217, 119, 6, 0.03) 100%);
            border: 1px solid rgba(123, 30, 34, 0.08);
            border-radius: 16px;
        }

        /* POS Cash denomination quick-tap button */
        .cash-denom-btn {
            transition: all 0.15s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            border: 1px solid rgba(226, 232, 240, 0.8);
            background: white;
            border-radius: 10px;
        }
        .cash-denom-btn:hover {
            border-color: rgba(123, 30, 34, 0.3);
            background: rgba(123, 30, 34, 0.03);
            transform: translateY(-1px);
        }
        .cash-denom-btn:active {
            transform: scale(0.95);
        }

        /* POS Segmented control container */
        .pos-segment-control {
            background: rgba(241, 245, 249, 0.8);
            border: 1px solid rgba(226, 232, 240, 0.6);
            border-radius: 16px;
            padding: 4px;
        }

        /* POS Cart item row */
        .pos-cart-item {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(226, 232, 240, 0.6);
            border-radius: 16px;
            transition: all 0.2s ease;
        }
        .pos-cart-item:hover {
            background: rgba(255, 255, 255, 0.9);
            border-color: rgba(203, 213, 225, 0.8);
        }

        /* Delete icon rotation on hover */
        .pos-delete-btn {
            transition: all 0.2s ease;
        }
        .pos-delete-btn:hover {
            color: #E11D48;
            transform: rotate(8deg) scale(1.1);
        }

        /* Checkout CTA glow when ready */
        .pos-checkout-ready {
            box-shadow: 0 4px 20px -4px rgba(123, 30, 34, 0.35), 0 2px 8px -2px rgba(123, 30, 34, 0.15);
        }
        .pos-checkout-ready:hover {
            box-shadow: 0 6px 28px -4px rgba(123, 30, 34, 0.45), 0 4px 12px -2px rgba(123, 30, 34, 0.2);
        }

        /* POS Customer bar glassmorphism */
        .pos-customer-bar {
            background: rgba(255, 255, 255, 0.82);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(226, 232, 240, 0.7);
            box-shadow: 0 2px 12px -2px rgba(15, 23, 42, 0.05);
            border-radius: 20px;
            transition: all 0.25s ease;
        }

        /* RFID shortage left-accent callout */
        .pos-alert-accent {
            border-left: 4px solid;
            border-radius: 0 12px 12px 0;
        }

        @media print {
            body * { visibility: hidden; }
            #printableReceipt, #printableReceipt * { visibility: visible; }
            #printableReceipt { position: absolute; left: 0; top: 0; width: 100%; color: #000; background: #fff; }
        }
    </style>
</head>

            if (!isOpen) return null;

                    case 'account_created': return { bg: 'bg-purple-100 text-purple-900 border-purple-300', label: 'Account' };

            return (
                <div className="absolute right-0 top-12 w-80 sm:w-96 bg-white/95 backdrop-blur-xl border border-slate-200/80 rounded-3xl shadow-elevated z-50 overflow-hidden animate-in fade-in duration-200">

                            {unreadCount > 0 && <span className="bg-brand-700 text-white text-[10px] font-bold px-2 py-0.5 rounded-full">{unreadCount} New</span>}
                        </div>
                        <div className="flex items-center gap-2">
                            {unreadCount > 0 && (
                                <button onClick={onMarkAllRead} className="text-xs text-amber-300 hover:underline font-medium">Mark all read</button>
                            )}

                        </div>
                    </div>

                    <div className="p-2.5 bg-slate-50/80 border-b border-slate-200/60 flex gap-1.5 text-[11px] font-bold">

                        {filteredNotifs.length === 0 ? (
                            <div className="p-6 text-center text-slate-400 space-y-1">
                                <Icon.Bell className="w-8 h-8 mx-auto opacity-30" />

                        ) : (
                            filteredNotifs.map(n => {
                                const badge = getTypeBadge(n.type);

                                    <div key={n.id} onClick={() => onMarkRead(n.id)} className={`p-3.5 hover:bg-slate-50 transition-colors cursor-pointer flex items-start gap-3 ${!n.is_read ? 'bg-brand-50/30' : ''}`}>

                                            <div className="flex justify-between items-start gap-2">
                                                <h4 className="font-outfit font-bold text-xs text-slate-900 leading-tight">{n.title}</h4>
                                                <span className={`text-[9px] font-bold px-1.5 py-0.5 rounded border ${badge.bg}`}>{badge.label}</span>
                                            </div>
                                            <p className="text-[11px] text-slate-600 leading-normal">{n.message}</p>
                                            <div className="text-[9px] text-slate-400 font-mono pt-0.5">{n.created_at || 'Just now'}</div>
                                        </div>
                                    </div>
                                );
                            })
                        )}
                    </div>
                </div>
            );
        }

        // =====================================================================
        // STREAMLINED MULTI-ROLE PUBLIC ACCOUNT CREATION MODAL
        // =====================================================================
        function CreateAccountModal({ isOpen, onClose, onRegisterSuccess, registeredUsers = [] }) {
            const [roleTab, setRoleTab] = useState('STUDENT'); // 'STUDENT' | 'PARENT'
            const [regStep, setRegStep] = useState(1);
            const [firstName, setFirstName] = useState('');
            const [lastName, setLastName] = useState('');
            const [email, setEmail] = useState('');
            const [password, setPassword] = useState('');
            const [confirmPassword, setConfirmPassword] = useState('');
            const [showPassword, setShowPassword] = useState(false);
            const [showConfirmPassword, setShowConfirmPassword] = useState(false);
            const [studentIdNumber, setStudentIdNumber] = useState('');
            const [rfidUid, setRfidUid] = useState('');
            const [phone, setPhone] = useState('');

            const [errorMsg, setErrorMsg] = useState('');
            const [isSubmitting, setIsSubmitting] = useState(false);

            if (!isOpen) return null;

            const handleNextStep = () => {
                setErrorMsg('');
                if (regStep === 1) {
                    if (!firstName.trim()) return setErrorMsg('First Name is required.');
                    if (!lastName.trim()) return setErrorMsg('Last Name is required.');
                    setRegStep(2);
                } else if (regStep === 2) {
                    const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                    if (!emailRegex.test(email.trim())) return setErrorMsg('Please enter a valid email address.');
                    if (roleTab === 'STUDENT' && !studentIdNumber.trim()) return setErrorMsg('Student ID Number is required.');
                    if (roleTab === 'PARENT' && !phone.trim()) return setErrorMsg('Contact mobile number is required.');
                    setRegStep(3);
                }
            };

            const handlePrevStep = () => {
                setErrorMsg('');
                setRegStep(prev => Math.max(prev - 1, 1));
            };

            const handleRegisterSubmit = async (e) => {
                if (e) e.preventDefault();
                setErrorMsg('');

                if (!firstName.trim() || !lastName.trim()) {
                    setErrorMsg('First Name and Last Name are required.');
                    setRegStep(1);
                    return;
                }

                const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                if (!emailRegex.test(email.trim())) {
                    setErrorMsg('Please enter a valid email address.');
                    setRegStep(2);
                    return;
                }

                if (password.length < 6) {
                    setErrorMsg('Password must be at least 6 characters long.');
                    setRegStep(3);
                    return;
                }
                if (password !== confirmPassword) {
                    setErrorMsg('Account passwords do not match.');
                    setRegStep(3);
                    return;
                }

                const emailExists = registeredUsers.some(u => u.email?.toLowerCase() === email.trim().toLowerCase());
                if (emailExists) {
                    setErrorMsg('An account with this email address is already registered.');
                    setRegStep(2);
                    return;
                }

                if (roleTab === 'STUDENT') {
                    if (!studentIdNumber.trim()) {
                        setErrorMsg('Student ID number is required (e.g., 2026-01900).');
                        setRegStep(2);
                        return;
                    }
                    const idExists = registeredUsers.some(u => u.studentId === studentIdNumber.trim());
                    if (idExists) {
                        setErrorMsg(`Student ID ${studentIdNumber} is already registered.`);
                        setRegStep(2);
                        return;
                    }
                } else if (roleTab === 'PARENT') {
                    if (!phone.trim()) {
                        setErrorMsg('Contact mobile phone number is required.');
                        setRegStep(2);
                        return;
                    }
                }

                setIsSubmitting(true);

                try {
                    const fullName = `${firstName.trim()} ${lastName.trim()}`;
                    const finalRole = roleTab === 'STUDENT' ? 'student' : 'parent';
                    const finalRfid = (roleTab === 'STUDENT' && rfidUid.trim()) ? rfidUid.trim() : null;
                    const userPayload = {
                        email: email.trim(),
                        full_name: fullName,
                        first_name: firstName.trim(),
                        last_name: lastName.trim(),
                        role: finalRole,
                        student_id_number: roleTab === 'STUDENT' ? studentIdNumber.trim() : null,
                        rfid_uid: finalRfid,
                        phone: roleTab === 'PARENT' ? phone.trim() : null
                    };

                    let newProfile;
                    if (window.CanteenDB) {
                        try {
                            newProfile = await window.CanteenDB.registerUser(userPayload);
                        } catch(err) {
                            console.warn("Cloud registration fallback to local state", err);
                        }
                    }

                    const localUser = {
                        id: newProfile?.id || "u_" + Date.now(),
                        studentId: roleTab === 'STUDENT' ? studentIdNumber.trim() : ('PAR-' + Math.floor(1000 + Math.random() * 9000)),
                        name: fullName,
                        firstName: firstName.trim(),
                        lastName: lastName.trim(),
                        email: email.trim(),
                        phone: phone.trim(),
                        role: finalRole === 'student' ? 'Student' : 'Parent',
                        rfidUid: finalRfid,
                        dailyCap: 200.00,
                        balance: 0.00,
                        status: 'active'
                    };

                    onRegisterSuccess(localUser);
                    onClose();
                } catch(err) {
                    setErrorMsg(`Registration Error: ${err.message}`);
                } finally {
                    setIsSubmitting(false);
                }
            };

            return (
                <CustomModal 
                    isOpen={isOpen} 
                    onClose={onClose} 
                    title="Account Registration Wizard" 
                    subtitle="Set up your Saint Joseph College NovaLunch account" 
                    icon={Icon.UserPlus} 
                    iconBg="bg-brand-50 text-brand-700 border-brand-200" 
                    size="lg"
                >
                    <div className="space-y-4">
                        {/* STEPPER PROGRESS BAR */}
                        <div className="grid grid-cols-3 gap-1.5 p-1 bg-slate-100 rounded-xl border border-slate-200 text-xs">
                            <button type="button" onClick={() => setRegStep(1)} className={`py-1.5 px-2 rounded-lg font-bold transition-all flex items-center justify-center gap-1.5 ${regStep === 1 ? 'bg-brand-700 text-white shadow-xs' : 'text-slate-600 hover:bg-slate-200'}`}>
                                <span className="w-4 h-4 rounded-full bg-black/10 flex items-center justify-center text-[10px] font-mono">1</span> Identity
                            </button>
                            <button type="button" onClick={() => { if (firstName && lastName) setRegStep(2); }} className={`py-1.5 px-2 rounded-lg font-bold transition-all flex items-center justify-center gap-1.5 ${regStep === 2 ? 'bg-brand-700 text-white shadow-xs' : 'text-slate-600 hover:bg-slate-200'}`}>
                                <span className="w-4 h-4 rounded-full bg-black/10 flex items-center justify-center text-[10px] font-mono">2</span> ID & Contact
                            </button>
                            <button type="button" onClick={() => { if (firstName && lastName && email) setRegStep(3); }} className={`py-1.5 px-2 rounded-lg font-bold transition-all flex items-center justify-center gap-1.5 ${regStep === 3 ? 'bg-brand-700 text-white shadow-xs' : 'text-slate-600 hover:bg-slate-200'}`}>
                                <span className="w-4 h-4 rounded-full bg-black/10 flex items-center justify-center text-[10px] font-mono">3</span> Security
                            </button>
                        </div>

                        {errorMsg && (
                            <div className="p-3 bg-rose-50 border border-rose-200 rounded-xl text-rose-800 text-xs flex items-center gap-2.5 animate-in fade-in duration-150">
                                <Icon.AlertCircle className="w-4 h-4 shrink-0 text-rose-600" />
                                <span className="font-semibold">{errorMsg}</span>
                            </div>
                        )}

                        <form onSubmit={handleRegisterSubmit} className="space-y-4">
                            {/* STEP 1: IDENTITY & ROLE */}
                            {regStep === 1 && (
                                <div className="space-y-3 animate-in fade-in duration-150">
                                    <div>
                                        <label className="block text-xs font-semibold text-slate-700 mb-1.5">Select Account Role</label>
                                        <div className="grid grid-cols-2 gap-2 p-1 bg-slate-100 rounded-xl border border-slate-200">
                                            <button type="button" onClick={() => { setRoleTab('STUDENT'); setErrorMsg(''); }} className={`py-2 px-3 rounded-lg text-xs font-bold transition-all flex items-center justify-center gap-1.5 ${roleTab === 'STUDENT' ? 'bg-brand-700 text-white shadow-xs' : 'text-slate-600 hover:text-slate-900'}`}>
                                                <Icon.GraduationCap className="w-3.5 h-3.5" /> Student Account
                                            </button>
                                            <button type="button" onClick={() => { setRoleTab('PARENT'); setErrorMsg(''); }} className={`py-2 px-3 rounded-lg text-xs font-bold transition-all flex items-center justify-center gap-1.5 ${roleTab === 'PARENT' ? 'bg-brand-700 text-white shadow-xs' : 'text-slate-600 hover:text-slate-900'}`}>
                                                <Icon.Users className="w-3.5 h-3.5" /> Parent / Guardian
                                            </button>
                                        </div>
                                    </div>
                                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                        <div>
                                            <label className="block text-xs font-semibold text-slate-700 mb-1">First Name <span className="text-rose-600">*</span></label>
                                            <input type="text" required placeholder="e.g. Juan" value={firstName} onChange={e => setFirstName(e.target.value)} className="w-full bg-slate-50 border border-slate-200 rounded-lg px-3 py-2 text-xs font-medium focus:bg-white" />
                                        </div>
                                        <div>
                                            <label className="block text-xs font-semibold text-slate-700 mb-1">Last Name <span className="text-rose-600">*</span></label>
                                            <input type="text" required placeholder="e.g. Dela Cruz" value={lastName} onChange={e => setLastName(e.target.value)} className="w-full bg-slate-50 border border-slate-200 rounded-lg px-3 py-2 text-xs font-medium focus:bg-white" />
                                        </div>
                                    </div>
                                </div>
                            )}

                            {/* STEP 2: ID & CONTACT */}
                            {regStep === 2 && (
                                <div className="space-y-3 animate-in fade-in duration-150">
                                    <div>
                                        <label className="block text-xs font-semibold text-slate-700 mb-1">Email Address <span className="text-rose-600">*</span></label>
                                        <input type="email" required placeholder={roleTab === 'STUDENT' ? "e.g. juan@sjc.edu.ph" : "e.g. parent@gmail.com"} value={email} onChange={e => setEmail(e.target.value)} className="w-full bg-slate-50 border border-slate-200 rounded-lg px-3 py-2 text-xs font-medium focus:bg-white" />
                                    </div>

                                    {roleTab === 'STUDENT' && (
                                        <div className="space-y-3 p-3 bg-brand-50/50 rounded-xl border border-brand-100">
                                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                                <div>
                                                    <label className="block text-xs font-semibold text-brand-900 mb-1">Student ID Number <span className="text-rose-600">*</span></label>
                                                    <input type="text" required placeholder="e.g. 2026-01900" value={studentIdNumber} onChange={e => setStudentIdNumber(e.target.value)} className="w-full bg-white border border-brand-200 rounded-lg px-3 py-2 text-xs font-mono font-bold text-brand-950" />
                                                </div>
                                                <div>
                                                    <label className="block text-xs font-semibold text-brand-900 mb-1">RFID Badge UID <span className="text-slate-400">(optional)</span></label>
                                                    <div className="relative">
                                                        <input type="text" placeholder="e.g. 9A-4F-21-C8" value={rfidUid} onChange={e => setRfidUid(e.target.value)} className={`w-full bg-white border rounded-lg px-3 py-2 text-xs font-mono text-slate-900 pl-8 ${rfidUid ? 'border-emerald-300 focus:ring-emerald-200' : 'border-amber-300'}`} />
                                                        <div className="absolute left-2.5 top-2.5">
                                                            {rfidUid ? <Icon.CheckCircle className="w-3.5 h-3.5 text-emerald-600" /> : <Icon.AlertCircle className="w-3.5 h-3.5 text-amber-500" />}
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>
                                            {!rfidUid && (
                                                <div className="flex items-start gap-2 p-2.5 bg-amber-50 border border-amber-200 rounded-lg">
                                                    <Icon.AlertTriangle className="w-4 h-4 text-amber-600 shrink-0 mt-0.5" />
                                                    <p className="text-[11px] text-amber-900 leading-relaxed">
                                                        <strong>No RFID badge entered.</strong> Account will be registered but <strong>requires an Admin or Cashier to assign an RFID card</strong> for tap payments.
                                                    </p>
                                                </div>
                                            )}
                                        </div>
                                    )}

                                    {roleTab === 'PARENT' && (
                                        <div className="p-3 bg-amber-50/50 rounded-xl border border-amber-100">
                                            <label className="block text-xs font-semibold text-amber-900 mb-1">Mobile Phone Number (for Top-Up alerts) <span className="text-rose-600">*</span></label>
                                            <input type="tel" required placeholder="e.g. 09171234567" value={phone} onChange={e => setPhone(e.target.value)} className="w-full bg-white border border-amber-200 rounded-lg px-3 py-2 text-xs font-medium text-slate-900" />
                                        </div>
                                    )}
                                </div>
                            )}

                            {/* STEP 3: SECURITY & CONFIRMATION */}
                            {regStep === 3 && (
                                <div className="space-y-3 animate-in fade-in duration-150">
                                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                        <div>
                                            <label className="block text-xs font-semibold text-slate-700 mb-1">Account Password (min 6 chars)</label>
                                            <div className="relative">
                                                <input type={showPassword ? "text" : "password"} required placeholder="••••••••" value={password} onChange={e => setPassword(e.target.value)} className="w-full bg-slate-50 border border-slate-200 rounded-lg px-3 py-2 text-xs font-medium focus:bg-white pr-9" />
                                                <button type="button" onClick={() => setShowPassword(!showPassword)} className="absolute right-2.5 top-2 text-slate-400 hover:text-slate-700">
                                                    {showPassword ? <Icon.EyeOff className="w-4 h-4" /> : <Icon.Eye className="w-4 h-4" />}
                                                </button>
                                            </div>
                                        </div>
                                        <div>
                                            <label className="block text-xs font-semibold text-slate-700 mb-1">Confirm Password</label>
                                            <div className="relative">
                                                <input type={showConfirmPassword ? "text" : "password"} required placeholder="••••••••" value={confirmPassword} onChange={e => setConfirmPassword(e.target.value)} className="w-full bg-slate-50 border border-slate-200 rounded-lg px-3 py-2 text-xs font-medium focus:bg-white pr-9" />
                                                <button type="button" onClick={() => setShowConfirmPassword(!showConfirmPassword)} className="absolute right-2.5 top-2 text-slate-400 hover:text-slate-700">
                                                    {showConfirmPassword ? <Icon.EyeOff className="w-4 h-4" /> : <Icon.Eye className="w-4 h-4" />}
                                                </button>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            )}

                            {/* STEPPER NAVIGATION FOOTER */}
                            <div className="pt-3 border-t border-slate-100 flex items-center justify-between">
                                {regStep > 1 ? (
                                    <ActionButton type="button" variant="secondary" onClick={handlePrevStep} className="px-4 py-2">
                                        Back
                                    </ActionButton>
                                ) : (
                                    <ActionButton type="button" variant="secondary" onClick={onClose} className="px-4 py-2">
                                        Cancel
                                    </ActionButton>
                                )}

                                {regStep < 3 ? (
                                    <ActionButton type="button" variant="primary" onClick={handleNextStep} className="px-5 py-2 font-bold">
                                        Next Step
                                    </ActionButton>
                                ) : (
                                    <ActionButton type="submit" variant="primary" disabled={isSubmitting} className="px-5 py-2 font-bold">
                                        {isSubmitting ? 'Registering Account...' : `Complete ${roleTab.charAt(0) + roleTab.slice(1).toLowerCase()} Registration`}
                                    </ActionButton>
                                )}
                            </div>
                        </form>
                    </div>
                </CustomModal>
            );
        }

        // =====================================================================
        // CSV EXPORTER UTILITY
        // =====================================================================
        const exportToCSV = (dataArray, filename = 'novalunch_export.csv') => {
            if (!dataArray || !dataArray.length) return;
            const headers = Object.keys(dataArray[0]).join(',');
            const rows = dataArray.map(obj => Object.values(obj).map(val => `"${String(val !== null && val !== undefined ? val : '').replace(/"/g, '""')}"`).join(','));
            const csvContent = "data:text/csv;charset=utf-8," + [headers, ...rows].join("\n");
            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", filename);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        };

        // =====================================================================

        // =====================================================================
        function LinkStudentModal({ isOpen, onClose, onSendLinkRequest, registeredUsers = [] }) {
            const [studentIdInput, setStudentIdInput] = useState('');
            const [errorMsg, setErrorMsg] = useState('');
            const [isSubmitting, setIsSubmitting] = useState(false);

            if (!isOpen) return null;

            const handleSubmit = async (e) => {
                e.preventDefault();
                setErrorMsg('');

                if (!studentIdInput.trim()) {
                    return setErrorMsg('Please enter Student ID Number or Student Email.');
                }

                setIsSubmitting(true);
                try {
                    await onSendLinkRequest(studentIdInput.trim());
                    setStudentIdInput('');
                    onClose();
                } catch(err) {
                    setErrorMsg(err.message || 'Failed to send link request.');
                } finally {
                    setIsSubmitting(false);
                }
            };

            return (
                <CustomModal 
                    isOpen={isOpen} 
                    onClose={onClose} 
                    title="Link Student Account"

                    size="md"

            const [selectedCategory, setSelectedCategory] = useState('All');
            const [searchQuery, setSearchQuery] = useState('');
            const [selectedStudent, setSelectedStudent] = useState(registeredUsers[0] || null);
            const [paymentMethod, setPaymentMethod] = useState('rfid');
            const [cashTendered, setCashTendered] = useState('');
            const [qrClaimInput, setQrClaimInput] = useState('');

            // Discount Engine State (Student 5%, Senior/PWD 20%, Custom ₱)
            const [discountType, setDiscountType] = useState('NONE'); // 'NONE' | 'STUDENT' | 'SENIOR_PWD' | 'CUSTOM'
            const [customDiscountInput, setCustomDiscountInput] = useState('');

            // Modals

            const [rfidModalOpen, setRfidModalOpen] = useState(false);
            const [receiptModalOpen, setReceiptModalOpen] = useState(false);

            const [selectedOrderToVoid, setSelectedOrderToVoid] = useState(null);
            const [voidManagerPinInput, setVoidManagerPinInput] = useState('');
            const [voidManagerPinError, setVoidManagerPinError] = useState('');

            // Tab Settlement Modal State
            const [settleModalOpen, setSettleModalOpen] = useState(false);
            const [settleAmountInput, setSettleAmountInput] = useState('');
            const [settlePaymentMethod, setSettlePaymentMethod] = useState('cash'); // 'cash' | 'rfid'
            const [settleError, setSettleError] = useState('');

            const [nearExpiryModalItem, setNearExpiryModalItem] = useState(null);
            const [lastCompletedOrder, setLastCompletedOrder] = useState(null);

            // Pay Later & Manager PIN Override State (FR-07)
            const [managerPinModalOpen, setManagerPinModalOpen] = useState(false);
            const [managerPinInput, setManagerPinInput] = useState('');
            const [payLaterNote, setPayLaterNote] = useState('');
            const [managerPinError, setManagerPinError] = useState('');

            // RFID Lookup state (125kHz EM4100 Format)
            const [rfidScanInput, setRfidScanInput] = useState('');
            const [rfidLookupInput, setRfidLookupInput] = useState('');
            const [rfidScanResult, setRfidScanResult] = useState(null);  // matched student
            const [rfidScanError, setRfidScanError] = useState('');
            const [rfidLookupMode, setRfidLookupMode] = useState('scan');  // 'scan' | 'manual'

            // Global Hardware 125kHz USB RFID Reader Keystroke Wedge Handler
            useEffect(() => {
                let rfidBuffer = '';
                let lastKeyTime = Date.now();

                const handleGlobalRfidKey = (e) => {
                    const tagName = e.target ? e.target.tagName.toUpperCase() : '';
                    if (tagName === 'INPUT' || tagName === 'TEXTAREA' || (e.target && e.target.isContentEditable)) {
                        return;
                    }

                    const now = Date.now();
                    if (now - lastKeyTime > 400) {
                        rfidBuffer = '';
                    }
                    lastKeyTime = now;

                    if (e.key === 'Enter') {
                        if (rfidBuffer.length >= 4) {
                            console.log('[GLOBAL 125kHz RFID HARDWARE TAP]:', rfidBuffer);
                            const rawScanned = rfidBuffer.trim();
                            rfidBuffer = '';
                            
                            // Lookup matched student
                            const normQuery = rawScanned.replace(/^0+/, '').toUpperCase();
                            const matched = registeredUsers.find(u => {
                                if (!u.rfidUid) return false;
                                const uRaw = u.rfidUid.toString().trim().toUpperCase();
                                const uNorm = uRaw.replace(/^0+/, '');
                                return uRaw === rawScanned.toUpperCase() || uNorm === normQuery;
                            });

                            if (matched) {
                                setSelectedStudent(matched);
                                setRfidScanResult(matched);
                                setRfidModalOpen(false);
                                speakWebText(`RFID card verified for ${matched.name}.`);
                            } else {
                                setRfidScanError(`Unregistered 125kHz Card UID: "${rawScanned}"`);
                                setRfidModalOpen(true);
                                speakWebText(`Warning! Unregistered RFID card.`);
                            }
                        }
                        rfidBuffer = '';
                    } else if (e.key && e.key.length === 1 && /[0-9a-zA-Z]/.test(e.key)) {
                        rfidBuffer += e.key;
                    }
                };

                window.addEventListener('keydown', handleGlobalRfidKey);
                return () => window.removeEventListener('keydown', handleGlobalRfidKey);
            }, [registeredUsers]);

            const categories = ['All', 'Meals & Mains', 'Beverages', 'Snacks & Bakery', 'Fruits & Healthy'];
            const filteredMenu = menuCatalog.filter(i => (selectedCategory === 'All' || i.category === selectedCategory) && i.name.toLowerCase().includes(searchQuery.toLowerCase()) && i.available !== false);

            // Dynamic Discount Calculation Engine
            const cartSubtotal = posCart.reduce((sum, i) => sum + (i.price * i.qty), 0);
            let discountAmount = 0;
            let discountLabel = 'None (0%)';

            if (discountType === 'STUDENT' || discountType === 'STUDENT_10') {
                discountAmount = cartSubtotal * 0.10; // 10% Student Discount
                discountLabel = 'Student (10%)';
            } else if (discountType === 'SENIOR_PWD' || discountType === 'SENIOR_20') {
                discountAmount = cartSubtotal * 0.20; // 20% Senior/PWD Discount
                discountLabel = 'Senior/PWD (20%)';
            } else if (discountType === 'CUSTOM') {
                const customVal = parseFloat(customDiscountInput) || 0;
                discountAmount = Math.min(cartSubtotal, customVal);
                discountLabel = `Custom (₱${discountAmount.toFixed(2)})`;
            }

            const netTotal = Math.max(0, cartSubtotal - discountAmount);
            const currentStudentBalance = selectedStudent ? selectedStudent.balance : 0;
            const isRfidShortage = paymentMethod === 'rfid' && netTotal > currentStudentBalance;
            const cashTenderedVal = parseFloat(cashTendered) || 0;
            const cashChange = cashTenderedVal - netTotal;

            // Check if cart contains any restricted items for selected student
            const hasDietaryConflict = selectedStudent && selectedStudent.allergies && selectedStudent.allergies.length > 0 && posCart.some(cartItem => {
                const menuItem = menuCatalog.find(m => m.id === cartItem.id);
                return menuItem && menuItem.allergens && menuItem.allergens.some(alg => selectedStudent.allergies.includes(alg));
            });

            const handleSimulateAiScan = () => {
                const burger = menuCatalog.find(m => m.id === 'p1') || menuCatalog[0];
                const juice = menuCatalog.find(m => m.id === 'p5') || menuCatalog[1];
                if (burger) onAddToCart(burger);
                if (juice) onAddToCart(juice);
                setAiModalOpen(false);
            };

            // RFID scan: match by UID first (with zero-padding normalization), fallback to student ID, error if no RFID enrolled
            const handleRfidScan = (e, overrideInput = null) => {
                e && e.preventDefault && e.preventDefault();
                setRfidScanError('');
                setRfidScanResult(null);
                const rawQuery = (overrideInput || rfidScanInput).trim();
                if (!rawQuery) return setRfidScanError('Please scan or enter an RFID UID.');

                const normQuery = rawQuery.replace(/^0+/, '').toUpperCase();

                // Match by RFID UID (supporting 10-digit 125kHz leading zero variations)
                const byUid = registeredUsers.find(u => {
                    if (!u.rfidUid) return false;
                    const uRaw = u.rfidUid.toString().trim().toUpperCase();
                    const uNorm = uRaw.replace(/^0+/, '');
                    return uRaw === rawQuery.toUpperCase() || uNorm === normQuery;
                });

                if (byUid) {
                    setRfidScanResult(byUid);
                    return byUid;
                }

                // Fallback check by Student ID
                const byStudentId = registeredUsers.find(u => u.studentId && u.studentId.toUpperCase() === rawQuery.toUpperCase());
                if (byStudentId) {
                    if (!byStudentId.rfidUid) {
                        setRfidScanError(`Student "${byStudentId.name}" (${byStudentId.studentId}) has NO RFID badge enrolled. Use manual lookup or switch to Cash/QR payment.`);
                        return null;
                    }
                    setRfidScanResult(byStudentId);
                    return byStudentId;
                }

                setRfidScanError(`No student account found matching RFID UID "${rawQuery}". The card may not be registered in the system.`);
                return null;
            };

            const handleRfidManualLookup = (e) => {
                e && e.preventDefault && e.preventDefault();
                setRfidScanError('');
                setRfidScanResult(null);
                const query = rfidLookupInput.trim();
                if (!query) return setRfidScanError('Enter Student ID or full name to look up.');

                const match = registeredUsers.find(u =>
                    (u.studentId && u.studentId.toLowerCase() === query.toLowerCase()) ||
                    (u.name && u.name.toLowerCase().includes(query.toLowerCase())) ||
                    (u.email && u.email.toLowerCase() === query.toLowerCase())
                );

                if (!match) return setRfidScanError(`No student found for "${query}". Check spelling or Student ID.`);

                if (!match.rfidUid) {
                    // Student found but no RFID — allow selection but flag as unlinked
                    setRfidScanResult({ ...match, _noRfid: true });
                    return;
                }

                setRfidScanResult(match);
            };

            const handleConfirmRfidStudent = () => {
                if (!rfidScanResult) return;
                setSelectedStudent(rfidScanResult);
                setRfidScanInput('');
                setRfidLookupInput('');
                setRfidScanResult(null);
                setRfidScanError('');
                setRfidModalOpen(false);
                // If student has no RFID, auto-switch payment to cash
                if (rfidScanResult._noRfid) setPaymentMethod('cash');
            };

            const handleFulfillQrClaim = (e) => {
                e && e.preventDefault && e.preventDefault();
                const tokenStr = (qrClaimInput || '').trim();
                if (!tokenStr) return alert("Please enter or scan a valid QR Claim Token.");

                if (onClaimPreorderPos) {
                    onClaimPreorderPos(tokenStr);
                } else {
                    const burger = menuCatalog.find(m => m.id === 'p1') || menuCatalog[0];
                    if (burger) onAddToCart(burger);
                    alert(`Pre-Order Token ${tokenStr} Validated! Meal tray added to checkout.`);
                }
                setQrClaimInput('');
            };

            const handleCheckoutSubmit = (bypassManagerPin = false) => {
                if (posCart.length === 0) return alert("Please select items to add to the checkout order.");
                if (isRfidShortage) return alert("Cannot complete checkout: Customer RFID balance is insufficient.");
                if (paymentMethod === 'cash' && cashTenderedVal < netTotal) return alert("Cannot complete checkout: Cash tendered is less than order total.");
                if (hasDietaryConflict) return alert("Dietary Lock Alert: Customer has a restricted item in cart! Please resolve before proceeding.");

                // FR-07: Pay Later Credit Liability Cap Check (₱500.00 Limit & Allowance Check)
                if (paymentMethod === 'pay_later') {
                    if (selectedStudent && selectedStudent.payLaterAllowance === false) {
                        return alert("Pay Later emergency credit mode is disabled for this student account! Please select RFID or Cash payment.");
                    }
                    const currentLiability = selectedStudent ? (selectedStudent.creditLiability || 0.0) : 0.0;
                    const newLiability = currentLiability + netTotal;
                    if (newLiability > 500.00 && !bypassManagerPin) {
                        setManagerPinModalOpen(true);
                        return;
                    }

                // Daily Spending Limit Guardrail Check for RFID Payments
                if (paymentMethod === 'rfid' && selectedStudent) {
                    const currentDailySpent = selectedStudent.dailySpent || 0.0;
                    const dailyCap = selectedStudent.dailyCap || 200.0;
                    if ((currentDailySpent + netTotal) > dailyCap && !bypassManagerPin) {
                        setManagerPinModalOpen(true);
                        return;
                    }

                const orderData = {
                    orderNo: `ORD-2026-${Math.floor(1000 + Math.random() * 9000)}`,
                    student: selectedStudent ? selectedStudent.name : "Walk-in Student",
                    studentId: selectedStudent ? selectedStudent.studentId : "N/A",
                    rfidUid: selectedStudent ? selectedStudent.rfidUid : "N/A",
                    items: [...posCart],
                    subtotal: cartSubtotal,
                    discountAmount: discountAmount,
                    discountLabel: discountLabel,
                    total: netTotal,
                    paymentMethod: paymentMethod.toUpperCase(),
                    payLaterNote: paymentMethod === 'pay_later' ? (payLaterNote || 'Canteen Emergency Credit') : null,
                    cashTendered: paymentMethod === 'cash' ? cashTenderedVal : null,
                    cashChange: paymentMethod === 'cash' ? cashChange : null,
                    timestamp: new Date().toLocaleString(),
                    status: 'COMPLETED'
                };

                if (paymentMethod === 'rfid' && selectedStudent) {
                    selectedStudent.dailySpent = (selectedStudent.dailySpent || 0.0) + netTotal;
                }

                setLastCompletedOrder(orderData);
                onCompleteCheckout(orderData);
                setReceiptModalOpen(true);
                setCashTendered('');
                setPayLaterNote('');
                setDiscountType('NONE');
                setCustomDiscountInput('');
            };

            const currentTab = ['register', 'ai_camera', 'qr_claim', 'shift_history', 'shift'].includes(activeTab) ? activeTab : 'register';

            return (

                                        </div>

                                                        </div>
                                                    </div>

                                return;
                            }
                            const matchedProd = menuCatalog.find(p => p.id === batchProdId);

                                return;

                                return;

                            if (!batchExpDate) {
                                setBatchFormError('Please select a valid expiration date.');
                                return;

                            const todayStr = new Date().toISOString().split('T')[0];
                            const expTime = new Date(batchExpDate).getTime();
                            const nowTime = new Date().getTime();
                            const daysDiff = (expTime - nowTime) / (1000 * 3600 * 24);

                            let calculatedStatus = 'ACTIVE';
                            if (batchExpDate < todayStr) calculatedStatus = 'EXPIRED';
                            else if (daysDiff <= 3) calculatedStatus = 'NEAR_EXPIRY';

                            const newBatch = {
                                id: `b-${Date.now()}`,
                                product_id: matchedProd.id,
                                product_name: matchedProd.name,
                                batch_number: batchNumber.trim() || `BATCH-2026-${Math.floor(1000 + Math.random() * 9000)}`,
                                quantity_received: qtyNum,
                                quantity_remaining: qtyNum,
                                unit_cost: unitCostNum,
                                expiration_date: batchExpDate,
                                status: calculatedStatus
                            };

                            // Increase stock in menuCatalog
                            onUpdateProduct({ ...matchedProd, stock: matchedProd.stock + newBatch.quantity_received });

                                window.CanteenDB.addInventoryBatch({
                                    product_id: newBatch.product_id,
                                    batch_number: newBatch.batch_number,
                                    quantity_received: newBatch.quantity_received,

                                    unit_cost: newBatch.unit_cost,

                        subtitle="Deduct spoiled or expired batch stock from FIFO inventory"

                        size="md"
                    >
                        <form onSubmit={async (e) => {
                            e.preventDefault();
                            setSpoilageFormError('');

                            if (!spoilageBatchId) {
                                setSpoilageFormError('Please select a target inventory batch.');
                                return;
                            }

                            const batch = inventoryBatches.find(b => b.id === spoilageBatchId);
                            if (!batch) {
                                setSpoilageFormError('Selected target batch was not found.');
                                return;
                            }

                            const deduqQty = parseInt(spoilageQty);
                            if (isNaN(deduqQty) || deduqQty <= 0) {
                                setSpoilageFormError('Spoilage quantity must be greater than 0.');
                                return;
                            }

                            if (deduqQty > batch.quantity_remaining) {
                                setSpoilageFormError(`Spoilage quantity (${deduqQty}) cannot exceed remaining batch stock (${batch.quantity_remaining} units).`);
                                return;
                            }

                            const updatedBatches = inventoryBatches.map(b => {
                                if (b.id === batch.id) {
                                    const newRem = Math.max(0, b.quantity_remaining - deduqQty);
                                    return { ...b, quantity_remaining: newRem, status: newRem === 0 ? 'DEPLETED' : b.status };
                                }
                                return b;
                            });
                            setInventoryBatches(updatedBatches);

                            // Deduct product stock in menuCatalog
                            const prod = menuCatalog.find(p => p.name === batch.product_name || p.id === batch.product_id);
                            if (prod) {
                                onUpdateProduct({ ...prod, stock: Math.max(0, prod.stock - deduqQty) });
                            }

                            // Persist to Supabase if available
                            if (window.CanteenDB) {
                                window.CanteenDB.logSpoilage(batch.id, deduqQty, spoilageReason, 'Admin User').catch(err => console.warn(err));
                            }
                            showToast(`Logged ${deduqQty} units spoilage for ${batch.batch_number}`);

                            setSpoilageBatchId(''); setSpoilageQty('1'); setSpoilageFormError('');

            const handleRegisterUser = (newUser) => {
                setRegisteredUsers([newUser, ...registeredUsers]);
                if (newUser.role === 'Student') {
                    setCurrentStudent(newUser);
                    setStudentBalance(newUser.balance);
                    setDailyLimit(newUser.dailyCap);
                    setActiveRole('STUDENT');
                } else if (newUser.role === 'Parent') {
                    setCurrentParent(newUser);
                    setActiveRole('PARENT');
                } else if (newUser.role === 'Cashier') {
                    setActiveRole('CASHIER');
                } else if (newUser.role === 'Admin') {
                    setActiveRole('ADMIN');
                }

                const newNotif = {
                    id: 'n_' + Date.now(),
                    user_id: newUser.id,
                    title: 'Welcome to NovaLunch! 🎉',
                    message: `Your ${newUser.role} profile is active and synced.`,
                    type: 'account_created',

                    created_at: 'Just now'
                };
                setNotifications([newNotif, ...notifications]);
                showToast(`Registered new ${newUser.role} account for ${newUser.name}!`);
            };

            const handleSendParentLinkRequest = async (studentIdentifier) => {
                const targetStud = registeredUsers.find(u => 
                    (u.studentId && u.studentId.toLowerCase() === studentIdentifier.toLowerCase()) || 
                    (u.email && u.email.toLowerCase() === studentIdentifier.toLowerCase()) ||
                    (u.name && u.name.toLowerCase().includes(studentIdentifier.toLowerCase()))
                );

                if (!targetStud) {
                    throw new Error(`No student found matching Student ID or Email "${studentIdentifier}". Please verify credentials.`);
                }

                const isAlreadyLinked = parentStudentLinks.some(l => l.studentId === targetStud.id || l.studentIdNumber === targetStud.studentId);
                if (isAlreadyLinked) {
                    throw new Error(`Student ${targetStud.name} (${targetStud.studentId}) is already linked to your parent account.`);
                }

                const isPending = parentStudentLinkRequests.some(r => (r.student_id === targetStud.id || r.student_id_number === targetStud.studentId) && r.status === 'pending');
                if (isPending) {
                    throw new Error(`A link request for ${targetStud.name} is already pending student confirmation.`);
                }

                const newReq = {
                    id: 'req_' + Date.now(),
                    parent_id: currentParent?.id || 'u201',
                    parentName: currentParent?.name || 'Maria Santos',
                    parentEmail: currentParent?.email || 'maria.santos@gmail.com',
                    student_id: targetStud.id,
                    student_id_number: targetStud.studentId,
                    studentName: targetStud.name,
                    status: 'pending',
                    created_at: 'Just now'
                };

                setParentStudentLinkRequests([newReq, ...parentStudentLinkRequests]);

                if (window.CanteenDB && currentParent?.id) {
                    window.CanteenDB.sendParentLinkRequest(currentParent.id, targetStud.studentId || targetStud.id).catch(err => console.warn("Link request cloud sync warning", err));
                }

                const notifForStudent = {
                    id: 'n_' + Date.now(),
                    user_id: targetStud.id,
                    title: 'Parent Account Link Request',
                    message: `Parent ${currentParent?.name || 'Maria Santos'} (${currentParent?.email || 'maria.santos@gmail.com'}) sent a request to link to your account.`,
                    type: 'link_request',
                    is_read: false,
                    created_at: 'Just now'
                };
                setNotifications([notifForStudent, ...notifications]);
                showToast(`Link request sent to ${targetStud.name}! Waiting for student confirmation.`);
            };

            const handleRespondLinkRequest = (requestId, accept) => {
                const targetReq = parentStudentLinkRequests.find(r => r.id === requestId);
                if (window.CanteenDB && requestId && targetReq) {
                    window.CanteenDB.respondToLinkRequest(requestId, targetReq.parent_id, targetReq.student_id, accept, targetReq.studentName || 'Student').catch(err => console.warn("Link response cloud sync warning", err));
                }
                if (!targetReq) return;

                const newStatus = accept ? 'accepted' : 'rejected';
                setParentStudentLinkRequests(parentStudentLinkRequests.map(r => r.id === requestId ? { ...r, status: newStatus } : r));

                if (accept) {
                    setParentStudentLinks([...parentStudentLinks, { parentId: targetReq.parent_id, studentId: targetReq.student_id, studentIdNumber: targetReq.student_id_number }]);
                }

                const parentNotif = {
                    id: 'n_' + Date.now(),
                    user_id: targetReq.parent_id,
                    title: accept ? 'Link Request Accepted! 🎉' : 'Link Request Declined',
                    message: accept ? `Student ${targetReq.studentName} accepted your account link request.` : `Student ${targetReq.studentName} declined your link request.`,
                    type: accept ? 'link_accepted' : 'link_rejected',
                    is_read: false,
                    created_at: 'Just now'
                };
                setNotifications([parentNotif, ...notifications]);
                showToast(accept ? `Accepted parent link request!` : `Declined link request.`);

            const syncCloudData = useCallback(async () => {
                let connected = false;

                            })));
                            connected = true;
